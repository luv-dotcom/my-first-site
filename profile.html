<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-color: #fafafa; 
            --border-color: #dbdbdb; 
            --text-main: #262626; 
            --text-muted: #8e8e8e; 
            --card-bg: #ffffff; 
            --btn-grey: #efefef; 
            --insta-blue: #0095f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-top: 60px; padding-bottom: 60px; }
        a { text-decoration: none; color: inherit; }
        
        /* Navbar */
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .nav-container { width: 100%; max-width: 975px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .bottom-navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 52px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: none; justify-content: space-around; align-items: center; z-index: 1000; }
        .bottom-navbar i { font-size: 22px; }
        
        /* Profile Layout */
        .profile-container { max-width: 935px; margin: 30px auto 0 auto; padding: 0 20px; }
        .profile-header { display: flex; gap: 40px; padding-bottom: 44px; border-bottom: 1px solid var(--border-color); align-items: center; }
        .avatar-section { flex: 1; display: flex; justify-content: center; }
        .avatar-section img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); background: #eee; }
        .info-section { flex: 2; display: flex; flex-direction: column; gap: 18px; }
        .username-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .profile-username { font-size: 28px; font-weight: 300; min-width: 120px; }
        .edit-profile-btn { background-color: transparent; border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .edit-profile-btn:hover { background-color: var(--btn-grey); }
        
        /* Stats Row with click pointers */
        .stats-row { display: flex; gap: 40px; font-size: 16px; list-style: none; }
        .stats-row li { cursor: pointer; }
        .stats-row li span { font-weight: 600; }
        .bio-row { font-size: 14px; line-height: 20px; }
        .full-name { font-weight: 600; display: block; margin-bottom: 2px; }
        .bio-link { color: #00376b; font-weight: 600; }
        
        /* Tabs */
        .profile-tabs { display: flex; justify-content: center; gap: 60px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; font-weight: 600; }
        .tab-item { display: flex; align-items: center; gap: 6px; padding: 18px 0; color: var(--text-muted); cursor: pointer; border-top: 1px solid transparent; margin-top: -1px; transition: all 0.2s; }
        .tab-item.active { color: var(--text-main); border-top: 1px solid var(--text-main); }
        
        /* Gallery */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 5px; min-height: 200px; }
        .grid-item { position: relative; aspect-ratio: 1 / 1; background-color: #efefef; overflow: hidden; cursor: pointer; animation: fadeIn 0.5s ease; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .grid-item-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; gap: 30px; color: white; font-size: 18px; font-weight: 600; opacity: 0; transition: opacity 0.2s ease; }
        .grid-item:hover .grid-item-overlay { opacity: 1; }
        .overlay-stat { display: flex; align-items: center; gap: 7px; }
        .no-posts { grid-column: span 3; text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 18px; }

        /* Smooth List Modal Styles */
        .list-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .list-modal-box { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; max-height: 400px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .list-modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #efefef; padding-bottom: 10px; margin-bottom: 15px; }
        .list-modal-header h3 { font-size: 18px; font-weight: 600; }
        .list-modal-header i { cursor: pointer; font-size: 20px; color: var(--text-muted); }
        .list-users-container { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #fafafa; }
        .user-item i { font-size: 32px; color: #dbdbdb; }
        .user-item span { font-weight: 600; font-size: 14px; cursor: pointer; }
        .user-item span:hover { text-decoration: underline; }

        /* Skeleton Shimmer Loading Effect */
        .skeleton { background: linear-gradient(90deg, #f2f2f2 25%, #e6e6e6 50%, #f2f2f2 75%); background-size: 200% 100%; animation: loading 1.5s infinite; color: transparent !important; border-radius: 4px; }
        .skeleton-img { border-radius: 50% !important; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Smooth Modal Style Upgrade */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { opacity: 1; display: flex; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; transform: scale(0.8); transition: transform 0.3s ease; }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-box h3 { margin-bottom: 20px; font-size: 20px; text-align: center; font-weight: 600; }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; transition: border 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--text-muted); background: white; }
        .input-group textarea { resize: none; height: 70px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
        .modal-btn { padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
        .modal-btn:hover { opacity: 0.9; }
        .btn-cancel { background: var(--btn-grey); color: #262626; }
        .btn-save { background: var(--insta-blue); color: white; }
        .btn-save:disabled { background: #b2dffc; cursor: not-allowed; }

        /* Responsive Breakpoint Mobile UI updates */
        @media (max-width: 768px) { 
            body { padding-top: 50px; } 
            .top-navbar .nav-icons { display: none; } 
            .bottom-navbar { display: flex; } 
            .profile-container { padding: 0; margin-top: 10px; } 
            .profile-header { gap: 20px; padding: 15px 16px; border-bottom: none; } 
            .avatar-section img { width: 85px; height: 85px; } 
            .username-row { display: grid; grid-template-columns: 1fr auto; width: 100%; gap: 12px; } 
            .profile-username { font-size: 22px; } 
            .edit-profile-btn { grid-column: span 2; width: 100%; text-align: center; background-color: var(--btn-grey); border: none; padding: 7px; } 
            .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 12px 0; font-size: 14px; gap: 0; } 
            .stats-row li { display: flex; flex-direction: column; color: var(--text-muted); } 
            .stats-row li span { color: var(--text-main); } 
            .bio-row { padding: 4px 16px 15px 16px; } 
            .profile-tabs { gap: 0; justify-content: space-around; border-top: 1px solid var(--border-color); } 
            .profile-tabs span { display: none; } 
            .tab-item i { font-size: 22px; } 
            .tab-item { padding: 14px 0; width: 100%; justify-content: center; } 
            .tab-item.active { border-top: 2px solid var(--text-main); }
            .gallery-grid { gap: 3px; margin-top: 2px; } 
            .grid-item-overlay { display: none; } 
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo"><a href="home.html" class="logo-text">Instagram</a></div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic" id="nav-avatar"></a>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <header class="profile-header">
            <div class="avatar-section">
                <img src="" alt="Avatar" id="main-avatar" class="skeleton skeleton-img">
            </div>
            <div class="info-section">
                <div class="username-row">
                    <h2 class="profile-username skeleton" id="prof-username">&nbsp;</h2>
                    <button class="edit-profile-btn" id="edit-profile-trigger">Edit Profile</button>
                    <i class="fa-solid fa-right-from-bracket" id="logout-btn" style="font-size: 18px; cursor: pointer; color: #ed4956;" title="Logout Account"></i>
                </div>
                <ul class="stats-row">
                    <li><span id="post-count">0</span> posts</li>
                    <li id="follower-btn"><span id="follower-count">0</span> followers</li>
                    <li id="following-btn"><span id="following-count">0</span> following</li>
                </ul>
                <div class="bio-row">
                    <span class="full-name skeleton" id="prof-name">&nbsp;</span>
                    <p id="prof-bio" class="skeleton">&nbsp;</p>
                    <a href="https://github.com" target="_blank" class="bio-link">github.com/your-repo</a>
                </div>
            </div>
        </header>

        <div class="profile-tabs">
            <div class="tab-item active" data-tab="posts"><i class="fa-solid fa-table-cells"></i> <span>Posts</span></div>
            <div class="tab-item" data-tab="reels"><i class="fa-regular fa-clapperboard"></i> <span>Reels</span></div>
            <div class="tab-item" data-tab="tagged"><i class="fa-regular fa-id-card"></i> <span>Tagged</span></div>
        </div>

        <section class="gallery-grid" id="posts-gallery">
            <div class="grid-item skeleton"></div>
            <div class="grid-item skeleton"></div>
            <div class="grid-item skeleton"></div>
        </section>
    </main>

    <div class="list-modal-overlay" id="list-modal">
        <div class="list-modal-box">
            <div class="list-modal-header">
                <h3 id="modal-title">Users</h3>
                <i class="fa-solid fa-xmark" id="close-list-modal"></i>
            </div>
            <div class="list-users-container" id="modal-users-list">
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <h3>Edit Profile</h3>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="input-username">
            </div>
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="input-name">
            </div>
            <div class="input-group">
                <label>Profile Picture URL</label>
                <input type="text" id="input-pic">
            </div>
            <div class="input-group">
                <label>Bio</label>
                <textarea id="input-bio"></textarea>
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select id="input-gender">
                    <option value="Not Specified">Prefer not to say</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Custom">Custom</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="btn-close-modal">Cancel</button>
                <button class="modal-btn btn-save" id="btn-save-profile">Save</button>
            </div>
        </div>
    </div>

    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
        <img src="https://picsum.photos/150/150?random=1" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--border-color);" id="bottom-avatar">
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let databaseNameKey = "fullName"; 
        let defaultPic = "https://picsum.photos/150/150?random=1";
        let userCurrentGender = "Not Specified";
        
        const targetUserId = localStorage.getItem("active_user");

        if (!targetUserId) {
            window.location.href = "index.html";
        }

        function removeSkeletons() {
            document.querySelectorAll('.skeleton').forEach(el => el.classList.remove('skeleton'));
        }

        // --- REALTIME PROFILE DATA SYNC ---
        function listenToProfileData() {
            const docRef = doc(db, "users", targetUserId);
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    const profUsername = document.getElementById("prof-username");
                    const profBio = document.getElementById("prof-bio");
                    const profName = document.getElementById("prof-name");
                    
                    profUsername.innerText = userData.username || "no_username";
                    profBio.innerText = userData.bio || "No bio yet.";
                    userCurrentGender = userData.gender || "Not Specified";

                    const currentPic = userData.profilePic || defaultPic;
                    document.getElementById("main-avatar").src = currentPic;
                    document.getElementById("nav-avatar").src = currentPic;
                    document.getElementById("bottom-avatar").src = currentPic;

                    let finalName = "Instagram User"; 
                    if(userData.fullName) {
                        finalName = userData.fullName;
                        databaseNameKey = "fullName";
                    } else if (userData.name) {
                        finalName = userData.name;
                        databaseNameKey = "name";
                    } else {
                        for (let key in userData) {
                            if (!["username", "bio", "profilePic", "gender", "email", "password"].includes(key)) {
                                finalName = userData[key];
                                databaseNameKey = key;
                                break;
                            }
                        }
                    }
                    profName.innerText = finalName;
                    removeSkeletons();
                }
            }, (error) => {
                console.error("Live profile listen sync failed: ", error);
            });

            // LIVE FOLLOWERS COUNTER
            const followersQuery = query(collection(db, "follows"), where("following", "==", targetUserId));
            onSnapshot(followersQuery, (snapshot) => {
                document.getElementById("follower-count").innerText = snapshot.size;
            });

            // LIVE FOLLOWING COUNTER
            const followingQuery = query(collection(db, "follows"), where("follower", "==", targetUserId));
            onSnapshot(followingQuery, (snapshot) => {
                document.getElementById("following-count").innerText = snapshot.size;
            });
        }

        // --- REALTIME POSTS SYNC GALLERY ---
        function listenToUserPosts() {
            const gallery = document.getElementById("posts-gallery");
            const q = query(collection(db, "posts"), where("userId", "==", targetUserId));
            
            onSnapshot(q, (querySnapshot) => {
                gallery.innerHTML = ""; 
                let count = 0;

                if (querySnapshot.empty) {
                    gallery.innerHTML = `<div class="no-posts"><i class="fa-solid fa-camera" style="font-size:40px; margin-bottom:10px; display:block;"></i>No Posts Yet</div>`;
                    document.getElementById("post-count").innerText = "0";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const postData = doc.data();
                    count++;

                    const gridItem = document.createElement("div");
                    gridItem.className = "grid-item";
                    gridItem.innerHTML = `
                        <img src="${postData.postImg || defaultPic}" alt="post">
                        <div class="grid-item-overlay">
                            <div class="overlay-stat"><i class="fa-solid fa-heart"></i> ${postData.likes || 0}</div>
                            <div class="overlay-stat"><i class="fa-solid fa-comment"></i> 0</div>
                        </div>
                    `;
                    gallery.appendChild(gridItem);
                });

                document.getElementById("post-count").innerText = count;
            }, (error) => {
                console.error("Live posts sync failed: ", error);
                gallery.innerHTML = `<div class="no-posts">Error syncing posts!</div>`;
            });
        }

        // --- FOLLOWERS / FOLLOWING LIST POPUP SYSTEM ---
        const listModal = document.getElementById("list-modal");
        const modalTitle = document.getElementById("modal-title");
        const modalUsersList = document.getElementById("modal-users-list");
        
        document.getElementById("close-list-modal").onclick = () => {
            listModal.style.display = "none";
        };

        // Followers Click Trigger
        document.getElementById("follower-btn").onclick = async () => {
            modalTitle.innerText = "Followers";
            modalUsersList.innerHTML = '<div style="text-align:center; padding:10px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>';
            listModal.style.display = "flex";

            const q = query(collection(db, "follows"), where("following", "==", targetUserId));
            const querySnapshot = await getDocs(q);
            
            modalUsersList.innerHTML = querySnapshot.empty ? '<div style="text-align:center; color:gray; padding:10px;">No followers yet.</div>' : '';
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                modalUsersList.innerHTML += `
                    <div class="user-item">
                        <i class="fa-solid fa-circle-user"></i>
                        <span onclick="window.location.href='user-profile.html?username=${data.follower}'">@${data.follower}</span>
                    </div>`;
            });
        };

        // Following Click Trigger
        document.getElementById("following-btn").onclick = async () => {
            modalTitle.innerText = "Following";
            modalUsersList.innerHTML = '<div style="text-align:center; padding:10px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>';
            listModal.style.display = "flex";

            const q = query(collection(db, "follows"), where("follower", "==", targetUserId));
            const querySnapshot = await getDocs(q);
            
            modalUsersList.innerHTML = querySnapshot.empty ? '<div style="text-align:center; color:gray; padding:10px;">Not following anyone.</div>' : '';
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                modalUsersList.innerHTML += `
                    <div class="user-item">
                        <i class="fa-solid fa-circle-user"></i>
                        <span onclick="window.location.href='user-profile.html?username=${data.following}'">@${data.following}</span>
                    </div>`;
            });
        };


        // --- EDIT PROFILE MODAL TRIGGER ---
        const modal = document.getElementById("edit-modal");
        const editBtn = document.getElementById("edit-profile-trigger");
        const closeBtn = document.getElementById("btn-close-modal");
        const saveBtn = document.getElementById("btn-save-profile");

        const inputUsername = document.getElementById("input-username");
        const inputName = document.getElementById("input-name");
        const inputPic = document.getElementById("input-pic");
        const inputBio = document.getElementById("input-bio");
        const inputGender = document.getElementById("input-gender");

        editBtn.addEventListener("click", () => {
            inputUsername.value = document.getElementById("prof-username").innerText;
            inputName.value = document.getElementById("prof-name").innerText;
            const mainAvatarSrc = document.getElementById("main-avatar").src;
            inputPic.value = mainAvatarSrc.includes("random=") ? "" : mainAvatarSrc;
            inputBio.value = document.getElementById("prof-bio").innerText === "No bio yet." ? "" : document.getElementById("prof-bio").innerText;
            inputGender.value = userCurrentGender;
            
            modal.style.display = "flex";
            setTimeout(() => modal.classList.add("show"), 10);
        });

        const closeModalFn = () => {
            modal.classList.remove("show");
            setTimeout(() => modal.style.display = "none", 300);
        };
        closeBtn.addEventListener("click", closeModalFn);
        modal.addEventListener("click", (e) => { if(e.target === modal) closeModalFn(); });

        saveBtn.addEventListener("click", async () => {
            saveBtn.innerText = "Updating...";
            saveBtn.disabled = true;
            try {
                const docRef = doc(db, "users", targetUserId);
                const updatedPicUrl = inputPic.value.trim() || defaultPic;

                await updateDoc(docRef, {
                    username: inputUsername.value.trim().toLowerCase(),
                    [databaseNameKey]: inputName.value.trim(),
                    bio: inputBio.value.trim(),
                    profilePic: updatedPicUrl,
                    gender: inputGender.value
                });

                const currentLocalUser = localStorage.getItem("active_user");
                const newUsernameVal = inputUsername.value.trim().toLowerCase();
                if(currentLocalUser !== newUsernameVal){
                    localStorage.setItem("active_user", newUsernameVal);
                }

                closeModalFn();
            } catch (error) {
                alert("Error saving profiles fields standard details!");
                console.error(error);
            } finally {
                saveBtn.innerText = "Save";
                saveBtn.disabled = false;
            }
        });

        // --- TAB SWITCHING LOGIC ---
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelector('.tab-item.active').classList.remove('active');
                this.classList.add('active');
                
                const gallery = document.getElementById("posts-gallery");
                const currentTabType = this.getAttribute('data-tab');
                
                if(currentTabType !== 'posts') {
                    gallery.innerHTML = `<div class="no-posts"><i class="fa-regular fa-square-minus" style="font-size:40px; margin-bottom:10px; display:block;"></i>No Dynamic ${this.innerText} Available</div>`;
                } else {
                    listenToUserPosts();
                }
            });
        });

        // --- LIVE LOGOUT TRIGGER SYSTEM ---
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                const checkUserConfirmation = confirm("Kya aap sach me Logout hona chahte hain?");
                if (checkUserConfirmation) {
                    localStorage.removeItem("active_user");
                    window.location.href = "index.html";
                }
            });
        }

        // Initialize Engine
        listenToProfileData();
        listenToUserPosts();
    </script>
</body>
</html>
