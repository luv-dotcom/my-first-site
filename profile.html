<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Profile</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --card-bg: #ffffff;
            --link-color: #0095f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        a { text-decoration: none; color: inherit; }

        /* --- NAVBARS (SAME AS HOME/MESSAGES FOR CONSISTENCY) --- */
        .top-navbar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .nav-container {
            width: 100%; max-width: 975px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid black; }

        .bottom-navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 52px;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .bottom-navbar i { font-size: 22px; }

        /* --- PROFILE MAIN CONTAINER --- */
        .profile-container {
            max-width: 935px;
            margin: 90px auto 0 auto;
            padding: 0 20px;
        }

        /* Profile Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 100px;
            padding-bottom: 44px;
            border-bottom: 1px solid var(--border-color);
        }
        .profile-image-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }
        .main-profile-avatar {
            width: 150px; height: 150px;
            border-radius: 50%; object-fit: cover;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .profile-info-container {
            flex-grow: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .username-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-username {
            font-size: 28px;
            font-weight: 300;
        }
        .edit-profile-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 5px 9px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .settings-icon { font-size: 20px; cursor: pointer; }

        .stats-row {
            display: flex;
            gap: 40px;
            list-style: none;
            font-size: 16px;
        }
        .stats-row span { font-weight: 600; }

        .bio-row .full-name {
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }
        .bio-row .bio-text { font-size: 14px; line-height: 20px; }

        /* --- TABS SYSTEM (POSTS, REELS, SAVED) --- */
        .profile-tabs {
            display: flex;
            justify-content: center;
            gap: 60px;
            border-top: 1px solid transparent;
            margin-top: -1px;
        }
        .tab-item {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 52px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-muted);
            border-top: 1px solid transparent;
        }
        .tab-item.active-tab {
            color: var(--text-main);
            border-top: 1px solid var(--text-main);
        }

        /* --- POSTS GRID --- */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-top: 10px;
        }
        .grid-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            cursor: pointer;
            overflow: hidden;
        }
        .grid-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: filter 0.3s ease;
        }
        /* Hover Overlay Overlay Effect */
        .grid-item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex; justify-content: center; align-items: center;
            gap: 30px; color: white; font-weight: 600; font-size: 18px;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .grid-item:hover .grid-item-overlay { opacity: 1; }
        .grid-item:hover img { filter: brightness(0.8); }

        /* --- 📱 MOBILE ADAPTIVE DESIGN --- */
        @media (max-width: 735px) {
            .top-navbar .nav-icons { display: none; }
            .bottom-navbar { display: flex; }
            
            .profile-container { margin-top: 60px; padding: 0; }
            .profile-header {
                padding: 16px; gap: 24px; border-bottom: none;
            }
            .main-profile-avatar { width: 77px; height: 77px; }
            .username-row {
                flex-direction: column; align-items: flex-start; gap: 10px;
            }
            .profile-username { font-size: 20px; }
            
            /* Mobile Stats Bar Placement */
            .stats-row {
                display: grid; grid-template-columns: repeat(3, 1fr);
                text-align: center; padding: 12px 0;
                border-top: 1px solid var(--border-color);
                border-bottom: 1px solid var(--border-color);
                font-size: 14px; color: var(--text-muted);
            }
            .stats-row li { display: flex; flex-direction: column; }
            .stats-row span { color: var(--text-main); font-size: 16px; }

            .bio-row { padding: 0 16px 16px 16px; }
            .profile-tabs { gap: 0; justify-content: space-around; border-top: 1px solid var(--border-color); }
            .tab-item span { display: none; } /* Hide text on mobile tabs, keep icons */
            .tab-item i { font-size: 24px; }
            .tab-item.active-tab { border-top: none; color: var(--link-color); }

            .posts-grid { gap: 3px; margin-top: 0; }
            .grid-item-overlay { display: none; } /* Disable hover on mobile screens */
        }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="home.html" class="logo-text">Instagram</a>
            </div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic"></a>
            </div>
        </div>
    </nav>

    <!-- MAIN PROFILE WORKSPACE -->
    <main class="profile-container">
        
        <!-- Header: Avatar + Meta Stats -->
        <header class="profile-header">
            <div class="profile-image-container">
                <img src="https://picsum.photos/150/150?random=1" alt="Profile Picture" class="main-profile-avatar">
            </div>
            <div class="profile-info-container">
                <div class="username-row">
                    <h2 class="profile-username">my_username</h2>
                    <a href="settings.html" class="edit-profile-btn">Edit Profile</a>
                    <a href="settings.html"><i class="fa-solid fa-gear settings-icon"></i></a>
                </div>
                
                <!-- Desktop Stats Grid -->
                <ul class="stats-row">
                    <li><span>6</span> posts</li>
                    <li><span>1.2k</span> followers</li>
                    <li><span>450</span> following</li>
                </ul>

                <div class="bio-row">
                    <span class="full-name">Your Name</span>
                    <span class="bio-text">💻 Tech Enthusiast & Designer<br>🚀 Building something awesome with Firebase!<br>📍 India</span>
                </div>
            </div>
        </header>

        <!-- Profile Sub-Tabs Navigation -->
        <div class="profile-tabs">
            <div class="tab-item active-tab"><i class="fa-solid fa-grid-3x3"></i> <span>Posts</span></div>
            <div class="tab-item"><i class="fa-solid fa-clapperboard"></i> <span>Reels</span></div>
            <div class="tab-item"><i class="fa-regular fa-bookmark"></i> <span>Saved</span></div>
        </div>

        <!-- Image Gallery Grid Area -->
        <section class="posts-grid">
            <!-- Grid Item 1 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=11" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 124</span>
                    <span><i class="fa-solid fa-comment"></i> 12</span>
                </div>
            </div>
            <!-- Grid Item 2 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=12" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 89</span>
                    <span><i class="fa-solid fa-comment"></i> 4</span>
                </div>
            </div>
            <!-- Grid Item 3 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=13" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 256</span>
                    <span><i class="fa-solid fa-comment"></i> 32</span>
                </div>
            </div>
            <!-- Grid Item 4 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=14" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 412</span>
                    <span><i class="fa-solid fa-comment"></i> 18</span>
                </div>
            </div>
            <!-- Grid Item 5 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=15" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 175</span>
                    <span><i class="fa-solid fa-comment"></i> 9</span>
                </div>
            </div>
            <!-- Grid Item 6 -->
            <div class="grid-item">
                <img src="https://picsum.photos/500/500?random=16" alt="Post">
                <div class="grid-item-overlay">
                    <span><i class="fa-solid fa-heart"></i> 310</span>
                    <span><i class="fa-solid fa-comment"></i> 22</span>
                </div>
            </div>
        </section>

    </main>

    <!-- MOBILE BOTTOM NAVBAR -->
    <div class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid black;"></a>
    </div>

</body>
</html>
