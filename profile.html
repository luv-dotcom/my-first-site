<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #fafafa; --border-color: #dbdbdb; --text-main: #262626; --text-muted: #8e8e8e; --card-bg: #ffffff; --btn-grey: #efefef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-top: 60px; padding-bottom: 60px; }
        a { text-decoration: none; color: inherit; }
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .nav-container { width: 100%; max-width: 975px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid black; }
        .bottom-navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 52px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: none; justify-content: space-around; align-items: center; z-index: 1000; }
        .bottom-navbar i { font-size: 22px; }
        .profile-container { max-width: 935px; margin: 30px auto 0 auto; padding: 0 20px; }
        .profile-header { display: flex; gap: 40px; padding-bottom: 44px; border-bottom: 1px solid var(--border-color); align-items: center; }
        .avatar-section { flex: 1; display: flex; justify-content: center; }
        .avatar-section img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .info-section { flex: 2; display: flex; flex-direction: column; gap: 18px; }
        .username-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .profile-username { font-size: 28px; font-weight: 300; }
        .edit-profile-btn { background-color: transparent; border: 1px solid var(--border-color); padding: 5px 9px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .stats-row { display: flex; gap: 40px; font-size: 16px; list-style: none; }
        .stats-row li span { font-weight: 600; }
        .bio-row { font-size: 14px; line-height: 20px; }
        .full-name { font-weight: 600; display: block; margin-bottom: 2px; }
        .bio-link { color: #00376b; font-weight: 600; }
        .profile-tabs { display: flex; justify-content: center; gap: 60px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; font-weight: 600; }
        .tab-item { display: flex; align-items: center; gap: 6px; padding: 18px 0; color: var(--text-muted); cursor: pointer; border-top: 1px solid transparent; margin-top: -1px; }
        .tab-item.active { color: var(--text-main); border-top: 1px solid var(--text-main); }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 5px; }
        .grid-item { position: relative; aspect-ratio: 1 / 1; background-color: #efefef; overflow: hidden; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .grid-item-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; gap: 30px; color: white; font-size: 18px; font-weight: 600; opacity: 0; transition: opacity 0.2s ease; }
        .grid-item:hover .grid-item-overlay { opacity: 1; }
        .overlay-stat { display: flex; align-items: center; gap: 7px; }
        @media (max-width: 768px) { body { padding-top: 50px; } .top-navbar .nav-icons { display: none; } .bottom-navbar { display: flex; } .profile-container { padding: 0; margin-top: 15px; } .profile-header { gap: 20px; padding: 10px 16px 24px 16px; border-bottom: none; } .avatar-section img { width: 77px; height: 77px; } .username-row { flex-direction: column; align-items: flex-start; gap: 10px; } .profile-username { font-size: 22px; } .edit-profile-btn { width: 100%; text-align: center; background-color: var(--btn-grey); border: none; } .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 12px 0; font-size: 14px; gap: 0; } .stats-row li { display: flex; flex-direction: column; color: var(--text-muted); } .stats-row li span { color: var(--text-main); } .bio-row { padding: 4px 16px; } .profile-tabs { gap: 0; justify-content: space-around; } .profile-tabs span { display: none; } .tab-item i { font-size: 24px; } .tab-item { padding: 14px 0; } .gallery-grid { gap: 3px; } .grid-item-overlay { display: none; } }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo"><a href="home.html" class="logo-text">Instagram</a></div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic"></a>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <header class="profile-header">
            <div class="avatar-section"><img src="https://picsum.photos/150/150?random=1" alt="My Big Avatar"></div>
            <div class="info-section">
                <div class="username-row">
                    <h2 class="profile-username" id="prof-username">Loading...</h2>
                    <button class="edit-profile-btn">Edit Profile</button>
                    <a href="settings.html"><i class="fa-solid fa-gear" style="font-size: 20px; cursor: pointer; color: #262626;"></i></a>
                </div>
                <ul class="stats-row">
                    <li><span>6</span> posts</li>
                    <li><span>342</span> followers</li>
                    <li><span>189</span> following</li>
                </ul>
                <div class="bio-row">
                    <span class="full-name" id="prof-name">Loading Name...</span>
                    <p id="prof-bio">Loading Bio...</p>
                    <a href="https://github.com" target="_blank" class="bio-link">github.com/your-repo</a>
                </div>
            </div>
        </header>

        <div class="profile-tabs">
            <div class="tab-item active"><i class="fa-solid fa-table-cells"></i> <span>Posts</span></div>
            <div class="tab-item"><i class="fa-regular fa-clapperboard"></i> <span>Reels</span></div>
            <div class="tab-item"><i class="fa-regular fa-id-card"></i> <span>Tagged</span></div>
        </div>

        <section class="gallery-grid">
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=10" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 142</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 18</div></div></div>
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=11" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 98</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 4</div></div></div>
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=12" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 256</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 32</div></div></div>
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=13" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 512</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 45</div></div></div>
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=14" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 310</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 12</div></div></div>
            <div class="grid-item"><img src="https://picsum.photos/400/400?random=15" alt="post"><div class="grid-item-overlay"><div class="overlay-stat"><i class="fa-solid fa-heart"></i> 190</div><div class="overlay-stat"><i class="fa-solid fa-comment"></i> 7</div></div></div>
        </section>
    </main>

    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
        <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid black;"></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        async function fetchProfileData() {
            try {
                const docRef = doc(db, "users", "luv_5");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    document.getElementById("prof-username").innerText = userData.username || "No Username";
                    document.getElementById("prof-bio").innerText = userData.bio || "No Bio";

                    // ULTIMATE AUTOMATIC CHECK: Yeh loop poore data ko scan karke name field dhoond nikalega!
                    let finalName = "User"; 
                    
                    for (let key in userData) {
                        // Agar field ka naam 'username' ya 'bio' nahi hai, toh wahi hamara 'name' hai!
                        if (key !== "username" && key !== "bio") {
                            finalName = userData[key];
                            break;
                        }
                    }
                    
                    document.getElementById("prof-name").innerText = finalName;

                } else {
                    console.log("Firebase mein aisa koi user nahi mila!");
                }
            } catch (error) {
                console.error("Data laane mein dikkat hui: ", error);
            }
        }

        fetchProfileData();
    </script>
</body>
</html>
