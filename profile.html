<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #000;
            --surface: #121212;
            --surface-soft: #1a1a1a;
            --surface-lift: #262626;
            --border-color: #262626;
            --text-main: #fafafa;
            --text-muted: #a8a8a8;
            --blue: #0095f6;
            --danger: #ed4956;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body { padding-bottom: 62px; }

        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        button { cursor: pointer; }

        .navbar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            width: 100%;
            max-width: 975px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left, .nav-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand {
            font-size: 20px;
            font-weight: 750;
            letter-spacing: 0;
        }

        .icon-btn {
            border: none;
            background: transparent;
            color: white;
            font-size: 21px;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .icon-btn:hover { background: var(--surface-lift); }

        .container {
            max-width: 935px;
            margin: 30px auto 0;
            padding: 0 20px;
        }

        .profile-header {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 72px;
            align-items: center;
            margin-bottom: 36px;
        }

        .avatar-section {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #fbc531, #c23616, #9c88ff);
            justify-self: center;
        }

        .avatar-section-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 4px;
            background: var(--bg-color);
        }

        .avatar-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .info-section {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .username-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .username {
            font-size: 28px;
            font-weight: 350;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 360px;
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-edit {
            min-height: 32px;
            background: var(--surface-lift);
            border: none;
            color: white;
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        .btn-edit:hover { background: #333; }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover { background: #1877f2; }

        .stats-row {
            display: flex;
            gap: 38px;
            font-size: 16px;
        }

        .stats-row div { cursor: pointer; }
        .stats-row b { font-weight: 700; }

        .bio-info {
            font-size: 15px;
            line-height: 1.45;
            max-width: 520px;
        }

        .bio-info .full-name {
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .profile-link {
            color: #e0f1ff;
            font-weight: 650;
            margin-top: 4px;
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .mobile-stats-row {
            display: none;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin: 20px -20px 0;
        }

        .mobile-stats-row div {
            flex: 1;
            padding: 13px 4px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .mobile-stats-row b {
            display: block;
            color: var(--text-main);
            font-size: 16px;
        }

        .highlights {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0 28px;
        }

        .highlights::-webkit-scrollbar { display: none; }

        .highlight-item {
            width: 78px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            color: white;
            font-size: 12px;
            font-weight: 650;
            cursor: pointer;
        }

        .highlight-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid #3a3a3a;
            padding: 3px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .highlight-ring i {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--surface-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #d8d8d8;
        }

        .tabs {
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 62px;
        }

        .tab-item {
            height: 52px;
            border: none;
            border-top: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 0;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tab-item.active {
            color: var(--text-main);
            border-top-color: var(--text-main);
        }

        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding-bottom: 28px;
        }

        .post-item {
            position: relative;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            background: var(--surface-soft);
            overflow: hidden;
        }

        .post-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            color: white;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-weight: 750;
        }

        .post-item:hover .overlay { opacity: 1; }
        .post-item:hover img { transform: scale(1.04); }

        .empty-state {
            grid-column: span 3;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            color: var(--text-muted);
            padding: 44px 20px;
        }

        .empty-state i {
            width: 74px;
            height: 74px;
            border: 2px solid var(--text-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .empty-state strong {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 18px;
        }

        .list-card {
            background: var(--surface-soft);
            width: min(420px, 100%);
            max-height: min(460px, 80vh);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }

        .modal-head {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #363636;
            padding: 0 16px;
        }

        #modal-users-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .modal-user-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-weight: 650;
            cursor: pointer;
        }

        .modal-user-row:hover { background: var(--surface-lift); }

        .modal-user-row i {
            font-size: 34px;
            color: #666;
        }

        .post-modal-card {
            width: min(900px, 100%);
            max-height: 90vh;
            background: var(--surface);
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) 340px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .post-modal-media {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
        }

        .post-modal-media img {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .post-modal-side {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-left: 1px solid var(--border-color);
        }

        .post-modal-user {
            height: 58px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            font-weight: 700;
        }

        .post-modal-user img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-caption {
            flex: 1;
            padding: 14px;
            color: white;
            line-height: 1.45;
            overflow-y: auto;
        }

        .post-actions {
            border-top: 1px solid var(--border-color);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .post-action-icons {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 22px;
        }

        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: none;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .bottom-navbar a {
            color: white;
            font-size: 22px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            body { padding-bottom: 58px; }

            .navbar { height: 54px; }
            .nav-inner { padding: 0 12px; }
            .brand { font-size: 17px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

            .container {
                margin-top: 16px;
                padding: 0 14px;
            }

            .profile-header {
                grid-template-columns: 92px 1fr;
                gap: 16px;
                align-items: start;
                margin-bottom: 16px;
            }

            .avatar-section {
                width: 84px;
                height: 84px;
                justify-self: start;
            }

            .info-section { gap: 10px; }
            .username { font-size: 21px; max-width: 100%; }

            .username-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .profile-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .profile-actions .btn-edit {
                width: 100%;
                padding: 7px 8px;
            }

            .desktop-stats { display: none; }
            .mobile-stats-row { display: flex; }

            .bio-info {
                grid-column: 1 / -1;
                font-size: 14px;
                margin-top: 2px;
            }

            .highlights {
                padding-bottom: 18px;
                gap: 12px;
            }

            .highlight-item { width: 66px; }
            .highlight-ring { width: 60px; height: 60px; }

            .tabs {
                justify-content: space-around;
                gap: 0;
                margin: 0 -14px;
            }

            .tab-item {
                flex: 1;
                justify-content: center;
                height: 48px;
                font-size: 0;
            }

            .tab-item i { font-size: 18px; }

            .post-grid {
                gap: 2px;
                margin: 0 -14px;
            }

            .overlay { display: none; }

            .post-modal-card {
                grid-template-columns: 1fr;
                max-height: 92vh;
            }

            .post-modal-media { min-height: 320px; }
            .post-modal-side { border-left: none; border-top: 1px solid var(--border-color); }
            .post-caption { max-height: 130px; }

            .bottom-navbar { display: flex; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-inner">
            <div class="nav-left">
                <a class="icon-btn" href="home.html" aria-label="Back to home"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="brand" id="nav-title">Profile</div>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" id="share-profile-btn" aria-label="Share profile"><i class="fa-regular fa-paper-plane"></i></button>
                <button class="icon-btn" id="settings-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="profile-header">
            <div class="avatar-section">
                <div class="avatar-section-inner">
                    <img src="https://picsum.photos/150/150?random=99" alt="Profile Picture" id="profile-avatar">
                </div>
            </div>

            <div class="info-section">
                <div class="username-row">
                    <h2 class="username" id="profile-username">Loading...</h2>
                    <div class="profile-actions" id="profile-actions-container">
                        <button class="btn-edit" id="profile-action-btn">Follow</button>
                        <button class="btn-edit" id="message-btn" style="display:none;">Message</button>
                    </div>
                </div>

                <div class="stats-row desktop-stats">
                    <div><b id="post-count">0</b> posts</div>
                    <div id="follower-click-area"><b id="follower-count">0</b> followers</div>
                    <div id="following-click-area"><b id="following-count">0</b> following</div>
                </div>

                <div class="bio-info">
                    <span class="full-name" id="profile-fullname">Loading Name...</span>
                    <p id="profile-bio">Loading bio information...</p>
                    <a href="#" class="profile-link" id="profile-link" style="display:none;"><i class="fa-solid fa-link"></i><span></span></a>
                </div>
            </div>
        </section>

        <div class="mobile-stats-row">
            <div><b id="mobile-post-count">0</b> posts</div>
            <div id="mobile-follower-click-area"><b id="mobile-follower-count">0</b> followers</div>
            <div id="mobile-following-click-area"><b id="mobile-following-count">0</b> following</div>
        </div>

        <section class="highlights" aria-label="Story highlights">
            <div class="highlight-item"><div class="highlight-ring"><i class="fa-solid fa-plus"></i></div><span>New</span></div>
            <div class="highlight-item"><div class="highlight-ring"><i class="fa-solid fa-star"></i></div><span>Best</span></div>
            <div class="highlight-item"><div class="highlight-ring"><i class="fa-solid fa-camera-retro"></i></div><span>Photos</span></div>
            <div class="highlight-item"><div class="highlight-ring"><i class="fa-solid fa-heart"></i></div><span>Moments</span></div>
        </section>

        <div class="tabs">
            <button class="tab-item active" data-tab="posts"><i class="fa-solid fa-table-cells"></i> POSTS</button>
            <button class="tab-item" data-tab="reels"><i class="fa-solid fa-clapperboard"></i> REELS</button>
            <button class="tab-item" data-tab="tagged"><i class="fa-regular fa-user"></i> TAGGED</button>
        </div>

        <div class="post-grid" id="user-posts-grid">
            <div class="empty-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <strong>Loading</strong>
                <span>Fetching posts...</span>
            </div>
        </div>
    </main>

    <div id="list-modal" class="modal">
        <div class="list-card">
            <div class="modal-head">
                <h3 id="modal-title">Users</h3>
                <button class="icon-btn" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-users-list"></div>
        </div>
    </div>

    <div id="post-modal" class="modal">
        <div class="post-modal-card">
            <div class="post-modal-media">
                <img src="" alt="Post preview" id="post-modal-img">
            </div>
            <div class="post-modal-side">
                <div class="post-modal-user">
                    <img src="" alt="User" id="post-modal-avatar">
                    <span id="post-modal-username">username</span>
                    <button class="icon-btn" id="close-post-modal" style="margin-left:auto;"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="post-caption" id="post-modal-caption"></div>
                <div class="post-actions">
                    <div class="post-action-icons">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <strong id="post-modal-likes">0 likes</strong>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="profile.html"><i class="fa-regular fa-circle-user"></i></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const urlParams = new URLSearchParams(window.location.search);

        let targetUsername = urlParams.get("username") || urlParams.get("id");
        let activeUser = localStorage.getItem("active_user");

        if (!activeUser || activeUser.trim() === "") {
            activeUser = "user_1";
            localStorage.setItem("active_user", activeUser);
        }

        if (!targetUsername || targetUsername.trim() === "") {
            targetUsername = activeUser;
        }

        let currentProfilePic = "https://picsum.photos/150/150?random=99";
        let currentDisplayUsername = targetUsername;
        let currentPosts = [];

        const $ = (id) => document.getElementById(id);

        window.navigateToUser = function(username) {
            const cleanPath = window.location.origin + window.location.pathname;
            window.location.href = `${cleanPath}?username=${encodeURIComponent(username)}`;
        };

        $("share-profile-btn").addEventListener("click", async () => {
            const url = window.location.href;
            if (navigator.share) {
                await navigator.share({ title: currentDisplayUsername, url });
            } else {
                await navigator.clipboard.writeText(url);
                alert("Profile link copied.");
            }
        });

        $("settings-btn").addEventListener("click", () => {
            if (targetUsername === activeUser) {
                window.location.href = "edit-profile.html";
            } else {
                alert("Settings sirf apni profile ke liye hoti hai.");
            }
        });

        document.querySelectorAll(".tab-item").forEach((tab) => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab-item").forEach((item) => item.classList.remove("active"));
                tab.classList.add("active");
                renderTab(tab.dataset.tab);
            });
        });

        $("close-modal").onclick = () => $("list-modal").style.display = "none";
        $("list-modal").addEventListener("click", (e) => {
            if (e.target === $("list-modal")) $("list-modal").style.display = "none";
        });

        $("close-post-modal").onclick = () => $("post-modal").style.display = "none";
        $("post-modal").addEventListener("click", (e) => {
            if (e.target === $("post-modal")) $("post-modal").style.display = "none";
        });

        async function fetchUserProfileData() {
            try {
                setCounts(0, 0, 0);

                const userDocRef = doc(db, "users", targetUsername);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    currentDisplayUsername = userData.username || targetUsername;
                    currentProfilePic = userData.profilePic || currentProfilePic;

                    $("profile-username").innerText = currentDisplayUsername;
                    $("nav-title").innerText = currentDisplayUsername;
                    $("profile-fullname").innerText = userData.name || "Instagram User";
                    $("profile-bio").innerHTML = escapeHtml(userData.bio || "Welcome to my profile!").replaceAll("\n", "<br>");
                    $("profile-avatar").src = currentProfilePic;

                    if (userData.website) {
                        $("profile-link").style.display = "inline-flex";
                        $("profile-link").href = userData.website;
                        $("profile-link").querySelector("span").innerText = userData.website.replace(/^https?:\/\//, "");
                    }

                    document.title = `${currentDisplayUsername} • Instagram Profile`;
                } else {
                    $("profile-username").innerText = targetUsername;
                    $("nav-title").innerText = targetUsername;
                    $("profile-fullname").innerText = "Instagram User";
                    $("profile-bio").innerText = "Welcome to my profile!";
                    $("profile-avatar").src = currentProfilePic;
                    document.title = `${targetUsername} • Instagram Profile`;
                }

                const followersSnap = await getDocs(query(collection(db, "follows"), where("following", "==", targetUsername)));
                const followingSnap = await getDocs(query(collection(db, "follows"), where("follower", "==", targetUsername)));

                let followersCount = followersSnap.size;
                let followingCount = followingSnap.size;

                setCounts(0, followersCount, followingCount);
                await setupActionButtons(followersCount);
                setupListModals();
                await loadTargetUserPosts();
            } catch (err) {
                console.error("Error loading user profile system:", err);
                $("user-posts-grid").innerHTML = emptyState("fa-triangle-exclamation", "Profile error", "Profile load nahi ho payi. Firebase rules ya internet check karo.");
            }
        }

        async function setupActionButtons(followersCount) {
            const actionBtn = $("profile-action-btn");
            const msgBtn = $("message-btn");

            if (targetUsername === activeUser) {
                actionBtn.innerText = "Edit profile";
                actionBtn.classList.remove("btn-primary");
                actionBtn.onclick = () => window.location.href = "edit-profile.html";

                msgBtn.style.display = "inline-block";
                msgBtn.innerText = "Share profile";
                msgBtn.onclick = () => $("share-profile-btn").click();
                return;
            }

            msgBtn.style.display = "inline-block";
            msgBtn.innerText = "Message";
            msgBtn.onclick = () => window.location.href = `messages.html?username=${encodeURIComponent(targetUsername)}`;

            const followDocRef = doc(db, "follows", `${activeUser}_${targetUsername}`);
            const followSnap = await getDoc(followDocRef);

            function paintFollowing(isFollowing) {
                actionBtn.innerText = isFollowing ? "Following" : "Follow";
                actionBtn.classList.toggle("btn-primary", !isFollowing);
            }

            paintFollowing(followSnap.exists());

            actionBtn.onclick = async () => {
                actionBtn.disabled = true;

                try {
                    if (actionBtn.innerText === "Follow") {
                        await setDoc(followDocRef, {
                            follower: activeUser,
                            following: targetUsername,
                            timestamp: new Date()
                        });
                        followersCount++;
                        paintFollowing(true);
                    } else {
                        await deleteDoc(followDocRef);
                        followersCount = Math.max(0, followersCount - 1);
                        paintFollowing(false);
                    }

                    $("follower-count").innerText = followersCount;
                    $("mobile-follower-count").innerText = followersCount;
                } catch (err) {
                    console.error("Follow action failed:", err);
                    alert("Follow update nahi hua. Firebase rules check karo.");
                } finally {
                    actionBtn.disabled = false;
                }
            };
        }

        function setupListModals() {
            $("follower-click-area").onclick = () => openUserList("Followers", "following", targetUsername, "follower");
            $("mobile-follower-click-area").onclick = () => openUserList("Followers", "following", targetUsername, "follower");

            $("following-click-area").onclick = () => openUserList("Following", "follower", targetUsername, "following");
            $("mobile-following-click-area").onclick = () => openUserList("Following", "follower", targetUsername, "following");
        }

        async function openUserList(title, fieldName, fieldValue, resultField) {
            $("modal-title").innerText = title;
            $("modal-users-list").innerHTML = `<div style="padding:22px; text-align:center; color:var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>`;
            $("list-modal").style.display = "flex";

            const snap = await getDocs(query(collection(db, "follows"), where(fieldName, "==", fieldValue)));

            if (snap.empty) {
                $("modal-users-list").innerHTML = `<div style="padding:24px; text-align:center; color:var(--text-muted);">No users yet.</div>`;
                return;
            }

            $("modal-users-list").innerHTML = "";
            snap.forEach((item) => {
                const data = item.data();
                const username = data[resultField];

                const row = document.createElement("div");
                row.className = "modal-user-row";
                row.innerHTML = `<i class="fa-solid fa-circle-user"></i><span>@${escapeHtml(username)}</span>`;
                row.onclick = () => window.navigateToUser(username);
                $("modal-users-list").appendChild(row);
            });
        }

        async function loadTargetUserPosts() {
            const gridContainer = $("user-posts-grid");

            try {
                const postsByUsername = await getDocs(query(collection(db, "posts"), where("username", "==", targetUsername)));
                const postsByUserId = await getDocs(query(collection(db, "posts"), where("userId", "==", targetUsername)));

                const postMap = new Map();

                postsByUsername.forEach((postDoc) => postMap.set(postDoc.id, { id: postDoc.id, ...postDoc.data() }));
                postsByUserId.forEach((postDoc) => postMap.set(postDoc.id, { id: postDoc.id, ...postDoc.data() }));

                currentPosts = Array.from(postMap.values()).sort((a, b) => {
                    const at = a.timestamp && a.timestamp.toMillis ? a.timestamp.toMillis() : 0;
                    const bt = b.timestamp && b.timestamp.toMillis ? b.timestamp.toMillis() : 0;
                    return bt - at;
                });

                setCounts(currentPosts.length, $("follower-count").innerText, $("following-count").innerText);
                renderTab("posts");
            } catch (error) {
                console.error("Error filtering target posts:", error);
                gridContainer.innerHTML = emptyState("fa-triangle-exclamation", "Could not load posts", "Firebase query ya rules me issue ho sakta hai.");
            }
        }

        function renderTab(tabName) {
            const gridContainer = $("user-posts-grid");

            if (tabName === "reels") {
                gridContainer.innerHTML = emptyState("fa-clapperboard", "No Reels Yet", "Reels share honge to yahan dikhेंगे.");
                return;
            }

            if (tabName === "tagged") {
                gridContainer.innerHTML = emptyState("fa-user", "No Tagged Posts", "Tagged photos yahan show hongi.");
                return;
            }

            gridContainer.innerHTML = "";

            if (currentPosts.length === 0) {
                gridContainer.innerHTML = emptyState("fa-camera", "No Posts Yet", "When posts are shared, they will appear here.");
                return;
            }

            currentPosts.forEach((postData, index) => {
                const postItem = document.createElement("div");
                postItem.className = "post-item";
                postItem.innerHTML = `
                    <img src="${escapeAttr(postData.postImg || "https://picsum.photos/600/600?random=" + index)}" alt="User post">
                    <div class="overlay">
                        <span><i class="fa-solid fa-heart"></i> ${postData.likesCount || 0}</span>
                        <span><i class="fa-solid fa-comment"></i> ${postData.commentsCount || 0}</span>
                    </div>
                `;
                postItem.onclick = () => openPostModal(postData);
                gridContainer.appendChild(postItem);
            });
        }

        function openPostModal(postData) {
            $("post-modal-img").src = postData.postImg || "";
            $("post-modal-avatar").src = currentProfilePic;
            $("post-modal-username").innerText = currentDisplayUsername;
            $("post-modal-caption").innerHTML = `<strong>${escapeHtml(currentDisplayUsername)}</strong> ${escapeHtml(postData.caption || "")}`;
            $("post-modal-likes").innerText = `${postData.likesCount || 0} likes`;
            $("post-modal").style.display = "flex";
        }

        function setCounts(posts, followers, following) {
            $("post-count").innerText = posts;
            $("mobile-post-count").innerText = posts;
            $("follower-count").innerText = followers;
            $("mobile-follower-count").innerText = followers;
            $("following-count").innerText = following;
            $("mobile-following-count").innerText = following;
        }

        function emptyState(icon, title, text) {
            return `
                <div class="empty-state">
                    <i class="fa-solid ${icon}"></i>
                    <strong>${title}</strong>
                    <span>${text}</span>
                </div>
            `;
        }

        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttr(value) {
            return escapeHtml(value);
        }

        fetchUserProfileData();
    </script>
</body>
</html>
