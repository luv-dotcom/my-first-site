<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#000;--card:#121212;--soft:#1a1a1a;--lift:#262626;--border:#262626;--text:#fafafa;--muted:#a8a8a8;--blue:#0095f6;--danger:#ed4956}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:58px}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.navbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:sticky;top:0;background:#000;z-index:20}
.nav-inner{width:100%;max-width:975px;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.nav-left,.nav-actions{display:flex;align-items:center;gap:16px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:transparent;color:white;display:flex;align-items:center;justify-content:center;font-size:20px}
.icon-btn:hover{background:var(--lift)}
.brand{font-size:19px;font-weight:800;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.container{max-width:935px;margin:30px auto 0;padding:0 20px}
.profile-header{display:grid;grid-template-columns:170px 1fr;gap:70px;align-items:center;margin-bottom:34px}
.avatar-wrap{width:150px;height:150px;border-radius:50%;padding:4px;background:var(--lift);justify-self:center}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #000;background:var(--lift)}
.info{display:flex;flex-direction:column;gap:17px;min-width:0}
.username-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.username{font-size:28px;font-weight:350;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--lift);color:white;border-radius:8px;padding:7px 16px;font-weight:800;font-size:14px;min-height:32px}
.btn.primary{background:var(--blue)}
.btn:hover{background:#333}
.stats{display:flex;gap:38px;font-size:16px}
.stats div{cursor:pointer}.stats b{font-weight:800}
.bio{font-size:15px;line-height:1.45;max-width:520px}
.fullname{font-weight:800;display:block}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.link{display:none;color:#e0f1ff;font-weight:700;margin-top:4px;word-break:break-all}
.mobile-stats{display:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:18px -20px 0}
.mobile-stats div{flex:1;text-align:center;padding:12px 4px;color:var(--muted);font-size:13px}.mobile-stats b{display:block;color:white;font-size:16px}
.highlights{display:flex;gap:16px;overflow-x:auto;padding:4px 0 26px;scrollbar-width:none}.highlights::-webkit-scrollbar{display:none}
.highlight{width:76px;flex:0 0 auto;text-align:center;font-size:12px;font-weight:700;color:white}
.highlight-ring{width:68px;height:68px;margin:0 auto 7px;border-radius:50%;border:1px solid #3a3a3a;padding:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.highlight-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}.highlight-ring i{font-size:24px;color:#ddd}
.tabs{border-top:1px solid var(--border);display:flex;justify-content:center;gap:62px}
.tab{height:52px;background:transparent;color:var(--muted);border-top:1px solid transparent;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.tab.active{color:white;border-top-color:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.item{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden;cursor:pointer}
.item img,.item video{width:100%;height:100%;object-fit:cover;display:block}
.item-badge{position:absolute;top:8px;right:8px;color:white;text-shadow:0 1px 8px #000}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:22px;font-weight:800;opacity:0}.item:hover .overlay{opacity:1}
.empty{grid-column:span 3;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:8px;padding:34px}
.empty i{width:74px;height:74px;border:2px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:white}.empty strong{color:white;font-size:24px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{width:min(520px,100%);max-height:90vh;background:var(--soft);border:1px solid #333;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{height:52px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.modal-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.photo-row{display:flex;align-items:center;gap:12px;background:#0b0b0b;border-radius:12px;padding:12px}
.photo-row img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:800}
.field input,.field textarea{background:#0b0b0b;color:white;border:1px solid #363636;border-radius:10px;padding:11px;outline:0}
.field textarea{min-height:84px;resize:vertical}
.modal-foot{border-top:1px solid #333;padding:12px 16px;display:flex;justify-content:flex-end;gap:10px}
.post-view{width:min(940px,100%);max-height:90vh;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr) 340px;border-radius:10px;overflow:hidden;border:1px solid #333}
.post-media{background:#000;display:flex;align-items:center;justify-content:center;min-height:420px}
.post-media img,.post-media video{width:100%;height:100%;max-height:90vh;object-fit:contain}
.post-side{border-left:1px solid var(--border);display:flex;flex-direction:column}
.post-user{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800}
.post-user img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.post-caption{padding:14px;line-height:1.45;flex:1}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(18px);background:rgba(255,255,255,.92);color:#000;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:800;opacity:0;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:52px;background:#000;border-top:1px solid var(--border);display:none;align-items:center;justify-content:space-around;z-index:20}.bottom a{font-size:22px}
@media(max-width:768px){.container{margin-top:16px;padding:0 14px}.profile-header{grid-template-columns:92px 1fr;gap:16px;align-items:start;margin-bottom:16px}.avatar-wrap{width:84px;height:84px;justify-self:start}.info{gap:10px}.username{font-size:21px}.username-row{flex-direction:column;align-items:flex-start;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.btn{width:100%;padding:7px 8px}.desktop-stats{display:none}.mobile-stats{display:flex;margin-left:-14px;margin-right:-14px}.bio{grid-column:1/-1;font-size:14px}.tabs{gap:0;justify-content:space-around;margin:0 -14px}.tab{flex:1;justify-content:center;font-size:0}.tab i{font-size:18px}.grid{gap:2px;margin:0 -14px}.overlay{display:none}.bottom{display:flex}.post-view{grid-template-columns:1fr}.post-side{border-left:0;border-top:1px solid var(--border)}.post-media{min-height:320px}}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-left">
      <a class="icon-btn" href="home.html"><i class="fa-solid fa-chevron-left"></i></a>
      <div class="brand" id="nav-title">Profile</div>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="share-profile"><i class="fa-regular fa-paper-plane"></i></button>
      <a class="icon-btn" href="settings.html"><i class="fa-solid fa-gear"></i></a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="profile-header">
    <div class="avatar-wrap"><img id="profile-avatar" src="" alt="Profile"></div>
    <div class="info">
      <div class="username-row">
        <h2 class="username" id="profile-username">Loading...</h2>
        <div class="actions">
          <button class="btn" id="main-action">Follow</button>
          <button class="btn" id="message-action" style="display:none;">Message</button>
        </div>
      </div>
      <div class="stats desktop-stats">
        <div><b id="post-count">0</b> posts</div>
        <div><b id="follower-count">0</b> followers</div>
        <div><b id="following-count">0</b> following</div>
      </div>
      <div class="bio">
        <span class="fullname" id="profile-fullname">Loading Name...</span>
        <div class="meta" id="profile-meta"></div>
        <p id="profile-bio">Loading bio...</p>
        <a class="link" id="profile-link" target="_blank"></a>
      </div>
    </div>
  </section>

  <div class="mobile-stats">
    <div><b id="m-post-count">0</b> posts</div>
    <div><b id="m-follower-count">0</b> followers</div>
    <div><b id="m-following-count">0</b> following</div>
  </div>

  <section class="highlights" id="highlights"></section>

  <div class="tabs">
    <button class="tab active" data-tab="posts"><i class="fa-solid fa-table-cells"></i> POSTS</button>
    <button class="tab" data-tab="reels"><i class="fa-solid fa-clapperboard"></i> REELS</button>
    <button class="tab" data-tab="tagged"><i class="fa-regular fa-user"></i> TAGGED</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i><strong>Loading</strong><span>Fetching profile...</span></div>
  </div>
</main>

<div class="modal" id="edit-modal">
  <div class="card">
    <div class="modal-head">
      <h3>Edit profile</h3>
      <button class="icon-btn" data-close="edit-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="photo-row">
        <img id="edit-photo" src="" alt="Profile">
        <div>
          <strong id="edit-user-label">username</strong><br>
          <button class="btn primary" id="choose-photo" type="button">Change photo</button>
          <input type="file" id="photo-input" accept="image/*" style="display:none">
        </div>
      </div>
      <div class="field"><label>Name</label><input id="edit-name" maxlength="50"></div>
      <div class="field"><label>Username</label><input id="edit-username" maxlength="30"></div>
      <div class="field"><label>Email</label><input id="edit-email" type="email"></div>
      <div class="field"><label>Bio</label><textarea id="edit-bio" maxlength="180"></textarea></div>
      <div class="field"><label>Website</label><input id="edit-website"></div>
      <div class="field"><label>Pronouns</label><input id="edit-pronouns"></div>
      <div class="field"><label>Category</label><input id="edit-category"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="edit-modal">Cancel</button>
      <button class="btn primary" id="save-profile">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="post-modal">
  <div class="post-view">
    <div class="post-media" id="modal-media"></div>
    <div class="post-side">
      <div class="post-user"><img id="modal-avatar"><span id="modal-user"></span></div>
      <div class="post-caption" id="modal-caption"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Done</div>

<nav class="bottom">
  <a href="home.html"><i class="fa-solid fa-house"></i></a>
  <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
  <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
  <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
  <a href="profile.html"><i class="fa-regular fa-circle-user"></i></a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",authDomain:"insta-clone-863ae.firebaseapp.com",projectId:"insta-clone-863ae",storageBucket:"insta-clone-863ae.firebasestorage.app",messagingSenderId:"599343109250",appId:"1:599343109250:web:1306ec63908ba21c54509b"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);
const DEFAULT_AVATAR="https://picsum.photos/150/150?random=1";
const activeUser=localStorage.getItem("active_user");
if(!activeUser) location.href="index.html";

const params=new URLSearchParams(location.search);
const targetUsername=params.get("username")||params.get("user")||activeUser;

let userData={}, displayUsername=targetUsername, profilePic=DEFAULT_AVATAR;
let posts=[], reels=[], activeTab="posts", selectedPhoto=null;

function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function displayName(d){return d.fullName||d.name||d.displayName||d.fullname||d.username||"Instagram User"}
function isOwn(){return targetUsername===activeUser}
function toast(t){$("toast").innerText=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
function openModal(id){$(id).classList.add("open")}
function closeModal(id){$(id).classList.remove("open")}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});

document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick=()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");activeTab=btn.dataset.tab;renderGrid()}
});

$("share-profile").onclick=async()=>{
  const url=`${location.origin}${location.pathname}?username=${encodeURIComponent(targetUsername)}`;
  try{await navigator.clipboard.writeText(url);toast("Profile link copied")}catch(e){toast("Copy failed")}
};

$("choose-photo").onclick=()=>$("photo-input").click();
$("photo-input").onchange=()=>{
  selectedPhoto=$("photo-input").files[0];
  if(selectedPhoto)$("edit-photo").src=URL.createObjectURL(selectedPhoto);
};
$("save-profile").onclick=saveProfile;

async function loadProfile(){
  try{
    const snap=await getDoc(doc(db,"users",targetUsername));
    if(snap.exists()) userData=snap.data();
    else userData={username:targetUsername};

    displayUsername=userData.username||targetUsername;
    profilePic=userData.profilePic||DEFAULT_AVATAR;

    $("profile-username").innerText=displayUsername;
    $("nav-title").innerText=displayUsername;
    $("profile-fullname").innerText=displayName(userData);
    $("profile-bio").innerHTML=esc(userData.bio||"Welcome to my profile!").replaceAll("\n","<br>");
    $("profile-avatar").src=profilePic;

    const meta=[userData.category,userData.pronouns,userData.gender].filter(Boolean).join(" - ");
    $("profile-meta").innerText=meta;

    if(userData.website){
      $("profile-link").style.display="inline-block";
      $("profile-link").href=userData.website.startsWith("http")?userData.website:`https://${userData.website}`;
      $("profile-link").innerText=userData.website.replace(/^https?:\/\//,"");
    }

    document.title=`${displayUsername} - Instagram Profile`;
    await Promise.all([loadCounts(), setupActions(), loadHighlights(), loadPosts(), loadReels()]);
  }catch(e){
    console.error(e);
    $("grid").innerHTML=empty("fa-triangle-exclamation","Profile error","Profile load nahi ho payi.");
  }
}

async function loadCounts(){
  const followers=await getDocs(query(collection(db,"follows"),where("following","==",targetUsername)));
  const following=await getDocs(query(collection(db,"follows"),where("follower","==",targetUsername)));
  setCounts(0,followers.size,following.size);
}

async function setupActions(){
  const main=$("main-action"), msg=$("message-action");
  if(isOwn()){
    main.innerText="Edit profile";
    main.onclick=openEdit;
    msg.style.display="inline-block";
    msg.innerText="Settings";
    msg.onclick=()=>location.href="settings.html";
    return;
  }
  msg.style.display="inline-block";
  msg.innerText="Message";
  msg.onclick=()=>location.href=`messages.html?username=${encodeURIComponent(targetUsername)}`;

  const followRef=doc(db,"follows",`${activeUser}_${targetUsername}`);
  const followSnap=await getDoc(followRef);
  paintFollow(followSnap.exists());

  main.onclick=async()=>{
    main.disabled=true;
    try{
      if(main.innerText==="Follow"){
        await setDoc(followRef,{follower:activeUser,following:targetUsername,timestamp:serverTimestamp()});
        paintFollow(true);
        await loadCounts();
      }else{
        await deleteDoc(followRef);
        paintFollow(false);
        await loadCounts();
      }
    }catch(e){toast("Follow update failed")}
    main.disabled=false;
  };
  function paintFollow(f){main.innerText=f?"Following":"Follow";main.classList.toggle("primary",!f)}
}

function openEdit(){
  selectedPhoto=null;
  $("edit-photo").src=profilePic;
  $("edit-user-label").innerText=displayUsername;
  $("edit-name").value=displayName(userData)==="Instagram User"?"":displayName(userData);
  $("edit-username").value=userData.username||activeUser;
  $("edit-email").value=userData.email||userData.userEmail||"";
  $("edit-bio").value=userData.bio||"";
  $("edit-website").value=userData.website||"";
  $("edit-pronouns").value=userData.pronouns||"";
  $("edit-category").value=userData.category||"";
  openModal("edit-modal");
}

async function saveProfile(){
  const fullName=$("edit-name").value.trim()||"Instagram User";
  const username=$("edit-username").value.trim().toLowerCase()||activeUser;
  if(username.includes(" ")||!/^[a-z0-9._]+$/.test(username)){toast("Invalid username");return}

  $("save-profile").disabled=true;
  $("save-profile").innerText="Saving...";
  try{
    let photoUrl=profilePic;
    if(selectedPhoto){
      $("save-profile").innerText="Uploading...";
      const safe=selectedPhoto.name.replace(/[^\w.-]+/g,"_");
      const photoRef=ref(storage,`profile-pictures/${activeUser}/${Date.now()}_${safe}`);
      await uploadBytes(photoRef,selectedPhoto);
      photoUrl=await getDownloadURL(photoRef);
    }

    const update={
      username,
      fullName,
      name:fullName,
      displayName:fullName,
      email:$("edit-email").value.trim(),
      bio:$("edit-bio").value.trim(),
      website:$("edit-website").value.trim(),
      pronouns:$("edit-pronouns").value.trim(),
      category:$("edit-category").value.trim(),
      profilePic:photoUrl||DEFAULT_AVATAR,
      updatedAt:serverTimestamp()
    };

    await setDoc(doc(db,"users",activeUser),update,{merge:true});
    Object.assign(userData,update);
    displayUsername=username;
    profilePic=update.profilePic;

    localStorage.setItem("active_user_full_name",fullName);
    localStorage.setItem("active_user_name",fullName);
    localStorage.setItem("active_user_display_name",fullName);
    localStorage.setItem("active_user_profile_pic",profilePic);

    $("profile-username").innerText=displayUsername;
    $("nav-title").innerText=displayUsername;
    $("profile-fullname").innerText=fullName;
    $("profile-bio").innerHTML=esc(update.bio||"Welcome to my profile!").replaceAll("\n","<br>");
    $("profile-avatar").src=profilePic;
    $("profile-meta").innerText=[update.category,update.pronouns].filter(Boolean).join(" - ");
    closeModal("edit-modal");
    toast("Profile updated");
  }catch(e){
    console.error(e);
    toast("Save failed. Rules check karo");
  }
  $("save-profile").disabled=false;
  $("save-profile").innerText="Save";
}

async function loadHighlights(){
  const row=$("highlights");
  row.innerHTML="";
  if(isOwn()){
    row.innerHTML=`<div class="highlight" onclick="location.href='story-view.html?mode=create'"><div class="highlight-ring"><i class="fa-solid fa-plus"></i></div><span>New</span></div>`;
  }
  try{
    const snap=await getDocs(query(collection(db,"highlights"),where("userId","==",targetUsername)));
    snap.forEach(h=>{
      const d=h.data();
      const div=document.createElement("div");
      div.className="highlight";
      div.innerHTML=`<div class="highlight-ring">${d.mediaType==="video"?`<i class="fa-solid fa-play"></i>`:`<img src="${esc(d.mediaUrl||DEFAULT_AVATAR)}">`}</div><span>${esc(d.title||d.music||"Highlight")}</span>`;
      row.appendChild(div);
    });
  }catch(e){}
}

async function loadPosts(){
  const map=new Map();
  const a=await getDocs(query(collection(db,"posts"),where("username","==",targetUsername)));
  const b=await getDocs(query(collection(db,"posts"),where("userId","==",targetUsername)));
  a.forEach(x=>map.set(x.id,{id:x.id,...x.data()}));
  b.forEach(x=>map.set(x.id,{id:x.id,...x.data()}));
  posts=[...map.values()].sort((x,y)=>timeVal(y.timestamp)-timeVal(x.timestamp));
  setCounts(posts.length,$("follower-count").innerText,$("following-count").innerText);
  renderGrid();
}

async function loadReels(){
  try{
    const snap=await getDocs(query(collection(db,"reels"),where("userId","==",targetUsername),orderBy("timestamp","desc")));
    reels=[];
    snap.forEach(r=>reels.push({id:r.id,...r.data()}));
  }catch(e){reels=[]}
}

function renderGrid(){
  const grid=$("grid");
  grid.innerHTML="";
  if(activeTab==="tagged"){grid.innerHTML=empty("fa-user","No Tagged Posts","Tagged photos yahan show hongi.");return}

  const list=activeTab==="reels"?reels:posts;
  if(list.length===0){
    grid.innerHTML=activeTab==="reels"?empty("fa-clapperboard","No Reels Yet","Reels share honge to yahan dikhenge."):empty("fa-camera","No Posts Yet","When posts are shared, they will appear here.");
    return;
  }

  list.forEach((d,i)=>{
    const mediaType=d.mediaType||(d.videoUrl||d.reelUrl?"video":"image");
    const url=d.postImg||d.imageUrl||d.mediaUrl||d.videoUrl||d.reelUrl||`https://picsum.photos/600/600?random=${i}`;
    const item=document.createElement("div");
    item.className="item";
    item.innerHTML=`
      ${mediaType==="video"?`<video src="${esc(url)}" muted playsinline></video><i class="fa-solid fa-play item-badge"></i>`:`<img src="${esc(url)}" alt="Post">`}
      <div class="overlay"><span><i class="fa-solid fa-heart"></i> ${d.likesCount||0}</span><span><i class="fa-solid fa-comment"></i> ${d.commentsCount||0}</span></div>
    `;
    item.onclick=()=>openPost(d,url,mediaType);
    grid.appendChild(item);
  });
}

function openPost(d,url,type){
  $("modal-media").innerHTML=type==="video"?`<video src="${esc(url)}" controls autoplay playsinline></video>`:`<img src="${esc(url)}" alt="Post">`;
  $("modal-avatar").src=profilePic;
  $("modal-user").innerText=displayUsername;
  $("modal-caption").innerHTML=`<strong>${esc(displayUsername)}</strong> ${esc(d.caption||"")}`;
  openModal("post-modal");
}

function setCounts(p,f,fg){
  $("post-count").innerText=p;$("m-post-count").innerText=p;
  $("follower-count").innerText=f;$("m-follower-count").innerText=f;
  $("following-count").innerText=fg;$("m-following-count").innerText=fg;
}
function timeVal(t){return t&&t.toMillis?t.toMillis():t?new Date(t).getTime():0}
function empty(icon,title,text){return `<div class="empty"><i class="fa-solid ${icon}"></i><strong>${title}</strong><span>${text}</span></div>`}

loadProfile();
</script>
</body>
</html>
