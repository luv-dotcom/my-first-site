<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create - Instagram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#000;--panel:#121212;--soft:#1f1f1f;--border:#2d2d2d;--text:#fff;--muted:#a8a8a8;--blue:#0095f6;--danger:#ed4956}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-height:100vh;background:#000;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #1f1f1f;background:#050505;position:sticky;top:0;z-index:10}
.topbar a{color:#fff;text-decoration:none;font-size:22px}
.topbar h2{font-size:17px;font-weight:750}
.share-btn{background:none;border:0;color:var(--blue);font-size:15px;font-weight:800;cursor:pointer}
.share-btn:disabled{opacity:.45;cursor:default}
.content{padding:14px;display:flex;flex-direction:column;gap:14px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);background:#151515;border:1px solid #262626;border-radius:10px;padding:4px;gap:4px}
.segment button{border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:8px;font-weight:800;cursor:pointer}
.segment button.active{background:#fff;color:#000}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-btn{border:1px solid #303030;background:#161616;color:#fff;border-radius:12px;padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;cursor:pointer}
.preview{width:100%;aspect-ratio:4/5;background:#090909;border:1px solid #262626;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.preview img,.preview video{width:100%;height:100%;display:none;background:#000}
.preview.cover img,.preview.cover video{object-fit:cover}
.preview.contain img,.preview.contain video{object-fit:contain}
.preview.has-media .empty-preview{display:none}
.preview.has-image img{display:block}
.preview.has-video video{display:block}
.story-text{position:absolute;left:16px;right:16px;bottom:20px;text-align:center;font-size:26px;font-weight:850;color:white;text-shadow:0 2px 12px #000;overflow-wrap:anywhere;display:none}
.mode-story .story-text{display:block}
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:800}
.field input,.field textarea,.field select{width:100%;border:1px solid #303030;background:#111;color:#fff;border-radius:10px;padding:11px;outline:none}
.field textarea{min-height:82px;resize:vertical}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.35}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(18px);background:rgba(255,255,255,.92);color:#000;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <a href="home.html"><i class="fa-solid fa-xmark"></i></a>
        <h2 id="title">Create</h2>
        <button class="share-btn" id="share-btn">Share</button>
    </div>

    <div class="content">
        <div class="segment">
            <button id="type-post" class="active" data-type="post">Post</button>
            <button id="type-reel" data-type="reel">Reel</button>
            <button id="type-story" data-type="story">Story</button>
        </div>

        <div class="pick-row">
            <button class="pick-btn" id="gallery-btn"><i class="fa-solid fa-images"></i> Gallery</button>
            <button class="pick-btn" id="camera-btn"><i class="fa-solid fa-camera"></i> Camera</button>
        </div>

        <input type="file" id="gallery-input" accept="image/*,video/*" class="hidden">
        <input type="file" id="camera-input" accept="image/*,video/*" capture="environment" class="hidden">
        <input type="file" id="audio-input" accept="audio/*" class="hidden">

        <div class="preview contain" id="preview">
            <div class="empty-preview">Select photo or video</div>
            <img id="preview-img" alt="Preview">
            <video id="preview-video" controls playsinline></video>
            <div class="story-text" id="story-text-preview"></div>
        </div>

        <div class="form">
            <div class="field">
                <label>Caption</label>
                <textarea id="caption" placeholder="Write a caption..."></textarea>
            </div>

            <div class="field" id="story-text-field">
                <label>Story text overlay</label>
                <input id="story-text" placeholder="Add text on story">
            </div>

            <div class="field" id="music-field">
                <label>Music / audio name</label>
                <input id="music-name" placeholder="Original audio">
                <button class="pick-btn" type="button" id="audio-btn"><i class="fa-solid fa-music"></i> Choose audio file</button>
                <div class="hint" id="audio-name">No audio selected</div>
            </div>

            <div class="editor-grid">
                <div class="field">
                    <label>Fit</label>
                    <select id="fit-mode">
                        <option value="contain">Original</option>
                        <option value="cover">Fill screen</option>
                    </select>
                </div>
                <div class="field">
                    <label>Filter</label>
                    <select id="filter-mode">
                        <option value="none">Normal</option>
                        <option value="bright">Bright</option>
                        <option value="warm">Warm</option>
                        <option value="mono">Mono</option>
                        <option value="contrast">Contrast</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Location</label>
                <input id="location-input" placeholder="Add location">
            </div>

            <div class="hint" id="mode-hint">
                Post will appear in feed. Photo or video both supported.
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast">Done</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig={
    apiKey:"AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain:"insta-clone-863ae.firebaseapp.com",
    projectId:"insta-clone-863ae",
    storageBucket:"insta-clone-863ae.firebasestorage.app",
    messagingSenderId:"599343109250",
    appId:"1:599343109250:web:1306ec63908ba21c54509b"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);
const currentUser=localStorage.getItem("active_user");
if(!currentUser) window.location.href="index.html";

let createType="post";
let selectedFile=null;
let selectedAudioFile=null;
let mediaType="";
let currentProfilePic="https://picsum.photos/150/150?random=1";

function toast(text){
    $("toast").innerText=text;
    $("toast").classList.add("show");
    setTimeout(()=>$("toast").classList.remove("show"),1600);
}

async function loadMe(){
    const snap=await getDocs(query(collection(db,"users"),where("username","==",currentUser)));
    if(!snap.empty){
        const d=snap.docs[0].data();
        currentProfilePic=d.profilePic||currentProfilePic;
    }
}

document.querySelectorAll(".segment button").forEach(btn=>{
    btn.onclick=()=>{
        createType=btn.dataset.type;
        document.querySelectorAll(".segment button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        updateMode();
    };
});

function updateMode(){
    $("preview").classList.remove("mode-story");
    $("title").innerText=createType==="post"?"New post":createType==="reel"?"New reel":"New story";
    $("share-btn").innerText=createType==="post"?"Share":createType==="reel"?"Share reel":"Your story";

    $("music-field").classList.toggle("hidden",createType==="post");
    $("story-text-field").classList.toggle("hidden",createType!=="story");
    $("preview").classList.toggle("mode-story",createType==="story");

    if(createType==="post") $("mode-hint").innerText="Post will appear in feed. Photo or video both supported.";
    if(createType==="reel") $("mode-hint").innerText="Reel will appear in reels. Video works best. Photo reel saves with music metadata.";
    if(createType==="story") $("mode-hint").innerText="Story will expire after 24 hours. Photo or video supported.";
}

$("gallery-btn").onclick=()=>$("gallery-input").click();
$("camera-btn").onclick=()=>$("camera-input").click();
$("audio-btn").onclick=()=>$("audio-input").click();

$("gallery-input").onchange=e=>handleMedia(e.target.files[0]);
$("camera-input").onchange=e=>handleMedia(e.target.files[0]);

$("audio-input").onchange=e=>{
    selectedAudioFile=e.target.files[0]||null;
    $("audio-name").innerText=selectedAudioFile?selectedAudioFile.name:"No audio selected";
};

function handleMedia(file){
    if(!file)return;
    selectedFile=file;
    mediaType=file.type.startsWith("video/")?"video":"image";

    const url=URL.createObjectURL(file);
    const preview=$("preview");
    preview.classList.add("has-media");
    preview.classList.toggle("has-image",mediaType==="image");
    preview.classList.toggle("has-video",mediaType==="video");

    $("preview-img").src="";
    $("preview-video").src="";

    if(mediaType==="image") $("preview-img").src=url;
    else $("preview-video").src=url;
}

$("fit-mode").onchange=()=>{
    $("preview").classList.remove("cover","contain");
    $("preview").classList.add($("fit-mode").value);
};

$("filter-mode").onchange=applyFilter;
$("story-text").oninput=()=>{
    $("story-text-preview").innerText=$("story-text").value.trim();
};

function applyFilter(){
    const value=$("filter-mode").value;
    let filter="none";
    if(value==="bright") filter="brightness(1.18) saturate(1.08)";
    if(value==="warm") filter="sepia(.18) saturate(1.25)";
    if(value==="mono") filter="grayscale(1)";
    if(value==="contrast") filter="contrast(1.25) saturate(1.1)";
    $("preview-img").style.filter=filter;
    $("preview-video").style.filter=filter;
}

$("share-btn").onclick=shareCreate;

async function uploadFile(file,path){
    const safe=file.name.replace(/[^\w.-]+/g,"_");
    const fileRef=ref(storage,`${path}/${currentUser}/${Date.now()}_${safe}`);
    await uploadBytes(fileRef,file);
    return getDownloadURL(fileRef);
}

async function shareCreate(){
    if(!selectedFile){
        toast("Select photo or video first");
        return;
    }

    $("share-btn").disabled=true;
    $("share-btn").innerText="Uploading...";

    try{
        const mediaUrl=await uploadFile(selectedFile,createType==="post"?"posts":createType==="reel"?"reels":"stories");
        let audioUrl="";
        if(selectedAudioFile) audioUrl=await uploadFile(selectedAudioFile,"audio");

        const caption=$("caption").value.trim();
        const music=$("music-name").value.trim()||"Original audio";
        const location=$("location-input").value.trim();
        const fitMode=$("fit-mode").value;
        const filterMode=$("filter-mode").value;

        if(createType==="post"){
            await addDoc(collection(db,"posts"),{
                userId:currentUser,
                username:currentUser,
                profilePic:currentProfilePic,
                postImg:mediaUrl,
                mediaUrl,
                imageUrl:mediaType==="image"?mediaUrl:"",
                videoUrl:mediaType==="video"?mediaUrl:"",
                mediaType,
                caption,
                location,
                filterMode,
                fitMode,
                likes:0,
                likesCount:0,
                likedBy:[],
                commentsCount:0,
                timestamp:serverTimestamp()
            });
            toast("Post shared");
            setTimeout(()=>window.location.href="profile.html",900);
        }

        if(createType==="reel"){
            await addDoc(collection(db,"reels"),{
                userId:currentUser,
                username:currentUser,
                profilePic:currentProfilePic,
                videoUrl:mediaType==="video"?mediaUrl:"",
                imageUrl:mediaType==="image"?mediaUrl:"",
                mediaUrl,
                thumbnailUrl:mediaUrl,
                mediaType,
                caption,
                music,
                audioUrl,
                location,
                filterMode,
                fitMode,
                likesCount:0,
                commentsCount:0,
                viewsCount:0,
                likedBy:[],
                savedBy:[],
                viewedBy:[],
                timestamp:serverTimestamp()
            });
            toast("Reel shared");
            setTimeout(()=>window.location.href="reels.html",900);
        }

        if(createType==="story"){
            await addDoc(collection(db,"stories"),{
                userId:currentUser,
                username:currentUser,
                profilePic:currentProfilePic,
                storyImg:mediaUrl,
                mediaUrl,
                imageUrl:mediaType==="image"?mediaUrl:"",
                videoUrl:mediaType==="video"?mediaUrl:"",
                mediaType,
                text:$("story-text").value.trim(),
                caption,
                music,
                audioUrl,
                location,
                filterMode,
                fitMode,
                isHighlight:false,
                createdAt:serverTimestamp(),
                timestamp:serverTimestamp(),
                expiresAt:new Date(Date.now()+24*60*60*1000)
            });
            toast("Story shared");
            setTimeout(()=>window.location.href="home.html",900);
        }
    }catch(err){
        console.error(err);
        alert("Upload failed. Firebase Storage rules check karo.");
    }finally{
        $("share-btn").disabled=false;
        updateMode();
    }
}

const params=new URLSearchParams(location.search);
if(params.get("mode")==="story"){
    document.querySelector('[data-type="story"]').click();
}else if(params.get("mode")==="reel"){
    document.querySelector('[data-type="reel"]').click();
}else{
    updateMode();
}

await loadMe();
</script>
</body>
</html>
