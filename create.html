<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --card-bg: #ffffff;
            --btn-blue: #0095f6;
            --btn-blue-hover: #1877f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        a { text-decoration: none; color: inherit; }

        /* --- NAVBARS --- */
        .top-navbar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .nav-container {
            width: 100%; max-width: 975px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid black; }

        .bottom-navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 52px;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .bottom-navbar i { font-size: 22px; }

        /* --- CREATE MAIN CONTAINER --- */
        .create-wrapper {
            max-width: 800px;
            margin: 100px auto 0 auto;
            padding: 0 20px;
        }

        /* The Main Upload Card Box */
        .create-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Card Header */
        .card-header {
            padding: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .share-btn {
            color: var(--btn-blue);
            background: none; border: none;
            font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .share-btn:hover { color: var(--btn-blue-hover); }

        /* Split Workspace (Left: Dropzone, Right: Meta info) */
        .card-body {
            display: flex;
            min-height: 450px;
        }

        /* Dropzone Upload Area */
        .upload-area {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 40px;
            border-right: 1px solid var(--border-color);
            background-color: #fafafa;
            position: relative;
        }
        .upload-area i { font-size: 50px; color: #262626; }
        .upload-area p { font-size: 20px; font-weight: 300; }
        
        /* Custom Input File Button Layout */
        .select-file-btn {
            background-color: var(--btn-blue);
            color: white; padding: 7px 16px;
            border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: background 0.2s;
        }
        .select-file-btn:hover { background-color: var(--btn-blue-hover); }
        .file-input { display: none; } /* Real input hidden */

        /* Right Meta Panel (User profile, caption details) */
        .meta-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .user-info-row {
            display: flex; align-items: center; gap: 12px;
        }
        .user-info-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .user-info-row span { font-weight: 600; font-size: 14px; }

        /* Caption Input Area */
        .caption-textarea {
            width: 100%; height: 150px; border: none; outline: none;
            resize: none; font-size: 15px; color: var(--text-main);
        }
        .caption-textarea::placeholder { color: var(--text-muted); }

        /* Location Bar Layout */
        .location-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted); font-size: 15px;
        }
        .location-row input {
            border: none; outline: none; width: 85%; font-size: 14px; color: var(--text-main);
        }

        /* --- 📱 MOBILE ADAPTIVE SPLIT --- */
        @media (max-width: 735px) {
            .top-navbar .nav-icons { display: none; }
            .bottom-navbar { display: flex; }

            .create-wrapper { margin-top: 60px; padding: 0; }
            .create-card { border: none; border-radius: 0; }
            .card-body { flex-direction: column; min-height: auto; }
            
            .upload-area {
                border-right: none; border-bottom: 1px solid var(--border-color);
                padding: 60px 20px;
            }
            .meta-panel { padding: 16px; }
            .caption-textarea { height: 100px; }
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="home.html" class="logo-text">Instagram</a>
            </div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-solid fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic"></a>
            </div>
        </div>
    </nav>

    <main class="create-wrapper">
        <div class="create-card">
            
            <div class="card-header">
                <span>Create new post</span>
                <button class="share-btn">Share</button>
            </div>

            <div class="card-body">
                
                <div class="upload-area">
                    <i class="fa-regular fa-images"></i>
                    <p>Drag photos and videos here</p>
                    <label class="select-file-btn" for="post-file">Select from computer</label>
                    <input type="file" id="post-file" class="file-input" accept="image/*,video/*">
                </div>

                <div class="meta-panel">
                    <div class="user-info-row">
                        <img src="https://picsum.photos/150/150?random=1" alt="My Profile avatar">
                        <span>my_username</span>
                    </div>
                    
                    <textarea class="caption-textarea" placeholder="Write a caption..."></textarea>
                    
                    <div class="location-row">
                        <input type="text" placeholder="Add location">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-solid fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
        <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid black;"></a>
    </nav>

</body>
</html>
