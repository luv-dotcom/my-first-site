<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body{margin:0;font-family:sans-serif;background:#fafafa}
.header{padding:10px;border-bottom:1px solid #ddd;background:#fff}
.stories{display:flex;overflow:auto;padding:10px;background:#fff}
.story img{width:60px;border-radius:50%;margin-right:10px}
.post{margin-top:10px;background:#fff}
.post img{width:100%}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:10px}
.nav div{cursor:pointer}
.logout{position:fixed;top:10px;right:10px;background:red;color:#fff;padding:5px}
</style>
</head>

<body>

<div class="logout" onclick="logout()">Logout</div>

<div class="header"><b>Instagram</b></div>

<div class="stories">
  <div class="story"><img src="https://i.pravatar.cc/100?img=1"></div>
  <div class="story"><img src="https://i.pravatar.cc/100?img=2"></div>
</div>

<div class="post">
  <img src="https://picsum.photos/400">
  <p style="padding:10px"><b>user</b> Nice post 😍</p>
</div>

<!-- Bottom Navigation -->
<div class="nav">
  <div onclick="goHome()">🏠</div>
  <div onclick="goReels()">🎬</div>
</div>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
  window.location.href="index.html";
}

function logout(){
  localStorage.removeItem("loggedIn");
  window.location.href="index.html";
}

function goReels(){
  window.location.href="reels.html";
}

function goHome(){
  window.location.href="home.html";
}
</script>

</body>
</html>
