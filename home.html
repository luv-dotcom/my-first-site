<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram UI Ultimate Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL RESETS & VARIABLES --- */
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --link-color: #0095f6;
            --card-bg: #ffffff;
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px; /* Space for mobile bottom nav */
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOGO TEXT FONT --- */
        .logo-text {
            font-family: 'Grand Hotel', cursive;
            font-size: 30px;
            cursor: pointer;
            user-select: none;
            transition: opacity var(--transition-speed);
        }
        
        .logo-text:hover {
            opacity: 0.7;
        }

        /* --- DESKTOP TOP NAVBAR --- */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 975px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: #efefef;
            border: none;
            padding: 7px 15px 7px 35px;
            border-radius: 8px;
            font-size: 14px;
            width: 268px;
            outline: none;
            transition: background-color var(--transition-speed);
        }

        .search-box input:focus {
            background-color: #e2e2e2;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-icons {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-icons i {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-main);
            transition: transform var(--transition-speed);
        }

        .nav-icons i:hover {
            transform: scale(1.1);
        }

        .nav-profile-pic {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform var(--transition-speed);
        }

        .nav-profile-pic:hover {
            transform: scale(1.1);
        }

        /* --- MOBILE BOTTOM NAVBAR --- */
        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: none; /* Desktop hidden */
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .bottom-navbar i {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-main);
            transition: transform 0.1s;
        }

        .bottom-navbar i:active {
            transform: scale(0.85); /* Mobile tap feedback */
        }

        /* --- MAIN CONTENT LAYOUT --- */
        .main-layout {
            max-width: 935px;
            margin: 85px auto 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 614px) 320px;
            gap: 28px;
            padding: 0 20px;
        }

        /* --- FEED SECTION (LEFT) --- */
        .feed-area {
            width: 100%;
        }

        /* Stories Wrapper */
        .stories-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            overflow-x: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .stories-wrapper::-webkit-scrollbar {
            display: none; /* Clean look */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            min-width: 66px;
            transition: transform var(--transition-speed);
        }

        .story-item:hover {
            transform: scale(1.03);
        }

        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-bg);
        }

        .story-item span {
            max-width: 65px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-main);
        }

        /* Post Card */
        .post-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .post-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-username {
            font-size: 14px;
            font-weight: 600;
        }

        .post-header i {
            cursor: pointer;
            color: var(--text-main);
        }

        .post-main-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        .post-actions-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px 6px 16px;
        }

        .action-left-group {
            display: flex;
            gap: 16px;
        }

        .post-actions-bar i {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s ease, color var(--transition-speed);
        }

        .post-actions-bar i:hover {
            transform: scale(1.1);
        }
        
        /* Interactive colors on action hover */
        .fa-heart:hover { color: #ed4956; }
        .fa-comment:hover { color: #8e8e8e; }
        .fa-paper-plane:hover { color: #1da1f2; }

        .likes-display {
            font-size: 14px;
            font-weight: 600;
            padding: 0 16px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .caption-display {
            font-size: 14px;
            padding: 0 16px;
            margin-bottom: 8px;
            line-height: 18px;
        }

        .caption-user {
            font-weight: 600;
            margin-right: 6px;
            cursor: pointer;
        }

        .view-comments-link {
            font-size: 14px;
            color: var(--text-muted);
            padding: 0 16px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .post-date {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 0 16px;
            margin-bottom: 14px;
        }

        .comment-section-input {
            border-top: 1px solid #efefef;
            display: flex;
            align-items: center;
            padding: 14px 16px;
        }

        .comment-section-input i {
            font-size: 24px;
            margin-right: 16px;
            cursor: pointer;
        }

        .comment-section-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .comment-section-input button {
            border: none;
            background: none;
            color: var(--link-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity var(--transition-speed);
        }

        .comment-section-input button:hover {
            opacity: 0.6;
        }

        /* --- SIDEBAR SECTION (RIGHT) --- */
        .sidebar-area {
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        .sidebar-self-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .self-profile-info {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .self-profile-info img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }

        .self-meta .self-fullname {
            font-size: 14px;
            color: var(--text-muted);
        }

        .action-link-btn {
            color: var(--link-color);
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            transition: color var(--transition-speed);
        }

        .action-link-btn:hover {
            color: #00376b;
        }

        .suggestions-title-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .suggestions-title-bar span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .suggestions-title-bar a {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .suggested-user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .suggested-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .suggested-user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .suggested-meta span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- RESPONSIVE MEDIA BREAKPOINTS --- */
        
        /* Laptop/Tablet Screens (Sidebar hidden) */
        @media (max-width: 1000px) {
            .main-layout {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
            .sidebar-area {
                display: none;
            }
        }

        /* Mobile Screens (Pure App View) */
        @media (max-width: 650px) {
            body {
                background-color: var(--card-bg);
            }
            .top-navbar .search-box, 
            .top-navbar .nav-icons {
                display: none;
            }
            .bottom-navbar {
                display: flex;
            }
            .main-layout {
                margin-top: 60px;
                padding: 0;
            }
            .stories-wrapper {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-top: none;
                padding: 12px 10px;
                margin-bottom: 0;
            }
            .post-container {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-top: 1px solid var(--border-color);
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
