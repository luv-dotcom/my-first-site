<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b",
    measurementId: "G-6SH8CWPWNC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Saare "Post" buttons ko select kiya
  const postButtons = document.querySelectorAll(".comment-post-btn");

  postButtons.forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      // Us post ke input box ko dhoonda
      const inputField = e.target.previousElementSibling;
      const commentText = inputField.value;

      if (commentText.trim() === "") return alert("Kuch toh likho!");

      try {
        await addDoc(collection(db, "comments"), {
          text: commentText,
          timestamp: new Date().toISOString()
        });
        alert("Comment save ho gaya!");
        inputField.value = ""; // Input box saaf kar diya
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  });
</script>
