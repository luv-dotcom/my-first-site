<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Responsive UI (Pro Version)</title>

    <!-- Instagram style font -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --link-color: #0095f6;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* ✅ NEW LOGO FONT */
        .logo-text {
            font-family: 'Grand Hotel', cursive;
            font-size: 28px;
            cursor: pointer;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 975px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: #efefef;
            border: none;
            padding: 7px 15px 7px 35px;
            border-radius: 8px;
            font-size: 14px;
            width: 268px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-icons {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-icons i {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-main);
        }

        .nav-profile-pic {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: none;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .bottom-navbar i {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-main);
        }

        .main-layout {
            max-width: 935px;
            margin: 80px auto 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 614px) 320px;
            gap: 28px;
            padding: 0 20px;
        }

        .feed-area {
            width: 100%;
        }

        .stories-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            overflow-x: auto;
            margin-bottom: 24px;
        }

        .stories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            min-width: 66px;
        }

        .story-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-bg);
        }

        .post-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .post-main-img img {
            width: 100%;
        }

        .post-actions-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .action-left-group {
            display: flex;
            gap: 16px;
        }

        @media (max-width: 650px) {
            .bottom-navbar {
                display: flex;
            }
        }
    </style>
</head>
<body>

<nav class="top-navbar">
    <div class="nav-container">
        <div class="logo">
            <!-- ✅ CHANGED ONLY THIS -->
            <div class="logo-text">Instagram</div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search">
        </div>

        <div class="nav-icons">
            <i class="fa-solid fa-house"></i>
            <i class="fa-regular fa-paper-plane"></i>
            <i class="fa-regular fa-square-plus"></i>
            <i class="fa-regular fa-compass"></i>
            <i class="fa-regular fa-heart"></i>
            <img src="https://picsum.photos/150/150?random=1" class="nav-profile-pic">
        </div>
    </div>
</nav>

</body>
</html>
