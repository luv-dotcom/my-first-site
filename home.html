<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Home</title>

    <!-- Instagram style font for the Logo Text -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Authentic Instagram Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL RESETS & VARIABLES --- */
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --link-color: #0095f6;
            --card-bg: #ffffff;
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOGO TEXT FONT --- */
        .logo-text {
            font-family: 'Grand Hotel', cursive;
            font-size: 30px;
            cursor: pointer;
            user-select: none;
            color: var(--text-main);
            text-decoration: none;
            display: inline-block;
        }

        /* --- TOP NAVBAR --- */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 975px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box { position: relative; }
        .search-box input {
            background-color: #efefef;
            border: none;
            padding: 7px 15px 7px 35px;
            border-radius: 8px;
            font-size: 14px;
            width: 268px;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-icons {
            display: flex;
            gap: 22px;
            align-items: center;
        }
        .nav-icons a {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .nav-icons i {
            font-size: 22px;
            cursor: pointer;
            transition: transform var(--transition-speed);
        }
        .nav-icons i:hover {
            transform: scale(1.1);
        }
        .nav-profile-pic {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        /* --- MOBILE BOTTOM NAVBAR --- */
        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: none; 
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .bottom-navbar a {
            color: var(--text-main);
            text-decoration: none;
        }
        .bottom-navbar i {
            font-size: 22px;
            cursor: pointer;
        }

        /* --- HOME FEED LAYOUT --- */
        .main-layout {
            max-width: 935px;
            margin: 85px auto 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 614px) 320px;
            gap: 28px;
            padding: 0 20px;
        }

        .stories-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .stories-wrapper::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            min-width: 66px;
        }
        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }
        .story-ring img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--card-bg);
        }

        /* Post Card */
        .post-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .post-header {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
        }
        .post-user { display: flex; align-items: center; gap: 10px; }
        .post-user img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .post-main-img img { width: 100%; height: auto; display: block; }
        .post-actions-bar { display: flex; justify-content: space-between; padding: 12px 16px; }
        .action-left-group { display: flex; gap: 16px; }
        .post-actions-bar i { font-size: 24px; cursor: pointer; }
        .post-actions-bar a { color: var(--text-main); text-decoration: none; }
        .likes-display { font-size: 14px; font-weight: 600; padding: 0 16px; margin-bottom: 6px; }
        .caption-display { font-size: 14px; padding: 0 16px; margin-bottom: 8px; }
        .caption-user { font-weight: 600; margin-right: 6px; }
        .comment-section-input { border-top: 1px solid #efefef; display: flex; align-items: center; padding: 14px 16px; }
        .comment-section-input input { flex: 1; border: none; outline: none; }
        .comment-section-input button { border: none; background: none; color: var(--link-color); font-weight: 600; cursor: pointer; }

        /* Sidebar Right */
        .sidebar-area { display: flex; flex-direction: column; padding-top: 10px; }
        .sidebar-self-profile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .sidebar-self-profile img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
        .suggested-user-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
        .suggested-user-info { display: flex; align-items: center; gap: 12px; }
        .suggested-user-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .suggested-meta span { display: block; font-size: 12px; color: var(--text-muted); }

        /* --- RESPONSIVE BREAKPOINTS --- */
        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; max-width: 600px; }
            .sidebar-area { display: none; }
        }

        @media (max-width: 650px) {
            body { background-color: var(--card-bg); }
            .top-navbar .search-box, .top-navbar .nav-icons { display: none; }
            .bottom-navbar { display: flex; }
            .main-layout { margin-top: 60px; padding: 0; }
            .stories-wrapper { border-radius: 0; border-left: none; border-right: none; border-top: none; }
            .post-container { border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="home.html" class="logo-text">Instagram</a>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search">
            </div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-solid fa-house"></i></a>
                <!-- Messages link -->
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="#"><i class="fa-regular fa-square-plus"></i></a>
                <a href="#"><i class="fa-regular fa-compass"></i></a>
                <a href="#"><i class="fa-regular fa-heart"></i></a>
                <img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic">
            </div>
        </div>
    </nav>

    <!-- FEED MAIN CONTENT -->
    <main class="main-layout">
        <section class="feed-area">
            <!-- Stories -->
            <div class="stories-wrapper">
                <div class="story-item">
                    <div class="story-ring"><img src="https://picsum.photos/150/150?random=2"></div>
                    <span>rohit_sharma</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://picsum.photos/150/150?random=3"></div>
                    <span>ananya_p</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://picsum.photos/150/150?random=4"></div>
                    <span>tech_guru</span>
                </div>
            </div>

            <!-- Post Unit -->
            <div class="post-container">
                <div class="post-header">
                    <div class="post-user">
                        <img src="https://picsum.photos/150/150?random=3">
                        <span class="post-username">ananya_p</span>
                    </div>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <div class="post-main-img">
                    <img src="https://picsum.photos/800/600?random=10">
                </div>
                <div class="post-actions-bar">
                    <div class="action-left-group">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <!-- Post DM click goes to messages.html -->
                        <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                    </div>
                    <i class="fa-regular fa-bookmark"></i>
                </div>
                <div class="likes-display">3,412 likes</div>
                <div class="caption-display"><span class="caption-user">ananya_p</span> Weekend vibes done right! ☕🍂</div>
            </div>
        </section>

        <!-- Sidebar Right -->
        <aside class="sidebar-area">
            <div class="sidebar-self-profile">
                <div class="suggested-user-info">
                    <img src="https://picsum.photos/150/150?random=1">
                    <div>
                        <div class="post-username">my_username</div>
                        <div class="suggested-meta"><span>Your Name</span></div>
                    </div>
                </div>
                <button class="action-link-btn">Switch</button>
            </div>
            <div class="suggested-user-row">
                <div class="suggested-user-info">
                    <img src="https://picsum.photos/150/150?random=20">
                    <div>
                        <div class="post-username">kabir_singh</div>
                        <div class="suggested-meta"><span>Followed by tech_guru</span></div>
                    </div>
                </div>
                <button class="action-link-btn">Follow</button>
            </div>
        </aside>
    </main>

    <!-- MOBILE BOTTOM NAVBAR -->
    <div class="bottom-navbar">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#"><i class="fa-regular fa-square-plus"></i></a>
        <a href="#"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
    </div>

</body>
</html>
