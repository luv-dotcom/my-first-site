<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Search</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --card-bg: #ffffff;
            --search-bg: #efefef;
            --link-color: #0095f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 60px;
            padding-bottom: 60px;
        }

        a { text-decoration: none; color: inherit; }

        /* --- 📌 TOP NAVIGATION BAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background-color: var(--card-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .nav-container {
            width: 100%; max-width: 975px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid black; }

        /* --- 📱 BOTTOM NAVBAR FOR MOBILE --- */
        .bottom-navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 52px;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .bottom-navbar i { font-size: 22px; }

        /* --- 🔍 SEARCH MAIN WORKSPACE --- */
        .search-container {
            max-width: 600px;
            margin: 30px auto 0 auto;
            padding: 0 20px;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 24px;
        }
        .search-input-wrapper input {
            width: 100%; padding: 12px 16px 12px 44px;
            background-color: var(--search-bg); border: none;
            border-radius: 8px; font-size: 16px; outline: none;
            color: var(--text-main);
        }
        .search-input-wrapper i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); font-size: 16px;
        }

        .recent-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .recent-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 600; margin-bottom: 16px;
        }
        .clear-all-btn {
            color: var(--link-color); font-size: 14px; cursor: pointer; font-weight: 600;
        }

        .search-results-list {
            display: flex; flex-direction: column; gap: 16px;
        }
        .searched-user-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0;
        }
        .user-profile-meta {
            display: flex; align-items: center; gap: 14px; width: 100%; cursor: pointer;
        }
        .user-profile-meta img {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
        }
        .user-name-box {
            display: flex; flex-direction: column; gap: 2px;
        }
        .u-username { font-size: 14px; font-weight: 600; }
        .u-fullname { font-size: 14px; color: var(--text-muted); }
        
        .remove-search-btn {
            color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 5px;
        }
        .remove-search-btn:hover { color: var(--text-main); }

        @media (max-width: 768px) {
            .top-navbar .nav-icons { display: none; }
            .bottom-navbar { display: flex; }
            
            .search-container { margin-top: 20px; padding: 0 16px; }
            .recent-section { border: none; background: transparent; padding: 0; }
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="home.html" class="logo-text">Instagram</a>
            </div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic" id="nav-avatar"></a>
            </div>
        </div>
    </nav>

    <main class="search-container">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search accounts, topics..." disabled>
        </div>

        <section class="recent-section">
            <div class="recent-header">
                <span id="list-title">Recent</span>
                <span class="clear-all-btn" id="clear-btn" style="display:none;">Clear results</span>
            </div>

            <div class="search-results-list" id="search-results">
                <div id="status-message" style="text-align: center; color: var(--text-muted); padding: 20px;">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading users...
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
        <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" id="bottom-avatar" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid black;"></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const searchInput = document.getElementById("search-input");
        const searchResultsContainer = document.getElementById("search-results");
        const listTitle = document.getElementById("list-title");
        const clearBtn = document.getElementById("clear-btn");
        
        const currentUserId = localStorage.getItem("active_user");
        const defaultPic = "https://picsum.photos/150/150?random=1";
        
        let allUsers = []; 

        async function fetchNavbarAvatar() {
            if (currentUserId) {
                try {
                    const userDoc = await getDoc(doc(db, "users", currentUserId));
                    if (userDoc.exists() && userDoc.data().profilePic) {
                        document.getElementById("nav-avatar").src = userDoc.data().profilePic;
                        document.getElementById("bottom-avatar").src = userDoc.data().profilePic;
                    }
                } catch (e) {
                    console.error("Error fetching avatar:", e);
                }
            }
        }

        async function cacheAllUsers() {
            try {
                const usersRef = collection(db, "users");
                const querySnapshot = await getDocs(usersRef);
                
                querySnapshot.forEach((userDoc) => {
                    const userData = userDoc.data();
                    allUsers.push({
                        id: userDoc.id,
                        username: (userData.username || "").toLowerCase(),
                        fullName: (userData.fullName || userData.name || "").toLowerCase(),
                        displayUsername: userData.username || userDoc.id,
                        displayFullName: userData.fullName || userData.name || "Instagram User",
                        profilePic: userData.profilePic || defaultPic
                    });
                });

                searchInput.disabled = false;
                showInitialMessage();
            } catch (error) {
                console.error("Error caching users:", error);
                searchResultsContainer.innerHTML = `<div style="text-align: center; color: red; padding: 20px;">Error loading data. Please refresh.</div>`;
            }
        }

        function showInitialMessage() {
            listTitle.innerText = "Recent";
            clearBtn.style.display = "none";
            searchResultsContainer.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                    Type something to search users...
                </div>`;
        }

        fetchNavbarAvatar();
        cacheAllUsers();

        searchInput.addEventListener("input", (e) => {
            const searchText = e.target.value.trim().toLowerCase();

            if (searchText === "") {
                showInitialMessage();
                return;
            }

            listTitle.innerText = "Search Results";
            
            const matches = allUsers.filter(user => 
                user.id.toLowerCase().includes(searchText) || 
                user.username.includes(searchText) || 
                user.fullName.includes(searchText)
            );

            if (matches.length === 0) {
                searchResultsContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">No users found.</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            
            matches.forEach((user) => {
                const userItem = document.createElement("div");
                userItem.className = "searched-user-item";
                userItem.innerHTML = `
                    <div class="user-profile-meta">
                        <img src="${user.profilePic}" alt="avatar">
                        <div class="user-name-box">
                            <span class="u-username">${user.displayUsername}</span>
                            <span class="u-fullname">${user.displayFullName}</span>
                        </div>
                    </div>
                `;

                // YAHA CHANGE KIYA HAI: Ab ye sahi file (user-profile.html) par bhejega
                userItem.querySelector('.user-profile-meta').addEventListener('click', () => {
                    window.location.href = `user-profile.html?username=${user.id}`;
                });

                fragment.appendChild(userItem);
            });

            searchResultsContainer.innerHTML = "";
            searchResultsContainer.appendChild(fragment);
        });
    </script>
</body>
</html>
