<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my_username • Instagram Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --blue: #0095f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-main); }

        /* Top Navigation Placeholder */
        .navbar { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; background: white; margin-bottom: 30px; }
        
        /* Main Container */
        .container { max-width: 935px; margin: 0 auto; padding: 0 20px; }

        /* Header Section */
        .profile-header { display: flex; align-items: center; gap: 80px; margin-bottom: 40px; }
        .avatar-section { width: 150px; height: 150px; border-radius: 50%; border: 1px solid var(--border-color); overflow: hidden; padding: 2px; }
        .avatar-section img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        
        .info-section { flex: 1; }
        .username-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .username { font-size: 28px; font-weight: 300; }
        .btn-edit { background: #efefef; border: none; padding: 7px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        .stats-row { display: flex; gap: 40px; margin-bottom: 20px; font-size: 16px; }
        .stats-row b { font-weight: 600; }
        
        .bio-info { font-size: 16px; line-height: 1.4; }
        
        /* Grid Section */
        .tabs { border-top: 1px solid var(--border-color); display: flex; justify-content: center; gap: 60px; margin-bottom: 20px; }
        .tab-item { padding: 20px 0; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-transform: uppercase; }
        .tab-item.active { color: var(--text-main); border-top: 1px solid var(--text-main); }
        
        /* The Grid */
        .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
        .post-item { position: relative; aspect-ratio: 1/1; cursor: pointer; background: #eee; overflow: hidden; }
        .post-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* Hover Overlay */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; gap: 20px; color: white; opacity: 0; transition: 0.3s; }
        .post-item:hover .overlay { opacity: 1; }
        .post-item:hover img { transform: scale(1.05); }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-header { gap: 30px; }
            .post-grid { gap: 3px; }
        }
    </style>
</head>
<body>

    <nav class="navbar"><h3>Instagram Profile</h3></nav>

    <main class="container">
        <section class="profile-header">
            <div class="avatar-section"><img src="https://picsum.photos/400" alt="Profile"></div>
            <div class="info-section">
                <div class="username-row">
                    <h2 class="username">my_username</h2>
                    <button class="btn-edit">Edit Profile</button>
                    <i class="fa-solid fa-gear" style="font-size: 22px; cursor: pointer;"></i>
                </div>
                <div class="stats-row">
                    <div><b>12</b> posts</div>
                    <div><b>1.2M</b> followers</div>
                    <div><b>150</b> following</div>
                </div>
                <div class="bio-info">
                    <b>Professional Developer 💻</b>
                    <p>Creating seamless digital experiences.<br>Firebase | JavaScript | CSS Master.<br>Keep building! 🚀</p>
                </div>
            </div>
        </section>

        <div class="tabs">
            <div class="tab-item active">POSTS</div>
            <div class="tab-item">REELS</div>
            <div class="tab-item">TAGGED</div>
        </div>

        <div class="post-grid">
            <div class="post-item"><img src="https://picsum.photos/600/600?random=1"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 5k</span><span><i class="fa-solid fa-comment"></i> 100</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=2"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 3k</span><span><i class="fa-solid fa-comment"></i> 80</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=3"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 2k</span><span><i class="fa-solid fa-comment"></i> 50</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=4"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 6k</span><span><i class="fa-solid fa-comment"></i> 200</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=5"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 1k</span><span><i class="fa-solid fa-comment"></i> 30</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=6"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 8k</span><span><i class="fa-solid fa-comment"></i> 500</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=7"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 4k</span><span><i class="fa-solid fa-comment"></i> 90</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=8"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 9k</span><span><i class="fa-solid fa-comment"></i> 700</span></div></div>
            <div class="post-item"><img src="https://picsum.photos/600/600?random=9"><div class="overlay"><span><i class="fa-solid fa-heart"></i> 2k</span><span><i class="fa-solid fa-comment"></i> 40</span></div></div>
        </div>
    </main>
</body>
</html>
