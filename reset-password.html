<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password • Instagram</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --card-bg: #ffffff;
            --btn-blue: #0095f6;
            --link-blue: #00376b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        a { text-decoration: none; }

        /* --- 🔒 MAIN RESET CARD --- */
        .reset-container {
            width: 100%;
            max-width: 388px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reset-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 44px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Lock Circle Icon */
        .lock-icon-circle {
            width: 96px;
            height: 96px;
            border: 2px solid var(--text-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        .lock-icon-circle i {
            font-size: 44px;
            color: var(--text-main);
        }

        .reset-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .reset-instructions {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 18px;
            margin-bottom: 24px;
        }

        /* Form Control */
        .reset-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-box {
            width: 100%;
            padding: 10px 8px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .input-box:focus {
            border-color: #a8a8a8;
        }

        .send-link-btn {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* OR Separator */
        .or-divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }
        .or-divider span {
            padding: 0 18px;
        }

        .create-account-link {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Bottom Back To Login Bar */
        .back-to-login-bar {
            width: 100%;
            background-color: #fafafa;
            border-top: 1px solid var(--border-color);
            padding: 16px;
            margin-top: 24px;
            margin-bottom: -44px; /* Align to the exact bottom of the main white card */
            border-radius: 0 0 4px 4px;
        }
        .back-to-login-bar a {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
        }

        /* --- 📱 MOBILE VIEW ADJUSTMENTS --- */
        @media (max-width: 450px) {
            body { background-color: var(--card-bg); }
            .reset-card { border: none; padding: 40px 20px; }
            .back-to-login-bar { background-color: var(--card-bg); }
        }
    </style>
</head>
<body>

    <main class="reset-container">
        
        <div class="reset-card">
            <div class="lock-icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h2 class="reset-title">Trouble logging in?</h2>
            <p class="reset-instructions">Enter your email, phone, or username and we'll send you a link to get back into your account.</p>

            <form class="reset-form" onsubmit="event.preventDefault(); alert('Reset link sent to your email!'); window.location.href='index.html';">
                <input type="text" class="input-box" placeholder="Email, Phone, or Username" required>
                <button type="submit" class="send-link-btn">Send login link</button>
            </form>

            <div class="or-divider">
                <span>OR</span>
            </div>

            <a href="#" class="create-account-link">Create new account</a>

            <div class="back-to-login-bar">
                <a href="index.html">Back to login</a>
            </div>
        </div>

    </main>

</body>
</html>
