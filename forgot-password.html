<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password • PixVibe</title>
    <style>
        /* CSS SETUP */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .reset-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 30px;
            width: 388px;
            text-align: center;
            box-sizing: border-box;
            border-radius: 1px;
        }
        /* LOCK ICON KO EXACT IMAGE JAISA GOL BANANE KE LIYE */
        .lock-icon {
            width: 96px;
            height: 96px;
            border: 2px solid #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 10px auto 20px;
        }
        h2 {
            font-size: 16px;
            color: #262626;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #737373;
            line-height: 18px;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            border: none;
            color: white;
            padding: 8px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }
        .divider {
            margin: 25px 0;
            border-bottom: 1px solid #dbdbdb;
            line-height: 0.1em;
        }
        .divider span {
            background: #fff;
            padding: 0 10px;
            color: #8e8e8e;
            font-size: 12px;
            font-weight: 600;
        }
        .create-account {
            display: inline-block;
            font-size: 14px;
            color: #262626;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 40px;
        }
        .back-to-login {
            background-color: #fafafa;
            border-top: 1px solid #dbdbdb;
            margin: 30px -30px -30px -30px;
            padding: 15px;
        }
        .back-to-login a {
            font-size: 14px;
            color: #262626;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="lock-icon">🔒</div>
        <h2>Trouble Logging In?</h2>
        <p>Enter your email and we'll send you a link to get back into your account.</p>
        
        <form id="forgotPasswordForm">
            <div class="input-group">
                <input type="email" id="recoveryInput" required placeholder="Email Address">
            </div>
            <button type="submit" id="submitBtn" disabled>Send Login Link</button>
        </form>

        <div class="divider"><span>OR</span></div>
        <a href="#" class="create-account">Create New Account</a>
        
        <div class="back-to-login">
            <a href="login.html">Back To Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // Firebase Config (Tumhare PixVibe Project Ki Details)
        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("forgotPasswordForm");
        const recoveryInput = document.getElementById("recoveryInput");
        const submitBtn = document.getElementById("submitBtn");

        // Input empty hone par button disable rakhne ka logic
        recoveryInput.addEventListener("input", () => {
            submitBtn.disabled = recoveryInput.value.trim() === "";
        });

        // Form Submit handler
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            
            const emailValue = recoveryInput.value.trim();
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Link...";

            try {
                // Firebase Magic Function for Password Reset
                await sendPasswordResetEmail(auth, emailValue);
                
                alert("If an account matches those details, a PixVibe recovery link has been sent!");
                form.reset();
                submitBtn.disabled = true; 
            } catch (error) {
                console.error("Firebase Error:", error);
                
                if (error.code === "auth/user-not-found") {
                    alert("This email is not registered on PixVibe.");
                } else if (error.code === "auth/invalid-email") {
                    alert("Please enter a valid email address.");
                } else {
                    alert("An error occurred. Please try again later.");
                }
            } finally {
                submitBtn.disabled = recoveryInput.value.trim() === "";
                submitBtn.innerText = "Send Login Link";
            }
        });
    </script>
</body>
</html>
