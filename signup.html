<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

<style>
:root{
    --bg-color:#121212;
    --border-color:#262626;
    --text-main:#ffffff;
    --text-muted:#a8a8a8;
    --card-bg:#000000;
    --link-color:#0095f6;
    --error-color:#ed4956;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
    background:var(--bg-color);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.auth-container{
    width:100%;
    max-width:350px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.auth-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:4px;
    padding:34px 28px 24px;
    text-align:center;
}
.logo-text{
    font-family:"Grand Hotel",cursive;
    font-size:52px;
    font-weight:400;
    margin-bottom:14px;
}
.subtitle{
    color:var(--text-muted);
    font-size:16px;
    line-height:1.25;
    font-weight:700;
    margin-bottom:18px;
}
.step-title{
    color:white;
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
    display:none;
}
form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
}
.input-box input,
.input-box select{
    width:100%;
    padding:11px 8px;
    background:#121212;
    border:1px solid var(--border-color);
    border-radius:4px;
    color:white;
    font-size:12px;
    outline:none;
}
.input-box input:focus,
.input-box select:focus{
    border-color:#555;
}
.auth-btn{
    margin-top:8px;
    background:var(--link-color);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}
.auth-btn:disabled{
    opacity:.55;
    cursor:default;
}
.back-btn{
    background:none;
    border:none;
    color:var(--link-color);
    font-size:13px;
    font-weight:700;
    margin-top:12px;
    display:none;
}
.msg-box{
    margin-top:14px;
    font-size:13px;
    line-height:1.4;
    color:var(--error-color);
    display:none;
}
.terms{
    color:var(--text-muted);
    font-size:11px;
    line-height:1.35;
    margin-top:14px;
}
.redirect-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:4px;
    padding:20px;
    text-align:center;
    font-size:14px;
}
.redirect-card a{
    color:var(--link-color);
    font-weight:700;
    text-decoration:none;
}
.step{
    display:none;
}
.step.active{
    display:flex;
    flex-direction:column;
    gap:6px;
}
</style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="logo-text">Instagram</h1>
        <p class="subtitle" id="main-subtitle">Sign up to see photos and videos from your friends.</p>

        <form id="signup-form" onsubmit="return false;">
            <div class="step active" id="step-1">
                <div class="input-box">
                    <input type="text" id="identity-input" placeholder="Mobile Number or Email" autocomplete="email">
                </div>
                <button type="button" class="auth-btn" id="step-1-btn">Next</button>
            </div>

            <div class="step" id="step-2">
                <div class="step-title" style="display:block;">Create your account</div>

                <div class="input-box">
                    <input type="text" id="fullname-input" placeholder="Full Name" autocomplete="name">
                </div>

                <div class="input-box">
                    <input type="text" id="username-input" placeholder="Username" autocomplete="username">
                </div>

                <div class="input-box">
                    <input type="password" id="password-input" placeholder="Password" autocomplete="new-password">
                </div>

                <button type="button" class="auth-btn" id="step-2-btn">Next</button>
            </div>

            <div class="step" id="step-3">
                <div class="step-title" style="display:block;">Complete your profile</div>

                <div class="input-box">
                    <input type="text" id="bio-input" placeholder="Bio">
                </div>

                <div class="input-box">
                    <select id="gender-input">
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>

                <div class="input-box">
                    <input type="url" id="pic-input" placeholder="Profile Pic URL (Optional)">
                </div>

                <button type="button" class="auth-btn" id="create-btn">Sign up</button>
            </div>
        </form>

        <button type="button" class="back-btn" id="back-btn">Back</button>

        <div id="status-msg" class="msg-box"></div>

        <p class="terms">
            By signing up, you agree to our Terms, Privacy Policy and Cookies Policy.
        </p>
    </div>

    <div class="redirect-card">
        Have an account? <a href="index.html">Log in</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const identityInput = document.getElementById("identity-input");
const fullnameInput = document.getElementById("fullname-input");
const usernameInput = document.getElementById("username-input");
const passwordInput = document.getElementById("password-input");
const bioInput = document.getElementById("bio-input");
const genderInput = document.getElementById("gender-input");
const picInput = document.getElementById("pic-input");

const step1 = document.getElementById("step-1");
const step2 = document.getElementById("step-2");
const step3 = document.getElementById("step-3");
const step1Btn = document.getElementById("step-1-btn");
const step2Btn = document.getElementById("step-2-btn");
const createBtn = document.getElementById("create-btn");
const backBtn = document.getElementById("back-btn");
const statusMsg = document.getElementById("status-msg");
const mainSubtitle = document.getElementById("main-subtitle");

let currentStep = 1;
let signupEmail = "";
let signupPhone = "";

step1Btn.addEventListener("click", checkIdentity);
step2Btn.addEventListener("click", checkAccountDetails);
createBtn.addEventListener("click", createAccount);
backBtn.addEventListener("click", goBack);

identityInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        checkIdentity();
    }
});

passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        checkAccountDetails();
    }
});

function showStep(step) {
    currentStep = step;

    step1.classList.remove("active");
    step2.classList.remove("active");
    step3.classList.remove("active");

    if (step === 1) {
        step1.classList.add("active");
        backBtn.style.display = "none";
        mainSubtitle.style.display = "block";
    }

    if (step === 2) {
        step2.classList.add("active");
        backBtn.style.display = "inline-block";
        mainSubtitle.style.display = "none";
    }

    if (step === 3) {
        step3.classList.add("active");
        backBtn.style.display = "inline-block";
        mainSubtitle.style.display = "none";
    }

    hideStatus();
}

function goBack() {
    if (currentStep === 3) {
        showStep(2);
        return;
    }

    if (currentStep === 2) {
        showStep(1);
    }
}

async function checkIdentity() {
    const identity = identityInput.value.trim().toLowerCase();

    hideStatus();

    if (!identity) {
        showStatus("Enter your mobile number or email.");
        return;
    }

    signupEmail = "";
    signupPhone = "";

    if (identity.includes("@")) {
        if (!isValidEmail(identity)) {
            showStatus("Enter a valid email address.");
            return;
        }

        signupEmail = identity;
    } else {
        const phone = identity.replace(/\D/g, "");

        if (!isValidIndianPhone(phone)) {
            showStatus("Enter a valid 10 digit phone number.");
            return;
        }

        signupPhone = phone;
    }

    step1Btn.disabled = true;
    step1Btn.innerText = "Checking...";

    try {
        const usersRef = collection(db, "users");

        if (signupEmail) {
            const emailSnap = await getDocs(query(usersRef, where("email", "==", signupEmail)));
            if (!emailSnap.empty) {
                showStatus("An account already exists with this email.");
                step1Btn.disabled = false;
                step1Btn.innerText = "Next";
                return;
            }
        }

        if (signupPhone) {
            const phoneSnap = await getDocs(query(usersRef, where("phone", "==", signupPhone)));
            if (!phoneSnap.empty) {
                showStatus("An account already exists with this phone number.");
                step1Btn.disabled = false;
                step1Btn.innerText = "Next";
                return;
            }
        }

        showStep(2);
    } catch (err) {
        console.error(err);
        showStatus("Database error. Try again.");
    }

    step1Btn.disabled = false;
    step1Btn.innerText = "Next";
}

async function checkAccountDetails() {
    const fullName = fullnameInput.value.trim();
    const username = usernameInput.value.trim().toLowerCase();
    const password = passwordInput.value.trim();

    hideStatus();

    if (!fullName || !username || !password) {
        showStatus("Full name, username and password are required.");
        return;
    }

    if (username.includes(" ")) {
        showStatus("Username cannot contain spaces.");
        return;
    }

    if (!/^[a-z0-9._]+$/.test(username)) {
        showStatus("Username can only use letters, numbers, dots and underscores.");
        return;
    }

    if (password.length < 6) {
        showStatus("Password must be at least 6 characters.");
        return;
    }

    step2Btn.disabled = true;
    step2Btn.innerText = "Checking...";

    try {
        const userDocSnap = await getDoc(doc(db, "users", username));

        if (userDocSnap.exists()) {
            showStatus("This username is already taken.");
            step2Btn.disabled = false;
            step2Btn.innerText = "Next";
            return;
        }

        showStep(3);
    } catch (err) {
        console.error(err);
        showStatus("Database error. Try again.");
    }

    step2Btn.disabled = false;
    step2Btn.innerText = "Next";
}

async function createAccount() {
    const fullName = fullnameInput.value.trim();
    const username = usernameInput.value.trim().toLowerCase();
    const password = passwordInput.value.trim();
    const bio = bioInput.value.trim();
    const gender = genderInput.value;
    let profilePic = picInput.value.trim();

    hideStatus();

    if (!bio || !gender) {
        showStatus("Bio and gender are required.");
        return;
    }

    if (!profilePic) {
        profilePic = `https://picsum.photos/150/150?random=${Math.floor(Math.random() * 1000)}`;
    }

    createBtn.disabled = true;
    createBtn.innerText = "Creating account...";

    try {
        await setDoc(doc(db, "users", username), {
            username: username,
            email: signupEmail,
            phone: signupPhone,
            password: password,
            fullName: fullName,
            bio: bio,
            gender: gender,
            profilePic: profilePic,
            followers: [],
            following: [],
            createdAt: new Date()
        });

        localStorage.setItem("active_user", username);
        window.location.href = "home.html";
    } catch (err) {
        console.error(err);
        showStatus("Failed to create account. Try again.");
        createBtn.disabled = false;
        createBtn.innerText = "Sign up";
    }
}

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isValidIndianPhone(phone) {
    return /^[6-9]\d{9}$/.test(phone);
}

function showStatus(text) {
    statusMsg.innerText = text;
    statusMsg.style.display = "block";
}

function hideStatus() {
    statusMsg.innerText = "";
    statusMsg.style.display = "none";
}
</script>

</body>
</html>
