<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #a8a8a8;
            --card-bg: #000000;
            --link-color: #0095f6;
            --error-color: #ed4956;
            --success-color: #2ed573;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 30px 25px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 50px; margin-bottom: 15px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        form { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .input-box input, .input-box select { width: 100%; padding: 10px 8px; background: #121212; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; outline: none; color: white; }
        .input-box input:focus, .input-box select:focus { border-color: #555; }
        
        /* Hidden Profile Fields Section */
        .profile-details-section { display: none; flex-direction: column; gap: 6px; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 15px; animation: slideDown 0.3s ease-in-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 13px; color: var(--text-muted); font-weight: 600; text-align: left; margin-bottom: 4px; }

        .auth-btn { background: var(--link-color); color: white; border: none; border-radius: 4px; padding: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .auth-btn:disabled { opacity: 0.6; }
        .msg-box { margin-top: 15px; font-size: 13px; display: none; font-weight: 500; }
        .error-msg { color: var(--error-color); }
        .success-msg { color: var(--success-color); }
        .redirect-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 20px; text-align: center; font-size: 14px; }
        .redirect-card a { color: var(--link-color); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="logo-text">Instagram</h1>
            <p class="subtitle" id="form-subtitle">Sign up to see photos and videos from your friends.</p>
            
            <form id="signup-form" onsubmit="return false;">
                <div class="input-box">
                    <input type="email" id="email-input" placeholder="Email Address" required>
                </div>
                <div class="input-box">
                    <input type="password" id="password-input" placeholder="Password" required>
                </div>

                <div class="profile-details-section" id="profile-details">
                    <p class="section-title"><i class="fa-solid fa-user-plus"></i> Setup Your Profile</p>
                    <div class="input-box">
                        <input type="text" id="username-input" placeholder="Username">
                    </div>
                    <div class="input-box">
                        <input type="text" id="fullname-input" placeholder="Full Name">
                    </div>
                    <div class="input-box">
                        <input type="text" id="bio-input" placeholder="Bio">
                    </div>
                    <div class="input-box">
                        <select id="gender-input">
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Custom">Prefer not to say</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <input type="url" id="pic-input" placeholder="Profile Pic URL (Optional)">
                    </div>
                </div>

                <button type="button" class="auth-btn" id="action-btn">Check Email Availability</button>
            </form>

            <div id="status-msg" class="msg-box"></div>
        </div>

        <div class="redirect-card">
            Have an account? <a href="index.html">Log in</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        const emailInput = document.getElementById("email-input");
        const passwordInput = document.getElementById("password-input");
        const usernameInput = document.getElementById("username-input");
        const fullnameInput = document.getElementById("fullname-input");
        const bioInput = document.getElementById("bio-input");
        const genderInput = document.getElementById("gender-input");
        const picInput = document.getElementById("pic-input");
        
        const profileSection = document.getElementById("profile-details");
        const actionBtn = document.getElementById("action-btn");
        const statusMsg = document.getElementById("status-msg");

        let isEmailVerified = false;

        emailInput.addEventListener("input", () => {
            if (isEmailVerified) {
                isEmailVerified = false;
                profileSection.style.display = "none";
                actionBtn.innerText = "Check Email Availability";
                actionBtn.style.background = "#0095f6";
                statusMsg.style.display = "none";
            }
        });

        actionBtn.addEventListener("click", async () => {
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showStatus("⚠️ Email and Password are required!", "error");
                return;
            }

            // --- STEP 1: CHECK ACC EXISTENCE ---
            if (!isEmailVerified) {
                actionBtn.disabled = true;
                actionBtn.innerText = "Checking email...";
                
                try {
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("email", "==", email));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        showStatus("❌ Account already exists with this email!", "error");
                    } else {
                        isEmailVerified = true;
                        showStatus("✨ Email available! Fill profile details below.", "success");
                        profileSection.style.display = "flex";
                        actionBtn.innerText = "Complete Sign Up";
                        actionBtn.style.background = "#2ed573";
                    }
                } catch (err) {
                    showStatus("Database error. Try again.", "error");
                } finally {
                    actionBtn.disabled = false;
                }
            } 
            // --- STEP 2: REGISTER NEW USER ---
            else {
                const username = usernameInput.value.trim().toLowerCase();
                const name = fullnameInput.value.trim();
                const bio = bioInput.value.trim();
                const gender = genderInput.value;
                let profilePic = picInput.value.trim();

                if (!username || !name || !bio || !gender) {
                    showStatus("⚠️ All profile fields (except Pic) are mandatory!", "error");
                    return;
                }
                if (username.includes(" ")) {
                    showStatus("❌ Username cannot contain spaces!", "error");
                    return;
                }

                actionBtn.disabled = true;
                actionBtn.innerText = "Creating Account...";

                try {
                    // Check if unique username document ID path already exists
                    const userDocSnap = await getDoc(doc(db, "users", username));
                    if (userDocSnap.exists()) {
                        showStatus("❌ Username handle already taken!", "error");
                        actionBtn.disabled = false;
                        actionBtn.innerText = "Complete Sign Up";
                        return;
                    }

                    if (!profilePic) {
                        profilePic = `https://picsum.photos/150/150?random=${Math.floor(Math.random() * 100)}`;
                    }

                    // Save Data
                    await setDoc(doc(db, "users", username), {
                        username: username,
                        email: email,
                        password: password,
                        name: name,
                        bio: bio,
                        gender: gender,
                        profilePic: profilePic
                    });

                    showStatus("🎉 Account created! Redirecting to feed...", "success");
                    localStorage.setItem("active_user", username);
                    
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 2000);

                } catch (err) {
                    showStatus("Failed to create profile.", "error");
                    actionBtn.disabled = false;
                }
            }
        });

        function showStatus(text, type) {
            statusMsg.innerText = text;
            statusMsg.className = "msg-box " + (type === "error" ? "error-msg" : "success-msg");
            statusMsg.style.display = "block";
        }
    </script>
</body>
</html>
