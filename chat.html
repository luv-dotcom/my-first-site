<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messages • Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --border-color: #dbdbdb; --bg-color: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; }
        body { background: #fafafa; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 100%; max-width: 935px; height: 85vh; background: white; border: 1px solid var(--border-color); border-radius: 4px; display: flex; }
        .left-panel { width: 350px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .right-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .panel-header { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; font-weight: 600; font-size: 16px; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 60%; padding: 10px 15px; border-radius: 20px; font-size: 14px; word-wrap: break-word; }
        .msg.sent { background: #0095f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.received { background: #efefef; color: black; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-box { height: 60px; border-top: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; gap: 10px; }
        .input-box input { flex: 1; height: 40px; border: 1px solid var(--border-color); border-radius: 20px; padding: 0 15px; outline: none; }
        .input-box button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="left-panel">
            <div class="panel-header"><a href="home.html" style="color:black; text-decoration:none;"><i class="fa-solid fa-chevron-left" style="margin-right:10px;"></i> Chats</a></div>
            <div style="padding: 20px; color: #8e8e8e; font-size: 14px; text-align: center;">Active Conversations</div>
        </div>

        <div class="right-panel">
            <div class="panel-header" id="chat-user-header">Chatting with...</div>
            <div class="messages-box" id="messages-container"></div>
            <div class="input-box">
                <input type="text" id="msg-input" placeholder="Message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        }));

        const urlParams = new URLSearchParams(window.location.search);
        const targetChatUser = urlParams.get('id');
        const activeUser = localStorage.getItem("active_user");

        if(!activeUser) window.location.href = "login.html";
        document.getElementById("chat-user-header").innerText = `Chat with @${targetChatUser || 'User'}`;

        const msgInput = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");
        const container = document.getElementById("messages-container");

        // Unique Chat ID logic combo
        const chatRoomId = [activeUser, targetChatUser].sort().join("_");

        // Send Message
        sendBtn.onclick = async () => {
            if(msgInput.value.trim() === "") return;
            await addDoc(collection(db, "chats"), {
                room: chatRoomId,
                sender: activeUser,
                text: msgInput.value,
                timestamp: new Date().getTime()
            });
            msgInput.value = "";
        };

        // Listen for Realtime Live Messages
        const q = query(collection(db, "chats"), where("room", "==", chatRoomId), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement("div");
                div.className = `msg ${data.sender === activeUser ? 'sent' : 'received'}`;
                div.innerText = data.text;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight; // Auto-scroll to bottom
        });
    </script>
</body>
</html>
