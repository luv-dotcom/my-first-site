<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Notifications</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-main: #262626;
            --text-muted: #8e8e8e;
            --card-bg: #ffffff;
            --btn-blue: #0095f6;
            --btn-grey: #efefef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 60px;
            padding-bottom: 60px;
        }

        a { text-decoration: none; color: inherit; }

        /* --- 📌 TOP NAVIGATION BAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background-color: var(--card-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .nav-container {
            width: 100%; max-width: 975px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 30px; }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icons i { font-size: 22px; cursor: pointer; }
        .nav-profile-pic { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid black; }

        /* --- 📱 BOTTOM NAVBAR FOR MOBILE --- */
        .bottom-navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 52px;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .bottom-navbar i { font-size: 22px; }

        /* --- 🔔 NOTIFICATIONS CONTAINER --- */
        .notif-container {
            max-width: 600px;
            margin: 20px auto 0 auto;
            padding: 0 20px;
        }

        .notif-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        /* Section Segments (This Week, This Month) */
        .notif-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f5f5f5;
        }

        /* Notification Row Layout */
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .notif-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .notif-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            line-height: 18px;
            flex: 1;
        }

        .notif-left img.user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .notif-text span.username {
            font-weight: 600;
            cursor: pointer;
        }

        .notif-text span.time {
            color: var(--text-muted);
            font-size: 13px;
            margin-left: 4px;
        }

        /* Right Side Actions (Buttons or Post Thumbnails) */
        .notif-right {
            display: flex;
            align-items: center;
        }

        .notif-post-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
        }

        .follow-btn {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .following-btn {
            background-color: var(--btn-grey);
            color: var(--text-main);
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* --- 📱 MOBILE VIEW OPTIMIZATIONS --- */
        @media (max-width: 768px) {
            .top-navbar .nav-icons { display: none; }
            .bottom-navbar { display: flex; }
            
            .notif-container { margin-top: 10px; padding: 0 12px; }
            .notif-section { border: none; background: transparent; padding: 0; margin-bottom: 25px; }
            .notif-title { font-size: 20px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="top-navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="home.html" class="logo-text">Instagram</a>
            </div>
            <div class="nav-icons">
                <a href="home.html"><i class="fa-regular fa-house"></i></a>
                <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
                <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
                <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
                <a href="notifications.html"><i class="fa-solid fa-heart"></i></a>
                <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic"></a>
            </div>
        </div>
    </nav>

    <!-- NOTIFICATIONS MAIN HUB -->
    <main class="notif-container">
        
        <h1 class="notif-title">Notifications</h1>

        <!-- SECTION 1: THIS WEEK -->
        <section class="notif-section">
            <h2 class="section-title">This Week</h2>
            <div class="notif-list">
                
                <!-- Type 1: Liked Post (Shows Post Thumbnail on Right) -->
                <div class="notif-item">
                    <div class="notif-left">
                        <img src="https://picsum.photos/100/100?random=21" class="user-avatar" alt="user">
                        <p class="notif-text"><span class="username">hardik_pandya</span> liked your photo.<span class="time">2d</span></p>
                    </div>
                    <div class="notif-right">
                        <img src="https://picsum.photos/200/200?random=10" class="notif-post-thumb" alt="post thumb">
                    </div>
                </div>

                <!-- Type 2: Started Following (Shows Follow Back Button) -->
                <div class="notif-item">
                    <div class="notif-left">
                        <img src="https://picsum.photos/100/100?random=22" class="user-avatar" alt="user">
                        <p class="notif-text"><span class="username">shubmangill</span> started following you.<span class="time">4d</span></p>
                    </div>
                    <div class="notif-right">
                        <button class="follow-btn">Follow Back</button>
                    </div>
                </div>

                <!-- Type 3: Commented on Post -->
                <div class="notif-item">
                    <div class="notif-left">
                        <img src="https://picsum.photos/100/100?random=23" class="user-avatar" alt="user">
                        <p class="notif-text"><span class="username">rohit_sharma</span> commented: "Kya baat hai bhai! 🔥"<span class="time">5d</span></p>
                    </div>
                    <div class="notif-right">
                        <img src="https://picsum.photos/200/200?random=11" class="notif-post-thumb" alt="post thumb">
                    </div>
                </div>

            </div>
        </section>

        <!-- SECTION 2: EARLIER THIS MONTH -->
        <section class="notif-section">
            <h2 class="section-title">Earlier</h2>
            <div class="notif-list">
                
                <!-- Type 4: Already Following (Shows Following Grey Button) -->
                <div class="notif-item">
                    <div class="notif-left">
                        <img src="https://picsum.photos/100/100?random=24" class="user-avatar" alt="user">
                        <p class="notif-text"><span class="username">klrahul</span> started following you.<span class="time">2w</span></p>
                    </div>
                    <div class="notif-right">
                        <button class="following-btn">Following</button>
                    </div>
                </div>

                <!-- Type 5: Another Liked Post -->
                <div class="notif-item">
                    <div class="notif-left">
                        <img src="https://picsum.photos/100/100?random=25" class="user-avatar" alt="user">
                        <p class="notif-text"><span class="username">virat.kohli</span> liked your photo.<span class="time">3w</span></p>
                    </div>
                    <div class="notif-right">
                        <img src="https://picsum.photos/200/200?random=12" class="notif-post-thumb" alt="post thumb">
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION BANNER -->
    <nav class="bottom-navbar">
        <a href="home.html"><i class="fa-regular fa-house"></i></a>
        <a href="search.html"><i class="fa-regular fa-magnifying-glass"></i></a>
        <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
        <a href="explore.html"><i class="fa-regular fa-compass"></i></a>
        <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid black;"></a>
    </nav>

</body>
</html>
