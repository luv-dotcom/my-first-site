<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Advanced</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

.reels-container {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.reel {
  position: relative;
  height: 100vh;
  width: 100%;
  scroll-snap-align: start;
}

video {
  height: 100%;
  width: 100%;
  object-fit: cover;
}

/* Right side actions */
.actions {
  position: absolute;
  right: 10px;
  bottom: 80px;
  color: white;
  text-align: center;
}

.actions div {
  margin: 15px 0;
  font-size: 20px;
  cursor: pointer;
}

/* Bottom text */
.bottom {
  position: absolute;
  bottom: 20px;
  left: 10px;
  color: white;
}

.username {
  font-weight: bold;
}

.heart {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 80px;
  color: white;
  opacity: 0.8;
  transition: 0.3s;
}

</style>
</head>

<body>

<div class="reels-container">

  <!-- Reel 1 -->
  <div class="reel" ondblclick="bigLike(this)">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted></video>

    <div class="heart">❤️</div>

    <div class="actions">
      <div onclick="like(this)">❤️<br><span>120</span></div>
      <div>💬<br>30</div>
      <div>📤</div>
    </div>

    <div class="bottom">
      <div class="username">user1</div>
      <div>Amazing reel 😍</div>
    </div>
  </div>

  <!-- Reel 2 -->
  <div class="reel" ondblclick="bigLike(this)">
    <video src="https://www.w3schools.com/html/movie.mp4" autoplay loop muted></video>

    <div class="heart">❤️</div>

    <div class="actions">
      <div onclick="like(this)">❤️<br><span>89</span></div>
      <div>💬<br>12</div>
      <div>📤</div>
    </div>

    <div class="bottom">
      <div class="username">user2</div>
      <div>Travel vibes 🌍</div>
    </div>
  </div>

</div>

<script>
// like button
function like(el){
  let span = el.querySelector("span");
  let count = parseInt(span.innerText);
  span.innerText = count + 1;
}

// double tap animation
function bigLike(reel){
  let heart = reel.querySelector(".heart");
  heart.style.transform = "translate(-50%, -50%) scale(1)";
  
  setTimeout(()=>{
    heart.style.transform = "translate(-50%, -50%) scale(0)";
  }, 400);
}
</script>

</body>
</html>
