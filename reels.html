<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels</title>

<style>
body{margin:0;background:black;overflow:hidden}
.container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;position:relative;scroll-snap-align:start}
video{width:100%;height:100%;object-fit:cover}
.actions{position:absolute;right:10px;bottom:80px;color:#fff;text-align:center}
.actions div{margin:10px 0}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#000;color:#fff;padding:10px}
</style>
</head>

<body>

<div class="container">

  <div class="reel">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted></video>
    <div class="actions">
      <div onclick="like(this)">❤️<br><span>100</span></div>
    </div>
  </div>

  <div class="reel">
    <video src="https://www.w3schools.com/html/movie.mp4" autoplay loop muted></video>
    <div class="actions">
      <div onclick="like(this)">❤️<br><span>55</span></div>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<div class="nav">
  <div onclick="goHome()">🏠</div>
  <div onclick="goReels()">🎬</div>
</div>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
  window.location.href="index.html";
}

function like(el){
  let span=el.querySelector("span");
  span.innerText=parseInt(span.innerText)+1;
}

function goHome(){
  window.location.href="home.html";
}

function goReels(){
  window.location.href="reels.html";
}
</script>

</body>
</html>
