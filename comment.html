<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram - Comments</title>

<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --bg:#ffffff;
    --border:#dbdbdb;
    --text:#262626;
    --muted:#8e8e8e;
    --card:#ffffff;
    --blue:#0095f6;
    --red:#ed4956;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
    background:var(--bg);
    color:var(--text);
    padding-top:60px;
    padding-bottom:72px;
}
a{
    text-decoration:none;
    color:inherit;
}
button,input{
    font:inherit;
}
button{
    cursor:pointer;
    border:0;
    background:none;
}
.top-navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}
.nav-container{
    width:100%;
    max-width:975px;
    padding:0 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo-text{
    font-family:'Grand Hotel',cursive;
    font-size:30px;
}
.nav-icons{
    display:flex;
    gap:22px;
    align-items:center;
}
.nav-icons i{
    font-size:22px;
}
.nav-profile-pic{
    width:26px;
    height:26px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid black;
}
.comments-container{
    max-width:600px;
    margin:20px auto 0;
    padding:0 20px;
}
.comments-header{
    display:flex;
    align-items:center;
    gap:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
}
.comments-header i{
    font-size:20px;
}
.comments-header h2{
    font-size:18px;
    font-weight:700;
}
.post-preview{
    display:none;
    gap:12px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
}
.post-preview img,
.post-preview video{
    width:52px;
    height:52px;
    border-radius:6px;
    object-fit:cover;
    background:#efefef;
}
.post-preview-text{
    flex:1;
    min-width:0;
    font-size:14px;
    line-height:1.35;
}
.post-preview-text strong{
    margin-right:6px;
}
.comments-list{
    display:flex;
    flex-direction:column;
    gap:20px;
}
.comment-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}
.comment-left{
    display:flex;
    gap:14px;
    font-size:14px;
    line-height:18px;
    min-width:0;
}
.comment-left img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#efefef;
    flex-shrink:0;
}
.comment-text-block{
    min-width:0;
}
.comment-text-block .username{
    font-weight:700;
    margin-right:6px;
}
.comment-text{
    word-break:break-word;
}
.comment-meta{
    display:flex;
    gap:12px;
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}
.comment-meta span{
    cursor:pointer;
}
.comment-right button{
    color:var(--muted);
    font-size:13px;
    padding-top:4px;
}
.comment-right button.liked{
    color:var(--red);
}
.empty-state{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:14px;
}
.comment-input-bar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:600px;
    background:#ffffff;
    border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:1000;
}
.user-mini-pic{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    background:#efefef;
    flex-shrink:0;
}
.comment-input-bar input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    font-size:14px;
    padding:8px 0;
}
.post-comment-btn{
    color:var(--blue);
    font-weight:700;
    font-size:14px;
}
.post-comment-btn:disabled{
    opacity:.45;
    cursor:default;
}
.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(18px);
    background:rgba(0,0,0,.82);
    color:white;
    padding:10px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    opacity:0;
    transition:.25s;
    z-index:2000;
}
.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
@media(max-width:768px){
    .top-navbar{
        display:none;
    }
    body{
        padding-top:16px;
    }
    .comments-container{
        padding:0 16px;
    }
    .comment-input-bar{
        max-width:100vw;
    }
}
</style>
</head>

<body>

<nav class="top-navbar">
    <div class="nav-container">
        <a href="home.html" class="logo-text">Instagram</a>

        <div class="nav-icons">
            <a href="home.html"><i class="fa-solid fa-house"></i></a>
            <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
            <a href="create.html"><i class="fa-regular fa-square-plus"></i></a>
            <a href="reels.html"><i class="fa-regular fa-clapperboard"></i></a>
            <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
            <a href="profile.html"><img src="https://picsum.photos/150/150?random=1" alt="Profile" class="nav-profile-pic" id="nav-avatar"></a>
        </div>
    </div>
</nav>

<main class="comments-container">
    <div class="comments-header">
        <button id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h2>Comments</h2>
    </div>

    <div class="post-preview" id="post-preview">
        <div id="post-preview-media"></div>
        <div class="post-preview-text">
            <p id="post-preview-caption"></p>
        </div>
    </div>

    <div class="comments-list" id="comments-list">
        <div class="empty-state">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading comments...
        </div>
    </div>
</main>

<div class="comment-input-bar">
    <img src="https://picsum.photos/150/150?random=1" class="user-mini-pic" id="my-avatar" alt="my avatar">
    <input type="text" id="comment-input" placeholder="Add a comment...">
    <button class="post-comment-btn" id="post-comment-btn" disabled>Post</button>
</div>

<div class="toast" id="toast">Done</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    updateDoc,
    onSnapshot,
    query,
    orderBy,
    increment,
    arrayUnion,
    arrayRemove,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);

const currentUser = localStorage.getItem("active_user");
const params = new URLSearchParams(window.location.search);
const postId = params.get("postId") || params.get("post") || params.get("id");

const defaultAvatar = "https://picsum.photos/150/150?random=1";

let currentProfilePic = defaultAvatar;
let currentPost = null;

if (!currentUser) {
    window.location.href = `comments.html?postId=${postId}`;
}

if (!postId) {
    $("comments-list").innerHTML = `<div class="empty-state">Post ID missing. Open comments from a post.</div>`;
}

function esc(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function toast(text) {
    $("toast").innerText = text;
    $("toast").classList.add("show");

    setTimeout(() => {
        $("toast").classList.remove("show");
    }, 1500);
}

function timeAgo(timestamp) {
    try {
        const date = timestamp && timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));

        if (seconds < 60) return "now";

        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;

        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h`;

        return `${Math.floor(hours / 24)}d`;
    } catch (err) {
        return "";
    }
}

$("back-btn").addEventListener("click", () => {
    if (document.referrer) {
        history.back();
    } else {
        window.location.href = "home.html";
    }
});

$("comment-input").addEventListener("input", () => {
    $("post-comment-btn").disabled = $("comment-input").value.trim() === "";
});

$("comment-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !$("post-comment-btn").disabled) {
        e.preventDefault();
        $("post-comment-btn").click();
    }
});

$("post-comment-btn").addEventListener("click", addComment);

async function loadMe() {
    try {
        const snap = await getDoc(doc(db, "users", currentUser));

        if (snap.exists()) {
            const data = snap.data();
            currentProfilePic = data.profilePic || defaultAvatar;
        }

        $("my-avatar").src = currentProfilePic;
        $("nav-avatar").src = currentProfilePic;
    } catch (err) {
        console.error("User load failed:", err);
    }
}

async function loadPostPreview() {
    if (!postId) return;

    try {
        const snap = await getDoc(doc(db, "posts", postId));

        if (!snap.exists()) {
            $("post-preview").style.display = "none";
            return;
        }

        currentPost = snap.data();

        const author = currentPost.userId || currentPost.username || "user";
        const caption = currentPost.caption || "";
        const mediaType = currentPost.mediaType || (currentPost.videoUrl ? "video" : "image");
        const mediaUrl = currentPost.postImg || currentPost.imageUrl || currentPost.mediaUrl || currentPost.videoUrl || "";

        $("post-preview").style.display = "flex";

        $("post-preview-media").innerHTML = mediaType === "video"
            ? `<video src="${esc(mediaUrl)}" muted playsinline></video>`
            : `<img src="${esc(mediaUrl || defaultAvatar)}" alt="Post">`;

        $("post-preview-caption").innerHTML = `<strong>${esc(author)}</strong>${esc(caption)}`;
    } catch (err) {
        console.error("Post preview failed:", err);
    }
}

function listenComments() {
    if (!postId) return;

    const commentsQuery = query(collection(db, "comments"), orderBy("timestamp", "asc"));

    onSnapshot(commentsQuery, (snap) => {
        const list = $("comments-list");
        list.innerHTML = "";

        let count = 0;

        snap.forEach((commentDoc) => {
            const comment = {
                id: commentDoc.id,
                ...commentDoc.data()
            };

            if (comment.postId !== postId) return;

            count++;

            const row = document.createElement("div");
            row.className = "comment-item";

            const likedBy = Array.isArray(comment.likedBy) ? comment.likedBy : [];
            const isLiked = likedBy.includes(currentUser);

            row.innerHTML = `
                <div class="comment-left">
                    <img src="${esc(comment.profilePic || defaultAvatar)}" alt="user">
                    <div class="comment-text-block">
                        <p class="comment-text">
                            <span class="username">${esc(comment.commentedBy || "anonymous")}</span>${esc(comment.text || "")}
                        </p>
                        <div class="comment-meta">
                            <span>${timeAgo(comment.timestamp)}</span>
                            <span>${comment.likesCount || 0} likes</span>
                            <span>Reply</span>
                        </div>
                    </div>
                </div>

                <div class="comment-right">
                    <button class="comment-like-btn ${isLiked ? "liked" : ""}" data-comment-id="${comment.id}">
                        <i class="${isLiked ? "fa-solid" : "fa-regular"} fa-heart"></i>
                    </button>
                </div>
            `;

            list.appendChild(row);
        });

        if (count === 0) {
            list.innerHTML = `<div class="empty-state">No comments yet. Start the conversation.</div>`;
        }
    });
}

$("comments-list").addEventListener("click", async (e) => {
    const btn = e.target.closest(".comment-like-btn");
    if (!btn) return;

    const commentId = btn.dataset.commentId;
    const isLiked = btn.classList.contains("liked");

    btn.classList.toggle("liked", !isLiked);
    btn.innerHTML = `<i class="${isLiked ? "fa-regular" : "fa-solid"} fa-heart"></i>`;

    try {
        await updateDoc(doc(db, "comments", commentId), {
            likedBy: isLiked ? arrayRemove(currentUser) : arrayUnion(currentUser),
            likesCount: increment(isLiked ? -1 : 1)
        });
    } catch (err) {
        console.error("Comment like failed:", err);
        toast("Like update failed");
    }
});

async function addComment() {
    if (!postId) {
        toast("Post missing");
        return;
    }

    const text = $("comment-input").value.trim();
    if (!text) return;

    $("post-comment-btn").disabled = true;
    $("comment-input").value = "";

    try {
        await addDoc(collection(db, "comments"), {
            postId,
            text,
            commentedBy: currentUser,
            profilePic: currentProfilePic,
            likedBy: [],
            likesCount: 0,
            timestamp: serverTimestamp()
        });

        await updateDoc(doc(db, "posts", postId), {
            commentsCount: increment(1)
        });
    } catch (err) {
        console.error("Comment add failed:", err);
        $("comment-input").value = text;
        toast("Comment post nahi hua. Firebase rules check karo.");
    } finally {
        $("post-comment-btn").disabled = $("comment-input").value.trim() === "";
    }
}

await loadMe();
await loadPostPreview();
listenComments();
</script>

</body>
</html>
