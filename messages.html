<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram DM Clone</title>
</head>
<body>

    <div id="messages-page-wrapper" style="display: flex; height: 100vh; width: 100vw;">
        <div id="chat-sidebar" style="width: 350px; border-right: 1px solid #dbdbdb; display: flex; flex-direction: column;">
            <div style="padding: 20px; border-bottom: 1px solid #dbdbdb; font-size: 20px; font-weight: bold;" id="nav-my-username">Loading...</div>
            <div id="global-users-chat-list" style="flex: 1; overflow-y: auto;"></div>
        </div>
        <div id="chat-main-window" style="flex: 1; display: flex; flex-direction: column;">
            <div id="placeholder-box" style="flex: 1; display: flex; align-items: center; justify-content: center;"><h2>Your Messages</h2></div>
            <div id="active-chat-box" style="flex: 1; display: none; flex-direction: column;">
                <div style="padding: 15px; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center;">
                    <img id="chat-user-avatar" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
                    <span id="chat-user-username" style="font-weight: 600;"></span>
                </div>
                <div id="chat-messages-container" style="flex: 1; padding: 20px; overflow-y: auto;"></div>
                <div style="padding: 15px; border-top: 1px solid #dbdbdb;">
                    <input type="text" id="message-text-input" placeholder="Message..." style="width: 80%; padding: 10px;">
                    <button id="send-btn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, collection, addDoc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        
        const db = getFirestore(initializeApp(firebaseConfig));
        let myUsername = localStorage.getItem("active_user") || "Guest_User";
        let activeRoomListeners = {};

        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("nav-my-username").innerText = myUsername;
            document.getElementById("send-btn").addEventListener("click", sendMessageLogic);
            listenToInbox();
        });

        function listenToInbox() {
            onSnapshot(collection(db, "users"), (usersSnapshot) => {
                let userList = [];
                usersSnapshot.forEach(u => {
                    if (u.data().username !== myUsername) userList.push({ ...u.data(), id: u.data().username });
                });

                userList.forEach(user => {
                    const roomId = [myUsername, user.id].sort().join("_chat_room_");
                    if (activeRoomListeners[roomId]) activeRoomListeners[roomId]();
                    
                    activeRoomListeners[roomId] = onSnapshot(doc(db, "chats", roomId), (snap) => {
                        user.lastMsg = snap.exists() ? snap.data().lastMessageText : "No messages";
                        user.timestamp = snap.exists() ? snap.data().timestamp?.toMillis() : 0;
                        user.unread = snap.exists() && snap.data().lastMessageSender !== myUsername && !snap.data().isRead;
                        renderList(userList);
                    });
                });
            });
        }

        function renderList(userList) {
            const list = document.getElementById("global-users-chat-list");
            list.innerHTML = "";
            
            // SORTING LOGIC: Latest at top
            userList.sort((a, b) => b.timestamp - a.timestamp);
            
            // NAVBAR DOT LOGIC
            const hasUnread = userList.some(u => u.unread);
            const navDot = document.getElementById("nav-chat-indicator");
            if (navDot) navDot.style.display = hasUnread ? "block" : "none";

            userList.forEach(user => {
                const row = document.createElement("div");
                row.style.cssText = "padding: 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center;";
                row.innerHTML = `
                    <div style="position:relative">
                        <img src="${user.profilePic || 'https://picsum.photos/50'}" style="width:40px; height:40px; border-radius:50%">
                        ${user.unread ? '<div style="position:absolute; top:0; right:0; width:10px; height:10px; background:red; border-radius:50%"></div>' : ''}
                    </div>
                    <div style="margin-left:10px"><b>${user.id}</b><br><small>${user.lastMsg}</small></div>
                `;
                row.onclick = () => openChat(user.id, user.profilePic);
                list.appendChild(row);
            });
        }

        async function openChat(target, avatar) {
            document.getElementById("placeholder-box").style.display = "none";
            document.getElementById("active-chat-box").style.display = "flex";
            document.getElementById("chat-user-username").innerText = target;
            document.getElementById("chat-user-avatar").src = avatar;
            
            const roomId = [myUsername, target].sort().join("_chat_room_");
            await setDoc(doc(db, "chats", roomId), { isRead: true }, { merge: true });
            
            // Message listener code... (reuse previous)
        }

        async function sendMessageLogic() { /* As before */ }
    </script>
</body>
</html>
