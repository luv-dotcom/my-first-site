<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, doc, collection, addDoc, setDoc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
        authDomain: "insta-clone-863ae.firebaseapp.com",
        projectId: "insta-clone-863ae",
        storageBucket: "insta-clone-863ae.firebasestorage.app",
        messagingSenderId: "599343109250",
        appId: "1:599343109250:web:1306ec63908ba21c54509b"
    };
    const db = getFirestore(initializeApp(firebaseConfig));

    let myUsername = localStorage.getItem("active_user");
    if (!myUsername) { 
        // Agar localstorage me nahi hai toh safer fallback test name de do crash se bachne ke liye
        myUsername = "test_user"; 
        localStorage.setItem("active_user", "test_user");
    }
    document.getElementById("nav-my-username").innerText = myUsername;

    let selectedTargetUser = null;
    let unsubscribeMessages = null;

    const usersListElement = document.getElementById("global-users-chat-list");
    const placeholderBox = document.getElementById("placeholder-box");
    const activeChatBox = document.getElementById("active-chat-box");
    const chatWindow = document.getElementById("chat-main-window");
    const messagesContainer = document.getElementById("chat-messages-container");
    const textInput = document.getElementById("message-text-input");
    const sendBtn = document.getElementById("send-btn");

    textInput.addEventListener("input", (e) => {
        sendBtn.disabled = e.target.value.trim() === "";
    });

    // 1. Live Listen Users
    function listenToInbox() {
        onSnapshot(collection(db, "users"), (usersSnapshot) => {
            usersListElement.innerHTML = "";
            let overallUnreadForNavbar = false;

            usersSnapshot.forEach((userDoc) => {
                const uData = userDoc.data();
                const uName = uData.username || userDoc.id;

                if (uName !== myUsername) {
                    const avatar = uData.profilePic || "https://picsum.photos/150/150?random=99";
                    const chatRoomId = [myUsername, uName].sort().join("_chat_room_");
                    
                    const row = document.createElement("div");
                    row.className = `user-chat-row ${selectedTargetUser === uName ? 'active' : ''}`;
                    row.setAttribute("data-username", uName);
                    
                    row.innerHTML = `
                        <div style="position: relative;">
                            <img src="${avatar}" alt="user" class="chat-avatar-img" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">
                            <div class="profile-red-dot" id="dot-avatar-${uName}" style="position: absolute; top: 0; right: 0; width: 12px; height: 12px; background-color: #ed4956; border-radius: 50%; border: 2px solid white; display: none;"></div>
                        </div>
                        <div class="chat-row-meta" style="flex: 1; display: flex; flex-direction: column; margin-left: 12px;">
                            <span class="chat-row-name" style="font-weight:600; font-size:14px;">${uName}</span>
                            <span class="chat-row-last-msg" id="last-msg-${uName}" style="font-size: 13px; color: #8e8e8e; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No messages yet</span>
                        </div>
                        <div class="sidebar-status-dot" id="status-dot-${uName}" style="width: 8px; height: 8px; background-color: #0095f6; border-radius: 50%; display: none;"></div>
                    `;

                    row.addEventListener("click", () => openChatWithUser(uName, avatar, row));
                    usersListElement.appendChild(row);

                    // Safe realtime room monitoring
                    onSnapshot(doc(db, "chats", chatRoomId), (roomSnap) => {
                        try {
                            const lastMsgTextSpan = document.getElementById(`last-msg-${uName}`);
                            const profileDot = document.getElementById(`dot-avatar-${uName}`);
                            const statusDot = document.getElementById(`status-dot-${uName}`);

                            if (roomSnap.exists() && lastMsgTextSpan) {
                                const roomData = roomSnap.data();
                                
                                if (roomData.lastMessageText) {
                                    lastMsgTextSpan.innerText = roomData.lastMessageText;
                                }

                                if (roomData.lastMessageSender !== myUsername && roomData.isRead === false) {
                                    lastMsgTextSpan.style.fontWeight = "700";
                                    lastMsgTextSpan.style.color = "#262626";
                                    if(profileDot) profileDot.style.display = "block";
                                    if(statusDot) statusDot.style.display = "block";
                                    overallUnreadForNavbar = true;
                                } else {
                                    lastMsgTextSpan.style.fontWeight = "400";
                                    lastMsgTextSpan.style.color = "#8e8e8e";
                                    if(profileDot) profileDot.style.display = "none";
                                    if(statusDot) statusDot.style.display = "none";
                                }
                            }
                        } catch (err) { console.log("Silent room updates error handler"); }
                        updateNavbarChatIconStatus(overallUnreadForNavbar);
                    });
                }
            });
        }, (error) => {
            console.error("Firestore snapshot error handled layout reset:", error);
        });
    }

    function updateNavbarChatIconStatus(hasUnread) {
        const topNavBackIcon = document.querySelector(".back-home i");
        if (topNavBackIcon) {
            topNavBackIcon.style.color = hasUnread ? "#ed4956" : "var(--text-main)";
        }
    }

    // 2. Open Chat Room (Ekdam Safe Tarika bina crash hone wala)
    async function openChatWithUser(targetUser, avatarUrl, rowElement) {
        selectedTargetUser = targetUser;

        document.querySelectorAll(".user-chat-row").forEach(r => r.classList.remove("active"));
        rowElement.classList.add("active");

        placeholderBox.style.display = "none";
        activeChatBox.style.display = "flex";
        chatWindow.classList.add("open");

        document.getElementById("chat-user-avatar").src = avatarUrl;
        document.getElementById("chat-user-username").innerText = targetUser;

        const chatRoomId = [myUsername, targetUser].sort().join("_chat_room_");

        // UI ko turant reset kar do bina database response ka wait kiye (Taaki screen crash na dikhe)
        const profileDot = document.getElementById(`dot-avatar-${targetUser}`);
        const statusDot = document.getElementById(`status-dot-${targetUser}`);
        const lastMsgTextSpan = document.getElementById(`last-msg-${targetUser}`);
        if(profileDot) profileDot.style.display = "none";
        if(statusDot) statusDot.style.display = "none";
        if(lastMsgTextSpan) { lastMsgTextSpan.style.fontWeight = "400"; lastMsgTextSpan.style.color = "#8e8e8e"; }

        // Background me chupchaap Firestore state read update karega, fail hua toh bhi UI chalega
        try {
            const roomRef = doc(db, "chats", chatRoomId);
            await setDoc(roomRef, { isRead: true }, { merge: true });
        } catch (e) {
            console.warn("Database rules blocked active update, falling back gracefully.");
        }

        listenToMessages(targetUser);
    }

    // 3. Listen to messages inside room
    function listenToMessages(targetUser) {
        if (unsubscribeMessages) unsubscribeMessages();

        const chatRoomId = [myUsername, targetUser].sort().join("_chat_room_");
        const q = query(collection(db, "chats", chatRoomId, "messages"), orderBy("timestamp", "asc"));
        
        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            messagesContainer.innerHTML = "";
            snapshot.forEach((msgDoc) => {
                const mData = msgDoc.data();
                const bubble = document.createElement("div");
                bubble.className = (mData.sender === myUsername) ? "msg-bubble sent" : "msg-bubble received";
                bubble.innerText = mData.text;
                messagesContainer.appendChild(bubble);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, (err) => {
            console.error("Messages loader error handled safely");
        });
    }

    // 4. Send Message
    sendBtn.addEventListener("click", async () => {
        const msgText = textInput.value.trim();
        if (!msgText || !selectedTargetUser) return;

        textInput.value = "";
        sendBtn.disabled = true;

        const chatRoomId = [myUsername, selectedTargetUser].sort().join("_chat_room_");
        const roomRef = doc(db, "chats", chatRoomId);

        try {
            await addDoc(collection(db, "chats", chatRoomId, "messages"), {
                sender: myUsername,
                receiver: selectedTargetUser,
                text: msgText,
                timestamp: new Date()
            });

            await setDoc(roomRef, {
                lastMessageText: msgText,
                lastMessageSender: myUsername,
                isRead: false, 
                timestamp: new Date()
            }, { merge: true });

        } catch (err) {
            console.error("Error sending message: ", err);
        }
    });

    document.getElementById("mobile-back-arrow").addEventListener("click", () => {
        chatWindow.classList.remove("open");
    });

    // Start App
    listenToInbox();
</script>
