<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Instagram Messages</title>
<style>
:root{--bg-main:#121212;--text-main:#fff;--text-muted:#a8a8a8;--border-color:#262626;--sidebar-bg:#1a1a1a;--chat-bg:#121212;--bubble-sent:#0095f6;--bubble-received:#262626;--danger:#ed4956}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg-main);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit}button{cursor:pointer}
#messages-page-wrapper{width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-main)}
.top-chat-nav{height:60px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--sidebar-bg);flex-shrink:0}
.home-link{text-decoration:none;color:white;font-weight:700;display:flex;align-items:center;gap:8px;position:relative}
#nav-chat-indicator{width:10px;height:10px;background:var(--danger);border-radius:50%;display:none;position:absolute;top:-2px;right:-12px;border:2px solid var(--sidebar-bg)}
#main-layout-container{display:flex;flex:1;min-height:0;overflow:hidden;position:relative;width:100%}
#chat-sidebar{width:360px;border-right:1px solid var(--border-color);display:flex;flex-direction:column;background:var(--sidebar-bg);flex-shrink:0;min-height:0}
.sidebar-title-row{padding:18px 20px 12px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--border-color);flex-shrink:0}
.sidebar-title-row h2{font-size:22px;font-weight:750}
.chat-search-box{width:100%;height:38px;border:1px solid transparent;border-radius:10px;background:#262626;color:white;outline:none;padding:0 13px;font-size:14px}
.chat-search-box:focus{border-color:#3a3a3a}
#global-users-chat-list{flex:1;min-height:0;overflow-y:auto;padding:8px 0}
.user-chat-row{display:flex;align-items:center;padding:12px 20px;cursor:pointer;width:100%;transition:.2s}
.user-chat-row:hover,.user-chat-row.selected{background:#262626}
.user-avatar-wrap{position:relative;flex-shrink:0}
.user-avatar-wrap img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#262626}
.unread-dot{position:absolute;top:0;right:0;width:12px;height:12px;background:var(--danger);border-radius:50%;border:2px solid var(--sidebar-bg)}
.user-row-text{margin-left:12px;display:flex;flex-direction:column;text-align:left;overflow:hidden;flex:1;gap:3px}
.user-row-name{font-weight:650;font-size:14px;color:white}
.user-row-last{font-size:13px;color:var(--text-muted);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat-main-window{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--chat-bg)}
#placeholder-box{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--text-muted);text-align:center;gap:8px;padding:30px}
#placeholder-box h2{color:white;font-size:22px}
#active-chat-box{flex:1;min-height:0;display:none;flex-direction:column;width:100%;overflow:hidden;background:var(--chat-bg)}
.active-chat-header{padding:10px 15px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;background:var(--sidebar-bg);flex-shrink:0;height:60px;width:100%}
#chat-back-btn{background:none;border:none;color:#0095f6;font-size:15px;font-weight:700;margin-right:12px;display:none;align-items:center;gap:4px;padding:8px 4px;flex-shrink:0}
#chat-user-avatar{width:40px;height:40px;border-radius:50%;margin-right:10px;object-fit:cover;flex-shrink:0;cursor:pointer;background:#262626}
.chat-user-meta{display:flex;flex-direction:column;min-width:0;cursor:pointer}
#chat-user-username{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-status{font-size:12px;color:var(--text-muted)}
#chat-messages-container{flex:1;min-height:0;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;width:100%;scroll-behavior:smooth}
.empty-chat-note{margin:auto;color:var(--text-muted);text-align:center;font-size:14px;max-width:260px;line-height:1.4}
.msg-bubble{margin:4px 0;padding:10px 15px;border-radius:20px;max-width:min(75%,460px);word-wrap:break-word;overflow-wrap:anywhere;font-size:14px;line-height:1.4;white-space:pre-wrap}
.msg-bubble.sent{background:var(--bubble-sent);color:white;align-self:flex-end;border-bottom-right-radius:6px;margin-left:auto}
.msg-bubble.received{background:var(--bubble-received);color:white;align-self:flex-start;border-bottom-left-radius:6px}
.msg-time{display:block;opacity:.75;font-size:10px;margin-top:4px;text-align:right}
.message-status{align-self:flex-end;margin:-2px 4px 6px auto;color:var(--text-muted);font-size:11px;line-height:1.2}
.shared-card{width:min(280px,82vw);border-radius:16px;overflow:hidden;background:#1f1f1f;border:1px solid #343434;margin:4px 0;display:flex;flex-direction:column}
.shared-card.sent{align-self:flex-end;margin-left:auto}.shared-card.received{align-self:flex-start}
.shared-card-media{width:100%;aspect-ratio:4/5;background:#080808;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-size:13px}
.shared-card-media img,.shared-card-media video{width:100%;height:100%;object-fit:cover;display:block}
.shared-card-body{padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.shared-card-type{color:var(--text-muted);font-size:11px;text-transform:uppercase;font-weight:800}
.shared-card-title{font-size:14px;font-weight:750;color:white;line-height:1.25}
.shared-card-caption{font-size:12px;color:var(--text-muted);line-height:1.35;overflow-wrap:anywhere}
.shared-card-btn{margin-top:3px;border:none;background:#0095f6;color:white;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:750;cursor:pointer}
.shared-card .msg-time{padding:0 12px 10px;color:var(--text-muted)}
.mobile-typer-container{width:100%;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--border-color);background:var(--sidebar-bg);align-items:center;flex-shrink:0;z-index:10}
.quick-action-btn{width:38px;height:38px;border-radius:50%;border:none;background:#262626;color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
#message-text-input{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--border-color);border-radius:24px;outline:none;font-size:16px;background:#262626;color:white}
#message-text-input:focus{border-color:#4a4a4a}
#send-btn{background:none;border:none;color:#0095f6;font-weight:700;padding:0 4px;font-size:16px;flex-shrink:0}
#send-btn:disabled{color:#4d87ad;cursor:default}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,.92);color:#000;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s ease;z-index:12000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:768px){.top-chat-nav{height:54px;padding:0 14px}#chat-sidebar{width:100%;max-width:100%;display:flex;border-right:none}#chat-main-window{display:none;width:100%}#main-layout-container.mobile-chat-active #chat-sidebar{display:none}#main-layout-container.mobile-chat-active #chat-main-window{display:flex;position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:9999;background:var(--chat-bg)}#main-layout-container.mobile-chat-active #active-chat-box{height:100%;height:100dvh}#chat-back-btn{display:flex}.active-chat-header{height:56px;padding:8px 12px}#chat-messages-container{padding:12px 10px}.msg-bubble{max-width:82%;font-size:14px}.mobile-typer-container{padding:9px 10px calc(9px + env(safe-area-inset-bottom));gap:8px}.quick-action-btn{width:36px;height:36px}#message-text-input{height:42px;padding:10px 14px}}
</style>
</head>

<body>
<div id="messages-page-wrapper">
    <div class="top-chat-nav">
        <a href="home.html" class="home-link">
            <span>&larr; Home</span>
            <div id="nav-chat-indicator"></div>
        </a>
        <div style="font-size:16px;font-weight:650;" id="nav-my-username">Loading...</div>
        <div style="width:50px;"></div>
    </div>

    <div id="main-layout-container">
        <div id="chat-sidebar">
            <div class="sidebar-title-row">
                <h2>Messages</h2>
                <input type="text" id="chat-search-input" class="chat-search-box" placeholder="Search">
            </div>
            <div id="global-users-chat-list"></div>
        </div>

        <div id="chat-main-window">
            <div id="placeholder-box">
                <h2>Your Messages</h2>
                <p>Select a user to start chatting.</p>
            </div>

            <div id="active-chat-box">
                <div class="active-chat-header">
                    <button id="chat-back-btn">&larr; Chats</button>
                    <img id="chat-user-avatar" src="" alt="User">
                    <div class="chat-user-meta">
                        <span id="chat-user-username">Username</span>
                        <span class="active-status">Active now</span>
                    </div>
                </div>

                <div id="chat-messages-container"></div>

                <div class="mobile-typer-container">
                    <button class="quick-action-btn" type="button" id="camera-btn">+</button>
                    <input type="text" id="message-text-input" placeholder="Message..." autocomplete="off">
                    <button id="send-btn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="chat-toast">Done</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, collection, addDoc, setDoc, updateDoc, onSnapshot, query, orderBy, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b"
};

const db = getFirestore(initializeApp(firebaseConfig));

let myUsername = localStorage.getItem("active_user") || "Guest_User";
let selectedTargetUser = null;
let selectedTargetAvatar = "";
let unsubscribeMessages = null;
let unsubscribeUsers = null;
let activeRoomListeners = {};
let latestUsersList = [];
let pendingSharedPayload = null;

const safeGet = (id) => document.getElementById(id);

window.addEventListener("DOMContentLoaded", () => {
    safeGet("nav-my-username").innerText = myUsername;

    setupPendingShareFromUrl();

    const textInput = safeGet("message-text-input");
    const sendBtn = safeGet("send-btn");
    const searchInput = safeGet("chat-search-input");

    textInput.addEventListener("input", () => {
        sendBtn.disabled = textInput.value.trim() === "";
    });

    textInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !sendBtn.disabled) {
            e.preventDefault();
            sendMessageLogic();
        }
    });

    sendBtn.addEventListener("click", sendMessageLogic);
    safeGet("chat-back-btn").addEventListener("click", closeMobileChat);

    safeGet("camera-btn").addEventListener("click", () => {
        showToast("Photo, reel, post share support ready");
    });

    searchInput.addEventListener("input", () => renderList(latestUsersList));

    safeGet("chat-user-avatar").addEventListener("click", openSelectedProfile);
    safeGet("chat-user-username").addEventListener("click", openSelectedProfile);

    window.addEventListener("resize", scrollMessagesToBottom);

    listenToInbox();
});

function setupPendingShareFromUrl() {
    pendingSharedPayload = getPendingSharedPayloadFromUrl();
    if (pendingSharedPayload) showToast("Select a user to share");
}

function getPendingSharedPayloadFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const shareType = params.get("shareType");
    if (!shareType) return null;

    return {
        type: shareType,
        text: params.get("text") || getLastMessageLabel(shareType),
        reelId: params.get("reelId") || "",
        postId: params.get("postId") || "",
        storyId: params.get("storyId") || "",
        reelUrl: params.get("reelUrl") || "",
        postUrl: params.get("postUrl") || "",
        storyUrl: params.get("storyUrl") || "",
        thumbnailUrl: params.get("thumbnailUrl") || "",
        imageUrl: params.get("imageUrl") || "",
        title: params.get("title") || getLastMessageLabel(shareType),
        caption: params.get("caption") || "",
        storyUser: params.get("storyUser") || "",
        link: params.get("link") || ""
    };
}

function listenToInbox() {
    if (unsubscribeUsers) unsubscribeUsers();

    unsubscribeUsers = onSnapshot(collection(db, "users"), (usersSnapshot) => {
        latestUsersList = [];

        usersSnapshot.forEach((u) => {
            const uData = u.data();
            const uName = uData.username || u.id;

            if (uName !== myUsername) {
                latestUsersList.push({
                    id: uName,
                    profilePic: uData.profilePic || "https://picsum.photos/150/150?random=99",
                    timestamp: 0,
                    lastMsg: "No messages yet",
                    lastType: "text",
                    unread: false
                });
            }
        });

        latestUsersList.forEach((user) => {
            const roomId = [myUsername, user.id].sort().join("_chat_room_");

            if (activeRoomListeners[roomId]) activeRoomListeners[roomId]();

            activeRoomListeners[roomId] = onSnapshot(doc(db, "chats", roomId), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    const readBy = Array.isArray(data.readBy) ? data.readBy : [];
                    const fromOther = data.lastMessageSender && data.lastMessageSender !== myUsername;

                    user.lastType = data.lastMessageType || "text";
                    user.lastMsg = data.lastMessageText || getLastMessageLabel(user.lastType);
                    user.timestamp = data.timestamp && data.timestamp.toMillis ? data.timestamp.toMillis() : 0;
                    user.unread = fromOther && (data.isRead === false || !readBy.includes(myUsername));
                }

                renderList(latestUsersList);
            });
        });

        renderList(latestUsersList);

        const params = new URLSearchParams(window.location.search);
        const directUser = params.get("username") || params.get("user") || params.get("id");

        if (directUser) {
            const found = latestUsersList.find((u) => u.id === directUser);
            if (found && selectedTargetUser !== directUser) openChat(found.id, found.profilePic);
        }
    });
}

function renderList(userList) {
    const list = safeGet("global-users-chat-list");
    const searchValue = safeGet("chat-search-input").value.trim().toLowerCase();

    const filteredUsers = userList
        .filter((user) => user.id.toLowerCase().includes(searchValue))
        .sort((a, b) => b.timestamp - a.timestamp);

    const hasUnread = userList.some((u) => u.unread);
    safeGet("nav-chat-indicator").style.display = hasUnread ? "block" : "none";

    list.innerHTML = "";

    if (filteredUsers.length === 0) {
        list.innerHTML = `<div style="padding:24px 20px;color:var(--text-muted);font-size:14px;">No users found</div>`;
        return;
    }

    filteredUsers.forEach((user) => {
        const isSelected = selectedTargetUser === user.id;
        const row = document.createElement("div");

        row.className = `user-chat-row ${isSelected ? "selected" : ""}`;
        row.innerHTML = `
            <div class="user-avatar-wrap">
                <img src="${escapeAttr(user.profilePic)}" alt="${escapeAttr(user.id)}">
                <div class="unread-dot" style="display:${user.unread ? "block" : "none"}"></div>
            </div>
            <div class="user-row-text">
                <span class="user-row-name">${escapeHtml(user.id)}</span>
                <span class="user-row-last" style="color:${user.unread ? "#ffffff" : "var(--text-muted)"};font-weight:${user.unread ? "700" : "400"};">
                    ${escapeHtml(user.lastMsg)}
                </span>
            </div>
        `;

        row.addEventListener("click", () => openChat(user.id, user.profilePic));
        list.appendChild(row);
    });
}

async function openChat(target, avatar) {
    selectedTargetUser = target;
    selectedTargetAvatar = avatar || "https://picsum.photos/150/150?random=99";

    safeGet("main-layout-container").classList.add("mobile-chat-active");
    safeGet("placeholder-box").style.display = "none";
    safeGet("active-chat-box").style.display = "flex";
    safeGet("chat-user-username").innerText = target;
    safeGet("chat-user-avatar").src = selectedTargetAvatar;

    renderList(latestUsersList);

    const roomId = [myUsername, target].sort().join("_chat_room_");

    try {
        await setDoc(doc(db, "chats", roomId), {
            isRead: true,
            readBy: arrayUnion(myUsername)
        }, { merge: true });
    } catch (e) {
        console.error("Read update failed:", e);
    }

    listenToMessages(target);

    setTimeout(() => {
        safeGet("message-text-input").focus();
        scrollMessagesToBottom();
    }, 250);

    if (pendingSharedPayload) {
        const confirmShare = confirm(`Share this ${pendingSharedPayload.type} with ${target}?`);

        if (confirmShare) {
            await sendMessageToUser(target, pendingSharedPayload);
            showToast("Shared");
            pendingSharedPayload = null;
            window.history.replaceState({}, "", window.location.pathname);
        }
    }
}

function closeMobileChat() {
    selectedTargetUser = null;
    safeGet("main-layout-container").classList.remove("mobile-chat-active");
    safeGet("placeholder-box").style.display = "flex";
    safeGet("active-chat-box").style.display = "none";
    safeGet("message-text-input").value = "";
    safeGet("send-btn").disabled = true;
    renderList(latestUsersList);

    if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
    }
}

function listenToMessages(targetUser) {
    if (unsubscribeMessages) unsubscribeMessages();

    const chatRoomId = [myUsername, targetUser].sort().join("_chat_room_");
    const q = query(collection(db, "chats", chatRoomId, "messages"), orderBy("timestamp", "asc"));

    unsubscribeMessages = onSnapshot(q, async (snapshot) => {
        const container = safeGet("chat-messages-container");
        container.innerHTML = "";

        if (snapshot.empty) {
            container.innerHTML = `<div class="empty-chat-note">No messages yet. Send a message to start the conversation.</div>`;
            return;
        }

        const seenUpdates = [];

        snapshot.forEach((msgDoc) => {
            const mData = msgDoc.data();
            const messageType = mData.type || "text";
            const isSent = mData.sender === myUsername;

            if (!isSent && mData.receiver === myUsername) {
                const seenBy = Array.isArray(mData.seenBy) ? mData.seenBy : [];
                if (!seenBy.includes(myUsername)) {
                    seenUpdates.push(updateDoc(msgDoc.ref, {
                        seenBy: arrayUnion(myUsername),
                        seenAt: new Date(),
                        status: "seen"
                    }));
                }
            }

            if (messageType === "reel" || messageType === "post" || messageType === "story") {
                container.appendChild(createSharedCard(mData, isSent));
            } else {
                container.appendChild(createTextBubble(mData, isSent));
            }

            if (isSent) {
                container.appendChild(createMessageStatus(mData));
            }
        });

        if (seenUpdates.length) {
            Promise.all(seenUpdates).catch((err) => console.error("Seen update failed:", err));
            try {
                await setDoc(doc(db, "chats", chatRoomId), {
                    isRead: true,
                    readBy: arrayUnion(myUsername)
                }, { merge: true });
            } catch (err) {
                console.error("Room seen update failed:", err);
            }
        }

        scrollMessagesToBottom();
    });
}

function createTextBubble(mData, isSent) {
    const bubble = document.createElement("div");
    bubble.className = isSent ? "msg-bubble sent" : "msg-bubble received";
    bubble.innerHTML = `
        ${escapeHtml(mData.text || "")}
        <span class="msg-time">${formatMessageTime(mData.timestamp)}</span>
    `;
    return bubble;
}

function createMessageStatus(mData) {
    const status = document.createElement("div");
    status.className = "message-status";

    const seenBy = Array.isArray(mData.seenBy) ? mData.seenBy : [];
    const receiver = mData.receiver || selectedTargetUser;

    if (receiver && seenBy.includes(receiver)) {
        status.innerText = `Seen ${formatSeenAgo(mData.seenAt)}`;
    } else {
        status.innerText = "Sent";
    }

    return status;
}

function createSharedCard(mData, isSent) {
    const card = document.createElement("div");
    const type = mData.type || "post";
    const title = mData.title || getLastMessageLabel(type);
    const caption = mData.caption || mData.text || "";
    const mediaUrl = mData.thumbnailUrl || mData.imageUrl || mData.reelUrl || mData.postUrl || mData.storyUrl || "";
    const targetUrl = getSharedTargetUrl(mData);

    card.className = `shared-card ${isSent ? "sent" : "received"}`;

    const isVideo = type === "reel" || String(mediaUrl).includes(".mp4") || String(mediaUrl).includes("video");

    card.innerHTML = `
        <div class="shared-card-media">
            ${
                mediaUrl
                    ? isVideo
                        ? `<video src="${escapeAttr(mediaUrl)}" muted playsinline></video>`
                        : `<img src="${escapeAttr(mediaUrl)}" alt="${escapeAttr(title)}">`
                    : `<span>No preview</span>`
            }
        </div>
        <div class="shared-card-body">
            <div class="shared-card-type">${escapeHtml(type)}</div>
            <div class="shared-card-title">${escapeHtml(title)}</div>
            <div class="shared-card-caption">${escapeHtml(caption)}</div>
            <button class="shared-card-btn" type="button">${escapeHtml(getOpenButtonText(type))}</button>
        </div>
        <span class="msg-time">${formatMessageTime(mData.timestamp)}</span>
    `;

    card.querySelector(".shared-card-btn").addEventListener("click", () => {
        if (targetUrl) window.location.href = targetUrl;
        else showToast("Link not available");
    });

    return card;
}

async function sendMessageLogic() {
    const textInput = safeGet("message-text-input");
    const sendBtn = safeGet("send-btn");

    if (!selectedTargetUser) return;

    const msgText = textInput.value.trim();
    if (!msgText) return;

    textInput.value = "";
    sendBtn.disabled = true;

    await sendMessageToUser(selectedTargetUser, {
        type: "text",
        text: msgText
    });

    setTimeout(() => {
        textInput.focus();
        scrollMessagesToBottom();
    }, 100);
}

async function sendMessageToUser(targetUser, payload) {
    const chatRoomId = [myUsername, targetUser].sort().join("_chat_room_");
    const messageType = payload.type || "text";
    const lastMessageText = payload.text || getLastMessageLabel(messageType);

    try {
        await addDoc(collection(db, "chats", chatRoomId, "messages"), {
            sender: myUsername,
            receiver: targetUser,
            type: messageType,
            text: lastMessageText,
            status: "sent",
            deliveredAt: new Date(),
            seenBy: [myUsername],
            seenAt: null,
            reelId: payload.reelId || "",
            postId: payload.postId || "",
            storyId: payload.storyId || "",
            reelUrl: payload.reelUrl || "",
            postUrl: payload.postUrl || "",
            storyUrl: payload.storyUrl || "",
            thumbnailUrl: payload.thumbnailUrl || "",
            imageUrl: payload.imageUrl || "",
            title: payload.title || "",
            caption: payload.caption || "",
            storyUser: payload.storyUser || "",
            link: payload.link || "",
            timestamp: new Date()
        });

        await setDoc(doc(db, "chats", chatRoomId), {
            lastMessageText,
            lastMessageType: messageType,
            lastMessageSender: myUsername,
            isRead: false,
            readBy: [myUsername],
            timestamp: new Date()
        }, { merge: true });
    } catch (err) {
        console.error("Message send failed:", err);
        alert("Message send nahi hua. Internet/Firebase rules check karo.");
        safeGet("message-text-input").value = payload.text || "";
        safeGet("send-btn").disabled = false;
    }
}

window.sendSharedMessageToUser = sendMessageToUser;

function getLastMessageLabel(type) {
    if (type === "reel") return "Shared a reel";
    if (type === "post") return "Shared a post";
    if (type === "story") return "Shared a story";
    return "No messages yet";
}

function getOpenButtonText(type) {
    if (type === "reel") return "View reel";
    if (type === "post") return "View post";
    if (type === "story") return "View story";
    return "Open";
}

function getSharedTargetUrl(data) {
    if (data.type === "reel" && data.reelId) return `reels.html?reel=${encodeURIComponent(data.reelId)}`;
    if (data.type === "post" && data.postId) return `post-view.html?post=${encodeURIComponent(data.postId)}`;
    if (data.type === "story") {
        if (data.storyUser) return `story-view.html?mode=view&user=${encodeURIComponent(data.storyUser)}`;
        if (data.sender) return `story-view.html?mode=view&user=${encodeURIComponent(data.sender)}`;
    }
    return data.link || "";
}

function openSelectedProfile() {
    if (!selectedTargetUser) return;
    window.location.href = `user-profile.html?username=${encodeURIComponent(selectedTargetUser)}`;
}

function scrollMessagesToBottom() {
    const container = safeGet("chat-messages-container");
    if (!container) return;

    requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
    });
}

function formatMessageTime(timestamp) {
    try {
        const date = timestamp && timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
        return "";
    }
}

function formatSeenAgo(timestamp) {
    try {
        if (!timestamp) return "";
        const date = timestamp && timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));

        if (seconds < 10) return "just now";
        if (seconds < 60) return `${seconds}s ago`;

        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;

        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;

        const days = Math.floor(hours / 24);
        return `${days}d ago`;
    } catch (e) {
        return "";
    }
}

function showToast(text) {
    const toast = safeGet("chat-toast");
    toast.innerText = text;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1500);
}

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value);
}
</script>
