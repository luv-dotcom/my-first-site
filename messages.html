<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram DM Clone</title>
    <style>
        :root {
            --bg-main: #121212;
            --text-main: #ffffff;
            --border-color: #262626;
            --sidebar-bg: #1a1a1a;
            --chat-bg: #121212;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .user-chat-row {
            transition: background 0.2s;
        }
        .user-chat-row:hover {
            background-color: #262626 !important;
        }
        .msg-bubble {
            margin: 4px 0;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 60%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-bubble.sent {
            background-color: #0095f6;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }
        .msg-bubble.received {
            background-color: #262626;
            color: white;
            align-self: flex-start;
        }

        /* Responsive Mobile Layout rules */
        @media (max-width: 768px) {
            #chat-sidebar {
                width: 100% !important;
                max-width: 100% !important;
            }
            #chat-main-window {
                display: none !important;
            }
            /* Jab active chat mode on hoga tab mobile par switch hoga */
            .hide-sidebar #chat-sidebar {
                display: none !important;
            }
            .hide-sidebar #chat-main-window {
                display: flex !important;
            }
            #chat-back-btn {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div id="messages-page-wrapper" style="display: flex; height: 100vh; width: 100vw; flex-direction: column;">
        
        <div style="height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: var(--sidebar-bg);">
            <a href="home.html" style="text-decoration: none; color: white; font-weight: bold; display: flex; align-items: center; gap: 8px; position: relative;">
                <span>⬅️ Home</span>
                <div id="nav-chat-indicator" style="width: 10px; height: 10px; background-color: #ed4956; border-radius: 50%; display: none; position: absolute; top: -2px; right: -12px; border: 2px solid var(--sidebar-bg);"></div>
            </a>
            <div style="font-size: 16px; font-weight: 600;" id="nav-my-username">Loading...</div>
            <div style="width: 50px;"></div>
        </div>

        <div id="main-layout-container" style="display: flex; flex: 1; overflow: hidden;">
            
            <div id="chat-sidebar" style="width: 350px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: var(--sidebar-bg); flex-shrink: 0;">
                <div id="global-users-chat-list" style="flex: 1; overflow-y: auto;">
                    </div>
            </div>

            <div id="chat-main-window" style="flex: 1; display: flex; flex-direction: column; background: var(--chat-bg);">
                
                <div id="placeholder-box" style="flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #8e8e8e;">
                    <h2>Your Messages</h2>
                    <p>Select a user to start chatting.</p>
                </div>
                
                <div id="active-chat-box" style="flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden;">
                    
                    <div style="padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; background: var(--sidebar-bg);">
                        <button id="chat-back-btn" style="background: none; border: none; color: #0095f6; font-size: 16px; font-weight: bold; cursor: pointer; margin-right: 15px; display: none; align-items: center; gap: 4px; padding: 5px 0;">
                            ⬅️ Users
                        </button>
                        
                        <img id="chat-user-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; object-fit: cover;">
                        <span id="chat-user-username" style="font-weight: 600;">Username</span>
                    </div>
                    
                    <div id="chat-messages-container" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;">
                        </div>
                    
                    <div style="padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border-color); background: var(--sidebar-bg); align-items: center;">
                        <input type="text" id="message-text-input" placeholder="Message..." style="flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 24px; outline: none; font-size: 14px; background: #262626; color: white;">
                        <button id="send-btn" disabled style="background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; padding: 0 10px; font-size: 14px;">Send</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, collection, addDoc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        
        const db = getFirestore(initializeApp(firebaseConfig));
        let myUsername = localStorage.getItem("active_user") || "Guest_User";
        let selectedTargetUser = null;
        let unsubscribeMessages = null;
        let activeRoomListeners = {}; 

        const safeGet = (id) => document.getElementById(id);

        window.addEventListener("DOMContentLoaded", () => {
            try {
                if (safeGet("nav-my-username")) {
                    safeGet("nav-my-username").innerText = myUsername;
                }

                const textInput = safeGet("message-text-input");
                const sendBtn = safeGet("send-btn");
                if (textInput && sendBtn) {
                    textInput.addEventListener("input", (e) => {
                        sendBtn.disabled = e.target.value.trim() === "";
                    });
                    textInput.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" && !sendBtn.disabled) {
                            sendMessageLogic();
                        }
                    });
                    sendBtn.addEventListener("click", sendMessageLogic);
                }

                // Back Button Click Logic
                const backBtn = safeGet("chat-back-btn");
                if (backBtn) {
                    backBtn.addEventListener("click", () => {
                        selectedTargetUser = null;
                        const layout = safeGet("main-layout-container");
                        if (layout) layout.classList.remove("hide-sidebar");
                        if (safeGet("placeholder-box")) safeGet("placeholder-box").style.display = "flex";
                        if (safeGet("active-chat-box")) safeGet("active-chat-box").style.display = "none";
                    });
                }

                listenToInbox();
            } catch (domErr) {
                console.error("Initialization error:", domErr);
            }
        });

        function listenToInbox() {
            onSnapshot(collection(db, "users"), (usersSnapshot) => {
                let userList = [];
                usersSnapshot.forEach(u => {
                    const uData = u.data();
                    const uName = uData.username || u.id;
                    if (uName !== myUsername) {
                        userList.push({ id: uName, profilePic: uData.profilePic, timestamp: 0, lastMsg: "No messages yet", unread: false });
                    }
                });

                userList.forEach(user => {
                    const roomId = [myUsername, user.id].sort().join("_chat_room_");
                    if (activeRoomListeners[roomId]) activeRoomListeners[roomId]();
                    
                    activeRoomListeners[roomId] = onSnapshot(doc(db, "chats", roomId), (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            user.lastMsg = data.lastMessageText || "No messages yet";
                            user.timestamp = data.timestamp ? data.timestamp.toMillis() : 0;
                            user.unread = (data.lastMessageSender !== myUsername && data.isRead === false);
                        }
                        renderList(userList);
                    });
                });
            });
        }

        function renderList(userList) {
            const list = safeGet("global-users-chat-list");
            if (!list) return;

            userList.sort((a, b) => b.timestamp - a.timestamp);
            
            const hasUnread = userList.some(u => u.unread);
            const navDot = safeGet("nav-chat-indicator");
            if (navDot) navDot.style.display = hasUnread ? "block" : "none";

            list.innerHTML = "";
            userList.forEach(user => {
                const isSelected = selectedTargetUser === user.id;
                const row = document.createElement("div");
                row.className = "user-chat-row";
                row.style.cssText = `display:flex; align-items:center; padding:12px 20px; cursor:pointer; background-color: ${isSelected ? '#262626' : 'transparent'}`;
                row.innerHTML = `
                    <div style="position:relative; flex-shrink: 0;">
                        <img src="${user.profilePic || 'https://picsum.photos/150/150?random=99'}" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">
                        <div style="position:absolute; top:0; right:0; width:12px; height:12px; background:#ed4956; border-radius:50%; border:2px solid var(--sidebar-bg); display:${user.unread ? 'block' : 'none'}"></div>
                    </div>
                    <div style="margin-left:12px; display:flex; flex-direction:column; text-align:left; overflow:hidden;">
                        <span style="font-weight:600; font-size:14px; color: white;">${user.id}</span>
                        <span style="font-size:13px; color:${user.unread ? '#ffffff' : '#8e8e8e'}; font-weight:${user.unread ? '700' : '400'}; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.lastMsg}</span>
                    </div>
                `;
                row.onclick = () => openChat(user.id, user.profilePic);
                list.appendChild(row);
            });
        }

        async function openChat(target, avatar) {
            selectedTargetUser = target;
            
            // 🛠️ FIXED SYNTAX ERROR: added classList correctly
            const layout = safeGet("main-layout-container");
            if (layout) {
                layout.classList.add("hide-sidebar");
            }

            if(safeGet("placeholder-box")) safeGet("placeholder-box").style.display = "none";
            if(safeGet("active-chat-box")) safeGet("active-chat-box").style.display = "flex";
            if(safeGet("chat-user-username")) safeGet("chat-user-username").innerText = target;
            if(safeGet("chat-user-avatar")) safeGet("chat-user-avatar").src = avatar || "https://picsum.photos/150/150?random=99";
            
            const roomId = [myUsername, target].sort().join("_chat_room_");
            try {
                await setDoc(doc(db, "chats", roomId), { isRead: true }, { merge: true });
            } catch (e) {}
            
            listenToMessages(target);
        }

        function listenToMessages(targetUser) {
            if (unsubscribeMessages) unsubscribeMessages();
            const chatRoomId = [myUsername, targetUser].sort().join("_chat_room_");
            const q = query(collection(db, "chats", chatRoomId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = safeGet("chat-messages-container");
                if (!container) return;
                container.innerHTML = "";
                snapshot.forEach((msgDoc) => {
                    const mData = msgDoc.data();
                    const bubble = document.createElement("div");
                    bubble.className = mData.sender === myUsername ? "msg-bubble sent" : "msg-bubble received";
                    bubble.innerText = mData.text;
                    container.appendChild(bubble);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        async function sendMessageLogic() {
            const textInput = safeGet("message-text-input");
            const sendBtn = safeGet("send-btn");
            if (!textInput || !sendBtn || !selectedTargetUser) return;

            const msgText = textInput.value.trim();
            textInput.value = "";
            sendBtn.disabled = true;

            const chatRoomId = [myUsername, selectedTargetUser].sort().join("_chat_room_");
            try {
                await addDoc(collection(db, "chats", chatRoomId, "messages"), {
                    sender: myUsername,
                    receiver: selectedTargetUser,
                    text: msgText,
                    timestamp: new Date()
                });
                await setDoc(doc(db, "chats", chatRoomId), {
                    lastMessageText: msgText,
                    lastMessageSender: myUsername,
                    isRead: false, 
                    timestamp: new Date()
                }, { merge: true });
            } catch (err) {}
        }
    </script>
</body>
</html>
