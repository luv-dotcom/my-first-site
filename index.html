<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #a8a8a8;
            --card-bg: #000000;
            --link-color: #0095f6;
            --error-color: #ed4956;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 40px 30px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-text { font-family: 'Grand Hotel', cursive; font-size: 50px; margin-bottom: 30px; }
        form { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .input-box input { width: 100%; padding: 11px 8px; background: #121212; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; outline: none; color: white; }
        .input-box input:focus { border-color: #555; }
        .auth-btn { background: var(--link-color); color: white; border: none; border-radius: 4px; padding: 7px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .auth-btn:disabled { opacity: 0.6; }
        .msg-box { margin-top: 15px; font-size: 14px; color: var(--error-color); display: none; }
        .redirect-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 20px; text-align: center; font-size: 14px; }
        .redirect-card a { color: var(--link-color); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="logo-text">Instagram</h1>
            <form id="login-form" onsubmit="return false;">
                <div class="input-box">
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                <div class="input-box">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="button" class="auth-btn" id="login-btn">Log In</button>
            </form>
            <div id="error-msg" class="msg-box"></div>
        </div>

        <div class="redirect-card">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
            authDomain: "insta-clone-863ae.firebaseapp.com",
            projectId: "insta-clone-863ae",
            storageBucket: "insta-clone-863ae.firebasestorage.app",
            messagingSenderId: "599343109250",
            appId: "1:599343109250:web:1306ec63908ba21c54509b"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        document.getElementById("login-btn").addEventListener("click", async () => {
            const email = document.getElementById("login-email").value.trim().toLowerCase();
            const password = document.getElementById("login-password").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const loginBtn = document.getElementById("login-btn");

            if(!email || !password) {
                errorMsg.innerText = "Please fill in all fields.";
                errorMsg.style.display = "block";
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";
            errorMsg.style.display = "none";

            try {
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("email", "==", email), where("password", "==", password));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // User mil gaya! LocalStorage me session set karo
                    let userData = querySnapshot.docs[0].data();
                    localStorage.setItem("active_user", userData.username);
                    
                    // Seedhe Feed (home.html) par bhej do
                    window.location.href = "home.html";
                } else {
                    errorMsg.innerText = "❌ Invalid email or password!";
                    errorMsg.style.display = "block";
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Log In";
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Server error. Try again.";
                errorMsg.style.display = "block";
                loginBtn.disabled = false;
                loginBtn.innerText = "Log In";
            }
        });
    </script>
</body>
</html>
