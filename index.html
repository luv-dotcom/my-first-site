<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Account Access</title>

<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-color: #0095f6; /* Instagram Blue */
    --background-color: #fafafa;
    --card-background: #ffffff;
    --text-color: #1f2937;
    --border-color: #dbdbdb;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--background-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-card {
    background-color: var(--card-background);
    border: 1px solid var(--border-color);
    padding: 40px;
    width: 100%;
    max-width: 350px;
    border-radius: 1px; /* Instagram style */
    box-sizing: border-box;
  }

  .brand-title {
    font-family: 'Grand Hotel', cursive;
    font-size: 40px;
    color: #000;
    margin-bottom: 24px;
    text-align: center;
  }

  .form-group { margin-bottom: 10px; }

  input {
    width: 100%;
    padding: 9px 8px;
    background: #fafafa;
    border: 1px solid var(--border-color);
    border-radius: 3px;
    font-size: 12px;
    box-sizing: border-box;
  }

  input:focus { outline: none; border-color: #a8a8a8; }

  button {
    width: 100%;
    padding: 7px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .forgot, .signup-link {
    display: block;
    margin-top: 15px;
    font-size: 12px;
    text-align: center;
    color: #00376b;
    text-decoration: none;
  }
  
  .signup-box {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid var(--border-color);
      text-align: center;
      font-size: 14px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-title">Instagram</div>

  <div class="form-group">
    <input type="text" id="email" placeholder="Phone number, username, or email">
  </div>

  <div class="form-group">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button type="button" onclick="window.location.href='home.html'">Log In</button>
  
  <a class="forgot" href="#">Forgot password?</a>
</div>

<div class="login-card" style="margin-top: 10px; padding: 20px;">
    Don't have an account? <a href="#" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up</a>
</div>

</body>
</html>
