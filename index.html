<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Account Access</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  :root { --primary-color: #0095f6; --background-color: #fafafa; --card-background: #ffffff; --border-color: #dbdbdb; }
  body { margin: 0; font-family: sans-serif; background-color: var(--background-color); display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
  .login-card { background-color: var(--card-background); border: 1px solid var(--border-color); padding: 40px; width: 100%; max-width: 350px; border-radius: 1px; box-sizing: border-box; }
  .brand-title { font-family: 'Grand Hotel', cursive; font-size: 40px; margin-bottom: 24px; text-align: center; }
  .form-group { margin-bottom: 10px; }
  input { width: 100%; padding: 9px 8px; background: #fafafa; border: 1px solid var(--border-color); border-radius: 3px; box-sizing: border-box; }
  button { width: 100%; padding: 7px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-title">Instagram</div>
  <div class="form-group"><input type="email" id="email" placeholder="Email"></div>
  <div class="form-group"><input type="password" id="password" placeholder="Password"></div>
  <button id="loginBtn">Log In</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b",
    measurementId: "G-6SH8CWPWNC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login Button Logic
  document.getElementById("loginBtn").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        alert("Login Successful!");
        window.location.href = "home.html"; // Home page par bhejne ke liye
      })
      .catch((error) => {
        alert("Error: " + error.message);
      });
  });
</script>

</body>
</html>
