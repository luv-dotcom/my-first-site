<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram UI Clone</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fafafa;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-box {
    background: white;
    border: 1px solid #dbdbdb;
    padding: 40px;
    width: 300px;
    text-align: center;
  }

  .logo {
    font-family: 'Brush Script MT', cursive;
    font-size: 40px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    background: #fafafa;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #0095f6;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #007cd1;
  }

  .divider {
    margin: 15px 0;
    color: #999;
    font-size: 12px;
  }

  .footer {
    margin-top: 15px;
    font-size: 12px;
    color: #00376b;
    cursor: pointer;
  }

</style>
</head>
<body>

<div class="container">
  <div class="login-box">
    <div class="logo">Instagram</div>

    <input type="text" placeholder="Phone number, username, or email">
    <input type="password" placeholder="Password">

    <button onclick="fakeLogin()">Log In</button>

    <div class="divider">OR</div>

    <div class="footer">Forgot password?</div>
  </div>
</div>

<script>
function fakeLogin() {
  alert("This is a UI demo only. No real login happens.");
}
</script>

</body>
</html>
