<!DOCTYPE html>
<html>
<head>
    <title>Meri Design Wali Website</title>
    <style>
        /* Yeh CSS code hai jo design badalta hai */
        body {
            background-color: #1a1a1a; /* Dark background */
            color: #ffffff;            /* White text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #00ffcc;            /* Neon Green/Blue color */
            font-size: 45px;
        }
        p {
            font-size: 20px;
            color: #cccccc;
        }
        .my-button {
            background-color: #ff007f; /* Pink button */
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;       /* Round corners */
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0px 4px 15px rgba(255, 0, 127, 0.4);
        }
        .my-button:hover {
            background-color: #e60072; /* Hover karne par dark pink */
        }
    </style>
</head>
<body>

    <h1>Welcome To My Cool Site! 😎</h1>
    <p>Maine GitHub Pages par apni pehli designed website bana li hai.</p>
    
    <!-- Ek stylish button -->
    <a href="https://github.com" class="my-button">Visit GitHub</a>

</body>
</html>
