<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#fafafa}
.box{background:#fff;padding:30px;border:1px solid #ddd;text-align:center}
input{width:100%;padding:10px;margin:5px 0}
button{width:100%;padding:10px;background:#0095f6;color:#fff;border:none}
</style>
</head>

<body>
<div class="box">
  <h2>Instagram</h2>
  <input placeholder="Username">
  <input type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
function login(){
  localStorage.setItem("loggedIn","true");
  window.location.href="home.html";
}
</script>
</body>
</html>
