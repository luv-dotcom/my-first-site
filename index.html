<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

<style>
:root{
    --bg-color:#121212;
    --border-color:#262626;
    --text-main:#ffffff;
    --text-muted:#a8a8a8;
    --card-bg:#000000;
    --link-color:#0095f6;
    --error-color:#ed4956;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
    background-color:var(--bg-color);
    color:var(--text-main);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}
.auth-container{
    width:100%;
    max-width:350px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.auth-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:4px;
    padding:40px 30px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}
.logo-text{
    font-family:'Grand Hotel',cursive;
    font-size:52px;
    font-weight:400;
    margin-bottom:30px;
}
form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
}
.input-box input{
    width:100%;
    padding:11px 8px;
    background:#121212;
    border:1px solid var(--border-color);
    border-radius:4px;
    font-size:12px;
    outline:none;
    color:white;
}
.input-box input:focus{
    border-color:#555;
}
.auth-btn{
    background:var(--link-color);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}
.auth-btn:disabled{
    opacity:.6;
    cursor:default;
}
.forgot-link{
    color:#e0f1ff;
    text-decoration:none;
    font-size:12px;
    margin-top:18px;
}
.msg-box{
    margin-top:15px;
    font-size:14px;
    color:var(--error-color);
    display:none;
    line-height:1.4;
}
.redirect-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:4px;
    padding:20px;
    text-align:center;
    font-size:14px;
}
.redirect-card a{
    color:var(--link-color);
    font-weight:600;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="logo-text">Instagram</h1>

        <form id="login-form" onsubmit="return false;">
            <div class="input-box">
                <input type="text" id="login-identity" placeholder="Phone number, username, or email" autocomplete="username" required>
            </div>

            <div class="input-box">
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
            </div>

            <button type="button" class="auth-btn" id="login-btn">Log in</button>
        </form>

        <div id="error-msg" class="msg-box"></div>

        <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <div class="redirect-card">
        Don't have an account? <a href="signup.html">Sign up</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBrqMn7FrFW3jslaDNM0ui-VW4w6K_3Nmk",
    authDomain: "insta-clone-863ae.firebaseapp.com",
    projectId: "insta-clone-863ae",
    storageBucket: "insta-clone-863ae.firebasestorage.app",
    messagingSenderId: "599343109250",
    appId: "1:599343109250:web:1306ec63908ba21c54509b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const loginBtn = document.getElementById("login-btn");
const identityInput = document.getElementById("login-identity");
const passwordInput = document.getElementById("login-password");
const errorMsg = document.getElementById("error-msg");

loginBtn.addEventListener("click", loginUser);

passwordInput.addEventListener("keydown", handleEnterLogin);
identityInput.addEventListener("keydown", handleEnterLogin);

function handleEnterLogin(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        loginUser();
    }
}

async function loginUser() {
    const rawIdentity = identityInput.value.trim();
    const identityLower = rawIdentity.toLowerCase();
    const phoneNumber = normalizePhone(rawIdentity);
    const password = passwordInput.value.trim();

    hideError();

    if (!rawIdentity || !password) {
        showError("Please fill in all fields.");
        return;
    }

    setLoading(true);

    try {
        const usersRef = collection(db, "users");
        let foundUser = null;

        if (isProbablyEmail(rawIdentity)) {
            foundUser = await findUserByField(usersRef, "email", identityLower, password);
        }

        if (!foundUser && phoneNumber) {
            foundUser = await findUserByField(usersRef, "phone", phoneNumber, password);
        }

        if (!foundUser) {
            foundUser = await findUserByField(usersRef, "username", identityLower, password);
        }

        if (!foundUser) {
            foundUser = await findUserByField(usersRef, "username", rawIdentity, password);
        }

        if (foundUser && foundUser.username) {
            localStorage.setItem("active_user", foundUser.username);
            localStorage.setItem("active_user_doc_id", foundUser.docId);
            localStorage.setItem("active_user_full_name", foundUser.fullName || foundUser.name || "");
            localStorage.setItem("active_user_profile_pic", foundUser.profilePic || "");

            window.location.href = "home.html";
            return;
        }

        showError("Sorry, your phone number, username, email, or password was incorrect.");
        setLoading(false);
    } catch (err) {
        console.error(err);
        showError("Server error. Try again.");
        setLoading(false);
    }
}

async function findUserByField(usersRef, fieldName, fieldValue, password) {
    if (!fieldValue) return null;

    const userQuery = query(
        usersRef,
        where(fieldName, "==", fieldValue),
        where("password", "==", password)
    );

    const snap = await getDocs(userQuery);

    if (snap.empty) return null;

    const userDoc = snap.docs[0];

    return {
        docId: userDoc.id,
        ...userDoc.data()
    };
}

function normalizePhone(value) {
    let phone = value.trim();

    phone = phone.replace(/\s+/g, "");
    phone = phone.replace(/-/g, "");
    phone = phone.replace(/[()]/g, "");

    if (phone.startsWith("+91")) {
        phone = phone.slice(3);
    }

    if (phone.startsWith("91") && phone.length === 12) {
        phone = phone.slice(2);
    }

    phone = phone.replace(/\D/g, "");

    if (/^[6-9]\d{9}$/.test(phone)) {
        return phone;
    }

    return "";
}

function isProbablyEmail(value) {
    return value.includes("@");
}

function setLoading(isLoading) {
    loginBtn.disabled = isLoading;
    loginBtn.innerText = isLoading ? "Logging in..." : "Log in";
}

function showError(text) {
    errorMsg.innerText = text;
    errorMsg.style.display = "block";
}

function hideError() {
    errorMsg.innerText = "";
    errorMsg.style.display = "none";
}
</script>

</body>
</html>
